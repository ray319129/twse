/* AI 總覽:一次整理所有持倉重點 + 依各股「預期」判斷停利停損 + 整體總結。
   需 Vercel /api/health(取各檔健檢,單一事實來源)與 /api/portfolio_review(AI 綜合判讀)。
   持倉(含成本)一次性送 AI 分析、不留存(同截圖辨識);成本最終仍只存本機 localStorage。 */
function _portHealthDigest(d){
  if(!d||!d.scores)return null;
  const style=d.default_style||Object.keys(d.scores)[0]||'value_investing';
  const sc=d.scores[style]||{};
  const dims={};(d.engines||[]).forEach(e=>{dims[e.label]=isNum(e.score)?Math.round(e.score*10)/10:null;});
  const wantKeys={pe:'本益比',pb:'股價淨值比',dividend_yield:'殖利率',peg:'PEG',pe_percentile:'PE歷史百分位',
    rsi14:'RSI',ma_alignment:'均線排列',macd:'MACD',kd:'KD',adx:'ADX',
    monthly_revenue_yoy:'月營收年增',revenue_yoy_q:'季營收年增',gross_margin:'毛利率',net_margin:'淨利率',roe:'ROE',
    inst_buy_streak:'法人連買',inst_net_5d:'法人5日淨買',foreign_holding_pct:'外資持股',
    news_net_sentiment_30d:'近30天新聞情緒'};
  const metrics=[];let newsSummary='';
  (d.engines||[]).forEach(e=>(e.metrics||[]).forEach(m=>{
    if(wantKeys[m.key]&&m.value!==null&&m.value!==undefined)metrics.push({k:wantKeys[m.key],v:m.value,u:m.unit||'',r:m.rating||''});
    if(m.key==='ai_news_summary'&&m.value)newsSummary=String(m.value);
  }));
  const sum=d.ai_summary||{};
  return {total:isNum(sc.total)?Math.round(sc.total*10)/10:null,risk_level:d.risk_level||null,
    diagnosis:(sc.diagnosis&&sc.diagnosis.label)||'',dims,swing:d.swing||null,
    dcf:(d.dcf&&d.dcf.available)?d.dcf:null,metrics,
    pros:(sum.pros||[]).slice(0,4),cons:(sum.cons||[]).slice(0,4),news:newsSummary};
}
let _portReviewBusy=false;
function portAIReview(){
  if(!HEALTH_API_ENABLED){alert('AI 總覽需要部署 Vercel API(即時查詢未啟用)。');return;}
  if(_portReviewBusy)return;
  const box=$('#port-ai-review');if(!box)return;
  const ids=PORT.positions.map(p=>String(p.id));if(!ids.length)return;
  _portReviewBusy=true;
  const setStatus=t=>{box.innerHTML=`<div class="port-card" style="margin-top:14px"><div class="pi-title">🧠 AI 總覽</div>
    <div class="par-status"><span class="spin"></span>${esc(t)}</div>
    <div class="par-priv">🔒 持倉(含成本)會一次性送 AI 分析、不留存;成本仍只存本機。</div></div>`;};
  const missing=ids.filter(id=>!HEALTH_CACHE[id]);
  let done=ids.length-missing.length;
  setStatus(`健檢資料準備中(${done}/${ids.length})…`);
  Promise.all(missing.map(id=>
    fetch(HEALTH_API_BASE+'/api/health?stock='+encodeURIComponent(id)).then(r=>r.ok?r.json():null)
      .then(d=>{if(d&&!d.error)HEALTH_CACHE[id]=d;}).catch(()=>{})
      .then(()=>{done++;setStatus(`健檢資料準備中(${done}/${ids.length})…`);})
  )).then(()=>{
    const rows=PORT.positions.map(p=>{
      const id=String(p.id),d=HEALTH_CACHE[id];
      const pr=portPriceOf(id),price=pr?pr.close:(isNum(p.price)?Number(p.price):null);
      const sh=Number(p.shares)||0,cost=Number(p.cost)||0,mkt=isNum(price)?sh*price:null;
      const pnlPct=isNum(price)&&cost>0?(price-cost)/cost*100:null;
      return {id,name:p.name||(pr&&pr.name)||'',industry:(pr&&pr.industry)||(d&&d.industry)||'',
        shares:sh,cost,price,pnl_pct:isNum(pnlPct)?Math.round(pnlPct*10)/10:null,
        market_value:isNum(mkt)?Math.round(mkt):null,health:_portHealthDigest(d)};
    });
    let totCost=0,totMkt=0,hv=true;rows.forEach(r=>{totCost+=r.shares*r.cost;if(isNum(r.market_value))totMkt+=r.market_value;else hv=false;});
    const totals={cost:Math.round(totCost),market:hv?Math.round(totMkt):null,
      pnl:hv?Math.round(totMkt-totCost):null,pnl_pct:hv&&totCost>0?Math.round((totMkt-totCost)/totCost*1000)/10:null};
    const submitted=rows.length;
    /* 依市值排序、上限 15 檔,再切成每塊 3 檔平行呼叫(實測 4 檔約 43s、3 檔約 32s,
       留足 Vercel 60s 硬限的餘裕,含冷啟動也安全)。 */
    const capped=[...rows].sort((a,b)=>(b.market_value||0)-(a.market_value||0)).slice(0,15);
    const analyzed=capped.length;
    const chunks=[];for(let i=0;i<capped.length;i+=3)chunks.push(capped.slice(i,i+3));
    setStatus(`AI 逐檔分析中…(${analyzed} 檔,分 ${chunks.length} 批平行處理,約 20~40 秒)`);
    Promise.all(chunks.map(ch=>_portReviewPost({task:'positions',positions:ch})))
      .then(results=>{
        const positions=[].concat.apply([],results.map(r=>(r&&r.positions)||[]));
        const vmap={};positions.forEach(p=>{vmap[p.id]=p.verdict;});
        const ovIn=capped.map(r=>({id:r.id,name:r.name,industry:r.industry,pnl_pct:r.pnl_pct,
          market_value:r.market_value,verdict:vmap[r.id]||'',
          health:r.health?{total:r.health.total,dims:r.health.dims}:null}));
        setStatus('彙整整體總結中…');
        return _portReviewPost({task:'overall',positions:ovIn,totals}).then(ov=>{
          _portRenderAIReview({overall:(ov&&ov.overall)||{},positions,analyzed,submitted});
        });
      }).catch(e=>{setStatus('AI 分析失敗:'+(e&&e.message||e));}).then(()=>{_portReviewBusy=false;});
  });
}
/* 單次 POST /api/portfolio_review:讀 text 再 parse,非 JSON(平台逾時/錯誤頁)給友善訊息。 */
function _portReviewPost(body){
  return fetch(HEALTH_API_BASE+'/api/portfolio_review',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)}).then(r=>r.text().then(t=>({ok:r.ok,status:r.status,text:t}))).then(o=>{
      let res=null;try{res=JSON.parse(o.text);}catch(_){}
      if(!res){
        const timeout=o.status===504||/timeout|FUNCTION_INVOCATION|too long/i.test(o.text||'');
        throw new Error(timeout?'AI 運算逾時。請稍後再試,或先刪掉幾檔市值較小的持倉再試。'
          :('伺服器回應異常(HTTP '+o.status+'),請稍後再試。'));
      }
      if(res.error)throw new Error(res.error);
      return res;
    });
}

function portImportFile(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=()=>{const fl=inp.files&&inp.files[0];if(!fl)return;const rd=new FileReader();
    rd.onload=()=>{try{const o=JSON.parse(rd.result);
      if(o&&o.accounts&&Object.keys(o.accounts).length){          /* 新版:多帳戶備份 */
        ACC={v:o.v||1,active:(o.accounts[o.active]?o.active:Object.keys(o.accounts)[0]),accounts:o.accounts,updated:o.updated||null};
        PORT={v:2,positions:ACC.accounts[ACC.active]||[],updated:ACC.updated};accSaveAll();
        const tot=Object.values(ACC.accounts).reduce((n,l)=>n+(l||[]).length,0);
        renderPortfolio();alert(`已匯入 ${Object.keys(ACC.accounts).length} 個帳戶、共 ${tot} 檔。`);return;}
      if(!o||!Array.isArray(o.positions))throw new Error('格式不符');
      /* 舊版:單一持倉備份 → 匯入成目前帳戶 */
      PORT.positions=o.positions;portSave();renderPortfolio();
      alert(`已匯入 ${o.positions.length} 檔到帳戶「${ACC.active}」。`);}
      catch(e){alert('匯入失敗:'+(e&&e.message||e));}};rd.readAsText(fl);};
  inp.click();
}

/* 持股撞事件:事件行事曆(DATA.events,市場級公開資訊)× 本地持倉的 client-side join。
   個股層級目前僅台積法說→2330(未來可擴充個股事件表);其餘為市場級高風險事件 × 你的曝險。 */
const EVENT_STOCK={tsmc:['2330']};
function portEventInfo(){
  const ev=(DATA&&DATA.events)||null,byStock={};
  if(!ev||!Array.isArray(ev.events)||!ev.events.length||!PORT.positions.length)return {ev:null,byStock,stockHits:[],marketHigh:[]};
  const held=new Set(PORT.positions.map(p=>String(p.id))),stockHits=[];
  ev.events.forEach(e=>{(EVENT_STOCK[e.type]||[]).forEach(id=>{if(held.has(id)){stockHits.push({e,id});(byStock[id]=byStock[id]||[]).push(e);}});});
  return {ev,byStock,stockHits,marketHigh:ev.events.filter(e=>e.impact==='high')};
}
function portEventAlertHtml(info,expCount,expBase,expBaseLabel,topInd){
  const {ev,stockHits,marketHigh}=info;
  if(!ev||(!stockHits.length&&!marketHigh.length))return'';
  const ahead=e=>e.days_ahead===0?'今天':e.days_ahead===1?'明天':e.days_ahead+'天後';
  const nameOf=id=>{const p=portGet(id);return p&&p.name?p.name:'';};
  let lines='';
  stockHits.forEach(({e,id})=>{lines+=`<div class="pe-line">⚠️ 你持有的 <b>${esc(id)} ${esc(nameOf(id))}</b> — ${esc(e.title)}（${esc(e.date||'')} ${ahead(e)}）</div>`;});
  if(marketHigh.length){
    const titles=[...new Set(marketHigh.map(e=>e.title))].join('、');
    const soonest=marketHigh.slice().sort((a,b)=>a.days_ahead-b.days_ahead)[0];
    const indTxt=topInd&&expBase?` · 最集中 ${esc(topInd[0])} ${Math.round(topInd[1]/expBase*100)}%`:'';
    lines+=`<div class="pe-line">📅 未來 ${ev.horizon_days||7} 日高風險事件:<b>${esc(titles)}</b>（最近 ${ahead(soonest)}）。你留倉 <b>${expCount}</b> 檔 · ${expBaseLabel} ${fmtInt(expBase)}${indTxt} — 隔夜跳空風險偏高,控管留倉部位、嚴設停損,別在事件前一天重押。</div>`;
  }
  return `<div class="port-event-alert"><div class="pe-title">🚨 留倉撞事件提醒</div>${lines}</div>`;
}

  LED=p.ledger||[];
  const dates=[...new Set(LED.map(r=>r.date).filter(Boolean))].sort().reverse();
  if(fDate!=='all'&&fDate!==null&&!dates.includes(fDate))fDate='all'; /* selected date no longer present */
  const dateOpts=`<option value="all">全部選股日</option>`+dates.map(d=>`<option value="${esc(d)}"${fDate===d?' selected':''}>${esc(d)}</option>`).join('');
  const ledArea=LED.length?`
    <div class="sec-h"><span class="bar"></span>追蹤台帳 <span class="cnt">仍追蹤 ${isNum(p.ledger_total)?p.ledger_total:LED.length} 檔</span></div>
    <div class="filters" role="group" aria-label="台帳篩選">
      ${['all:全部','win:獲利','loss:虧損','止損:止損','移動停利:移動停利','持有中:持有中'].map(x=>{const[k,t]=x.split(':');return `<button type="button" class="fchip ${fStatus===k?'on':''}" data-st="${k}" aria-pressed="${fStatus===k}">${t}</button>`;}).join('')}
      <span class="sep"></span>
      ${['all:全部型態','動能:動能','品質:品質','均衡:均衡'].map(x=>{const[k,t]=x.split(':');return `<button type="button" class="fchip ${fProfile===k?'on':''}" data-pf="${k}" aria-pressed="${fProfile===k}">${t}</button>`;}).join('')}
      <span class="sep"></span>
      <select class="sel" id="fdate" aria-label="依選股日篩選">${dateOpts}</select>
      <input class="search" id="q" placeholder="搜尋代號 / 名稱" value="${esc(q)}" aria-label="搜尋代號或名稱">
    </div>
    <div id="ledtable"></div>`
    :`<div class="empty"><span class="ei">⏳</span>績效資料累積中 — 選股需經過至少 1 個交易日才有後續報酬,系統每天自動更新。</div>`;

  /* 選股 vs 執行 + 跳空棄單機會成本(有 signal 資料才顯示) */
  const sx=p.signal_vs_exec||{}, sig=p.signal||{}, sk=p.skip_cost||{};
  let edge='';
  if(isNum(sig.avg_ret)){
    let cards='<div class="stats">';
    cards+=`<div class="stat"><div class="v ${cls(sig.avg_ret)}">${fmt(sig.avg_ret)}%</div><div class="l">選股報酬 signal<br>從選股日收盤持有到最新 · 勝率 ${isNum(sig.win_rate)?sig.win_rate+'%':'-'} · ${isNum(sig.n)?sig.n:0} 檔</div></div>`;
    cards+=`<div class="stat"><div class="v ${cls(sx.exec_avg_ret)}">${isNum(sx.exec_avg_ret)?fmt(sx.exec_avg_ret)+'%':'—'}</div><div class="l">執行報酬 execution<br>照規則(跳空棄單視為未進場)· ${isNum(sx.n_decided)?sx.n_decided:0} 筆已決策</div></div>`;
    cards+=`<div class="stat"><div class="v ${cls(sx.delta)}">${isNum(sx.delta)?fmt(sx.delta)+'%':'—'}</div><div class="l">執行層 ${isNum(sx.delta)?(sx.delta<0?'<span class="down">在扣分</span>':'<span class="up">在加分</span>'):'—'}<br>execution − signal(edge 在選股還是執行)</div></div>`;
    cards+='</div>';
    const bg=sk.by_gap||{}, keys=Object.keys(bg);
    let skTab;
    if(isNum(sk.n)&&sk.n>0&&keys.length){
      skTab=`<div class="tbl-wrap"><table class="t"><thead><tr><th>跳空區間</th><th class="r">樣本</th><th class="r">勝率</th><th class="r">平均報酬</th><th class="r">平均最高漲幅</th></tr></thead><tbody>`
        +keys.map(k=>{const s=bg[k]||{};return `<tr><td class="tk">${esc(k)}</td><td class="r num">${isNum(s.n)?s.n:'-'}</td><td class="r num">${isNum(s.win_rate)?s.win_rate+'%':'-'}</td><td class="r num ${cls(s.avg_ret)}">${fmt(s.avg_ret)}%</td><td class="r num" style="color:var(--warn)">${isNum(s.avg_maxgain)?fmt(s.avg_maxgain)+'%':'-'}</td></tr>`;}).join('')
        +`</tbody></table></div><div class="hint">「跳空開高棄單」的票若當初照隔日開盤買進的後續表現;明顯為正 = 3% 一刀切在錯失 alpha。</div>`;
    } else {
      skTab=`<div class="empty" style="padding:14px"><span class="ei">⏳</span>尚無「跳空棄單」樣本可評估(需有開高超過門檻且已成熟的交易)。</div>`;
    }
    edge=`<div class="sec-h"><span class="bar"></span>選股 vs 執行 — edge 在哪?</div>${cards}<div class="sec-h"><span class="bar"></span>跳空棄單機會成本</div>${skTab}`;
  }

  const histNote=isHist?'<span class="tag-latest">最新</span> 績效統計與台帳恆顯示最新資料,不隨上方選股日切換。':'';
  $('#p-perf').innerHTML=`<div class="lead">每天自動更新過去所有核心選股後續走勢。共追蹤 <b>${isNum(p.total_tracked)?p.total_tracked:0}</b> 檔。
    <span style="color:var(--muted-2);font-size:12px">上方統計以每日收盤計;下方台帳<b>未出場</b>的部位盤中會用即時報價重算(標 <span class="led-dot" style="animation:none"></span> 者)。</span>${histNote}</div>`+stats+htab+edge+ledArea;

  if(LED.length){
    /* chip clicks only update state + redraw rows; rebuild the chip bar's active state in place
       so the search box keeps focus/caret */
    const refreshChips=()=>{
      $('#p-perf').querySelectorAll('[data-st]').forEach(c=>{const on=c.dataset.st===fStatus;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on);});
      $('#p-perf').querySelectorAll('[data-pf]').forEach(c=>{const on=c.dataset.pf===fProfile;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on);});
    };
    $('#p-perf').querySelectorAll('[data-st]').forEach(c=>c.onclick=()=>{fStatus=c.dataset.st;refreshChips();drawLedger();});
    $('#p-perf').querySelectorAll('[data-pf]').forEach(c=>c.onclick=()=>{fProfile=c.dataset.pf;refreshChips();drawLedger();});
    $('#fdate').onchange=e=>{fDate=e.target.value;drawLedger();};
    const qi=$('#q');qi.oninput=()=>{q=qi.value;drawLedger();};
    drawLedger();
  }
}
/* ============================================================
   我的實戰紀錄(2026-07-19)— 在台帳標記「我買了 / 我跳過」,量化「人工挑選 vs 全名單」。
   動機:使用者不是照單全收,而是拿核心+觀察清單自己逐檔分析後挑一部分買。
   系統原本完全量不到「他的人工判斷是加分還是扣分」—— 這是最大的盲區。
   標記自 2026-07-23 起**雲端同步**(使用者要求跨裝置統一);持倉的成本/張數仍只存本機。
   ============================================================ */
/* ---------- 跨裝置同步(2026-07-23,使用者:「不同裝置用,完全沒辦法統一數據」)----------
   儲存升級成兩層:
     MYPICKF = {key: {v:'bought'|'skipped'|null, t:毫秒}}  ← 真正的儲存/同步格式
     MYPICK  = {key: 'bought'|'skipped'}                    ← 由 MYPICKF 衍生的顯示用檢視
   所有既有顯示邏輯照舊讀 MYPICK,完全不用改。
   v=null 是**墓碑**(取消標記):沒有它,A 裝置取消的標記會被 B 裝置的舊資料復活。
   合併規則:每鍵比 t,新者勝 —— 伺服器端(api/watchlist.py)也做同一套,
   兩台幾乎同時送也不會互相蓋掉。雲端檔=config/my_marks.json(與自選池同一組 secret)。
   ⚠️ repo 是公開的:標記只有「哪天|哪檔|買或跳」,無張數/成本/損益(與自選池同界線)。 */
const MYPICK_KEY='twse-mypicks';
let MYPICK={},MYPICKF={};
function _mpDerive(){MYPICK={};for(const[k,o]of Object.entries(MYPICKF))if(o&&o.v)MYPICK[k]=o.v;}
function mpLoad(){
  MYPICKF={};
  let upgraded=false;
  try{
    const r=localStorage.getItem(MYPICK_KEY);
    if(r){const o=JSON.parse(r)||{};
      for(const[k,v]of Object.entries(o)){
        /* 清掉誤綁按鈕寫進來的垃圾鍵(見 mpBindBtns 的說明);正常 key 一定是「日期|代號」 */
        if(!k||k.indexOf('|')<0){upgraded=true;continue;}
        if(typeof v==='string'){MYPICKF[k]={v,t:Date.now()};upgraded=true;}  /* 舊格式(純字串)自動升級 */
        else MYPICKF[k]=v;
      }
    }
  }catch(e){MYPICKF={};}
  _mpDerive();
  /* ⚠️ 升級後要**立刻存回**,把 t 定住。否則舊格式每次載入都重新取得 Date.now(),
     這些標記會永遠比雲端「新」→ 每次合併都贏 → 其他裝置取消掉的標記會一直被復活。 */
  if(upgraded)mpSave();
}
function mpSave(){try{localStorage.setItem(MYPICK_KEY,JSON.stringify(MYPICKF));}catch(e){alert('本機儲存失敗:'+(e&&e.message||e));}}
const mpKey=r=>`${r.date}|${r.stock_id}`;
/* 「跳過」只認你真的按下去的那一下(2026-08-07 使用者要求)。
   舊規則是「當天點過任何一檔買 → 同日其餘沒點的自動視為跳過」,是為了省操作成本,
   但它把三種完全不同的心理狀態混成同一格:
     (a) 看過、明確不要  → 真的是「跳過」
     (b) 沒把握、刻意不表態 → 使用者說「有些我不太確定,買跟跳都不會按」
     (c) 根本沒看到
   (b)(c) 被灌進對照組,「你跳過的」就不再是你的判斷,量化人工選股就失去意義。

   還有一個更硬的錯:推論是**按日期**算的,所以「X 日買進、Y 日又被推薦但沒重標」的
   股票會在 Y 日被記成「看過沒買」—— 實際上你正抱著它。台帳 140 檔有 39 檔(28%)
   跨多天重複出現,這是遲早會踩到的。改成只認明確標記後,這個問題一併消失。

   代價:對照組樣本變小(25 → 13),累積變慢。這是使用者知情下的取捨 —— 寧可樣本少,
   不要對照組裡混進根本不是他判斷的東西。 */
function mpGet(r){
  return MYPICK[mpKey(r)]||null;
}
/* 核心精選卡片上的買/跳(2026-07-19 加):使用者每天第一個看的就是這裡,在這標記最自然。
   key 與台帳共用同一組(選股日|代號),所以兩邊標記互通、統計一致。 */
function mpCardBtns(s){
  const d=(typeof DATA!=='undefined'&&DATA&&DATA.date)?String(DATA.date).slice(0,10):null;
  if(!d||!s||!s.stock_id)return '';
  const k=`${d}|${s.stock_id}`,v=MYPICK[k]||null;
  return `<div class="mp-card">
    <button class="mp-b${v==='bought'?' on-b':''}" data-mk="${esc(k)}" data-mv="bought" title="我買了這檔">買</button>
    <button class="mp-b${v==='skipped'?' on-s':''}" data-mk="${esc(k)}" data-mv="skipped" title="我看過但沒買">跳</button>
  </div>`;
}
/* 就地同步同一個 key 的所有按鈕(核心卡 + 台帳可能同時存在),不整段重繪、不跳掉捲動位置 */
function mpSyncBtns(k){
  const v=MYPICK[k]||null;
  document.querySelectorAll('.mp-b').forEach(b=>{
    if(b.dataset.mk!==k)return;
    b.classList.toggle('on-b', v==='bought'&&b.dataset.mv==='bought');
    b.classList.toggle('on-s', v==='skipped'&&b.dataset.mv==='skipped');
  });
}
function mpBindBtns(root){
  /* ⚠️ 選擇器必須帶 [data-mk] —— 只綁「買/跳」標記鈕。
     「☁ 同步」與「立即上傳」也用 .mp-b 這個 class(共用外觀),而且同樣被塞在 #ledtable 裡
     (mpSummaryHtml 的輸出),所以純 '.mp-b' 會把它們的 inline onclick **整個覆蓋掉** ——
     按下去不會跳出密鑰輸入框,反而執行 mpSet(undefined, undefined) 在標記裡塞一個
     "undefined" 垃圾鍵。2026-08-06 使用者回報「手機點同步沒有跳出視窗」就是這個。
     (自選池的同步鈕 class="refresh" 不同名,所以一直是好的 —— 這也是為什麼電腦有密鑰、手機沒有。) */
  (root||document).querySelectorAll('.mp-b[data-mk]').forEach(b=>{
    if(b._mpBound)return; b._mpBound=1;
    b.onclick=e=>{e.stopPropagation();e.preventDefault();mpSet(b.dataset.mk,b.dataset.mv);};
  });
}
function mpSet(k,v){
  if(!k||!v)return;                                /* 防呆:key/值缺一不可,別讓誤綁的按鈕寫進垃圾鍵 */
  const cur=MYPICKF[k]&&MYPICKF[k].v;
  MYPICKF[k]={v:(cur===v?null:v),t:Date.now()};    /* 再點同一顆=取消 → 留墓碑供跨裝置合併 */
  _mpDerive();
  mpSave(); mpSyncBtns(k);
  mpQueueSync();                                   /* 跨裝置:改動後自動排程上傳(去抖) */
  if(typeof LED!=='undefined'&&LED&&LED.length&&$('#ledtable'))drawLedger();  /* 同步更新台帳上方的三組對照 */
}

/* ---------- 買/跳雲端同步 ----------
   策略:頁面載入先拉雲端合併(不需要 secret,GET 是公開的);
   有改動時去抖 3 秒自動 POST(需要 secret —— 與自選池共用同一把,已存本機就靜默送,
   沒存過則不打擾,狀態列會顯示「未連雲端」點了才提示輸入)。 */
let _mpSyncTimer=null,_mpSyncState='';   /* ''|'ok'|'dirty'|'err'|'off' */
/* 上次從雲端拉到的快照,用來算「這台裝置有幾筆還沒上雲」。
   ⚠️ 這個數字一定要**明顯**顯示出來:原本只有一行 10.5px 灰字寫「未連雲端」,
   結果手機累積了 6 筆買進標記兩週都沒人發現,兩台裝置的統計長期不一致。 */
let _MP_REMOTE=null;
function mpUnsyncedCount(){
  if(_MP_REMOTE===null)return 0;            /* 還沒拉過雲端 → 無從比較,不亂報 */
  let n=0;
  for(const[k,lo]of Object.entries(MYPICKF)){
    const ro=_MP_REMOTE[k];
    if(!ro||(+lo.t||0)>(+ro.t||0))n++;
  }
  return n;
}
function mpHasSecret(){try{return !!localStorage.getItem('twse-wl-secret');}catch(e){return false;}}
/* 未同步橫幅:放在「我的實戰紀錄」卡片內,講清楚後果(這台的數字跟別台不一樣)與怎麼修。 */
/* ⚠️ 這裡的按鈕**不要**用 .mp-b class —— 它會被 mpBindBtns 掃到(見該函式說明)。用 .refresh。
   密鑰輸入也**不用 prompt()**:iOS Safari 一旦按過「不再顯示」就會靜默封鎖所有對話框,
   使用者按了沒反應又找不出原因。改成橫幅內建輸入框,在哪都能用。 */
function mpSyncBanner(){
  const n=mpUnsyncedCount();
  if(!n)return '';
  if(!mpHasSecret()){
    return `<div class="mp-verdict down">
      <div>⚠ 本機有 <b>${n}</b> 筆標記還沒上雲端 —— 這台裝置<b>沒設定過同步密鑰</b>,
        看到的統計會與其他裝置<b>不一致</b>。</div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px">
        <input id="mp-secret" type="password" inputmode="text" autocomplete="off" autocapitalize="off"
          autocorrect="off" spellcheck="false" placeholder="同步密鑰(WATCHLIST_SECRET)"
          style="flex:1;min-width:180px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);
                 background:var(--bg);color:var(--ink);font-size:13px">
        <button type="button" class="refresh" onclick="mpSaveSecretAndPush()">連線並上傳</button>
      </div>
      <div style="font-size:10.5px;color:var(--muted-2);margin-top:6px">
        與自選池同一把密鑰,只需輸入一次,存在這台裝置的瀏覽器裡。</div>
    </div>`;
  }
  return `<div class="mp-verdict down" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span>⚠ 本機有 <b>${n}</b> 筆標記還沒上雲端(尚未上傳完成)—— 這台看到的統計會與其他裝置<b>不一致</b>。</span>
    <button type="button" class="refresh" onclick="mpCloudPush(false)">立即上傳</button>
  </div>`;
}
function mpSaveSecretAndPush(){
  const el=document.getElementById('mp-secret');
  const s=((el&&el.value)||'').trim();
  if(!s){_mpSetState('err','請先輸入密鑰');if(el)el.focus();return;}
  try{localStorage.setItem('twse-wl-secret',s);}catch(e){}
  mpCloudPush(true);        /* silent:錯誤走狀態列,不靠 alert(同樣可能被 Safari 封鎖) */
}
function _mpSetState(s,msg){
  _mpSyncState=s;
  const el=$('#mp-sync-st');
  if(el){el.textContent=msg||'';el.style.color=s==='err'?'var(--down-ink)':'var(--muted-2)';}
}
function mpMergeRemote(remote){
  let changed=false;
  for(const[k,ro]of Object.entries(remote||{})){
    if(!ro||typeof ro!=='object')continue;
    const lo=MYPICKF[k];
    if(!lo||((+ro.t||0)>(+lo.t||0))){MYPICKF[k]=ro;changed=true;}
  }
  if(changed){_mpDerive();mpSave();}
  return changed;
}
function _mpLocalOnlyNewer(remote){
  remote=remote||{};
  for(const[k,lo]of Object.entries(MYPICKF)){
    const ro=remote[k];
    if(!ro||(+lo.t||0)>(+ro.t||0))return true;
  }
  return false;
}
function mpCloudLoad(){
  if(!HEALTH_API_ENABLED)return;
  fetch(HEALTH_API_BASE+'/api/watchlist?what=marks').then(r=>r.ok?r.json():null).then(j=>{
    if(!j)return;
    const remote=j.marks||{};
    _MP_REMOTE=remote;
    const got=mpMergeRemote(remote);
    /* 不管雲端有沒有新東西都要重畫 —— 未同步橫幅的存在與否也要跟著更新 */
    if(typeof LED!=='undefined'&&LED&&LED.length&&$('#ledtable'))drawLedger();
    if(got)document.querySelectorAll('.mp-b').forEach(b=>{if(b.dataset.mk)mpSyncBtns(b.dataset.mk);});
    /* 本機有雲端沒有的(或較新的)→ 若已存 secret 就靜默補上傳 */
    if(_mpLocalOnlyNewer(remote)){
      if(mpHasSecret())mpCloudPush(true);
      else _mpSetState('dirty',`本機 ${mpUnsyncedCount()} 筆未上雲 — 點「同步」`);
    }else _mpSetState('ok','已同步');
  }).catch(()=>_mpSetState('err','雲端讀取失敗'));
}
function mpQueueSync(){
  _mpSetState('dirty','未同步…');
  if(_mpSyncTimer)clearTimeout(_mpSyncTimer);
  _mpSyncTimer=setTimeout(()=>{
    if(mpHasSecret()){mpCloudPush(true);return;}      /* 有密鑰才自動送;沒有就留 dirty 狀態 */
    _mpSetState('dirty','未連雲端 — 點「同步」設定');
    /* 重畫讓未同步橫幅立刻出現 —— 別讓使用者標記一整天才發現根本沒上傳 */
    if(typeof LED!=='undefined'&&LED&&LED.length&&$('#ledtable'))drawLedger();
  },3000);
}
function mpCloudPush(silent){
  if(!HEALTH_API_ENABLED){if(!silent)alert('雲端同步需要部署 Vercel API。');return;}
  const secret=silent?(function(){try{return localStorage.getItem('twse-wl-secret');}catch(e){return null;}})():wlSecret();
  if(!secret){_mpSetState('dirty','未連雲端 — 點「同步」設定');return;}
  if(!Object.keys(MYPICKF).length){if(!silent)alert('還沒有任何標記。');return;}
  _mpSetState('dirty','同步中…');
  fetch(HEALTH_API_BASE+'/api/watchlist',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({marks:MYPICKF,secret})})
    .then(r=>r.json().then(j=>({ok:r.ok,j})))
    .then(({ok,j})=>{
      if(!ok||j.error){
        if(String(j.error||'').includes('secret')){try{localStorage.removeItem('twse-wl-secret');}catch(e){}}
        _mpSetState('err','同步失敗:'+(j.error||'未知'));

function _mpAgg(arr){

}

/* ============================================================
   台帳即時化(2026-07-21)
   批次算的 latest_close 是「上一個收盤」,所以盤中看整個績效分頁等於落後一天 ——
   使用者反映「歷史追蹤與績效也要即時」。
   規則:**只有還沒出場的列**(持有中 / 待隔日進場)才用即時價重算;
   已模擬出場的列是歷史成交,重算會竄改台帳、破壞勝率統計,絕對不能動。
   拿不到即時價就原樣沿用批次值 —— 即時掛掉不該讓台帳變空白。

const LED_OPEN=['持有中','待隔日進場'];
function ledIsOpen(r){return !r.exit_reason||LED_OPEN.includes(r.exit_reason);}
function ledLive(r){
  if(!ledIsOpen(r))return r;
  const lq=LIVE[String(r.stock_id)];
  const px=lq&&isNum(lq.price)?lq.price:null;
  if(px==null||!isNum(r.entry)||r.entry<=0)return r;
  const o=Object.assign({},r);
  o.latest_close=px;
  o.ret_pct=Math.round((px/r.entry-1)*10000)/100;
  /* 期間最高漲幅:即時價創新高才更新,否則沿用批次算的波段高 */
  if(isNum(r.peak_price)&&px>r.peak_price)o.peak_gain_pct=Math.round((px/r.entry-1)*10000)/100;
  /* 超額也要跟著即時走,否則「即時報酬 − 批次基準」是拿兩個時點相減。
     批次基準只到昨收,故複利上今日大盤漲跌幅(PULSE 的加權指數)才對得齊。
     沒有盤中大盤時就沿用批次基準(誤差僅今日一天),不硬掰。 */
  if(isNum(r.bench_ret_pct)){
    const ic=(PULSE&&PULSE.indices&&PULSE.indices['001']&&isNum(PULSE.indices['001'].change_rate))?PULSE.indices['001'].change_rate:null;
    const b=(ic!=null)?((1+r.bench_ret_pct/100)*(1+ic/100)-1)*100:r.bench_ret_pct;
    o.bench_ret_pct=Math.round(b*100)/100;
    o.excess_pct=Math.round((o.ret_pct-b)*100)/100;

  return o;
}
/* 未出場列的即時彙總。放在 #ledtable 內,才能跟著每 20 秒的報價輪詢一起更新,

             +`<div><b>${xw}/${xs.length}</b><i>目前贏過大盤</i></div>`;})()}

    </div>

}

/* ============================================================
   即時報價客戶端(2026-07-19)
   在這之前網頁完全不即時 —— 只讀批次 commit 的靜態 JSON,永遠是上一次批次的快照;
   持倉價格是點進去才現抓 yfinance(延遲報價,實測要等 5~15 秒)。

   造成通知洗版(使用者反映)。現在 vercel.json 的 ignoreCommand 會**跳過**這類建置 ——
   但這也表示「部署上的 alerts.json 不會再更新」。

const RAW_BASE='https://raw.githubusercontent.com/ray319129/twse/main/docs/';

/* 分點連買連賣(docs/branch_streak.json,盤後 21:30 批次算)。
   主力淨買超 = 前5大買超分點 + 前5大賣超分點;連買 = 從最近往回數連續為正的天數。 */
let STREAK=null;
function loadStreak(){

/* 連買連賣 chip + 近 10 日主力淨買超的小柱狀。柱狀讓「連 5 日但金額遞減」這種
   外強中乾的情況看得出來 —— 只給天數會漏掉強度變化。 */
function streakChip(id){
  const s=STREAK&&STREAK[id];
  if(!s||!s.streak)return '';
  const buy=s.dir==='buy';
  const col=buy?'var(--up)':'var(--down)';
  const ser=s.net_series||[];
  const mx=Math.max(...ser.map(Math.abs),1);
  const bars=ser.map(v=>{
    const h=Math.max(1,Math.round(Math.abs(v)/mx*9));
    return `<i style="height:${h}px;background:${v>=0?'var(--up)':'var(--down)'};
      align-self:${v>=0?'flex-end':'flex-start'}"></i>`;}).join('');
  return `<span class="q-streak" title="主力淨買超近 ${ser.length} 日(前5大買超分點+前5大賣超分點)">
    <b style="color:${col}"${tip('streak')}>分點連${buy?'買':'賣'} ${s.streak} 日</b>
    <span class="q-streak-b">${bars}</span></span>`;
}
/* 盤前算好的均線/前高/流通股數/產業別/營收EPS(docs/levels.json)。
   ⚠️ 這份**刻意由前端抓**:Vercel 的 Python 函式不會打包 repo 裡的資料檔,
   放 api/quote.py 讀會靜靜讀不到,產業別/換手率/突破/回測全變「—」(踩過)。 */
function loadLevels(){
  return loadLive('levels.json').then(d=>{LEVELS=(d&&d.levels)||null;return LEVELS;});
}
/* 把 levels 併進即時報價並算衍生欄位。算法寫在這裡是唯一一份,不與後端重複。
     換手率   = 成交張數×1000 ÷ 流通股數
     是否突破 = 現價 > 20日高 × 1.003(與盤中掃描 intraday_scan 同一條規則)
     回測五日線 = |現價/MA5 − 1| ≤ 1.5% 且現價 ≥ MA5×0.985 */
function applyLevels(q){
  if(!q||!LEVELS)return q;
  const L=LEVELS[q.stock_id];if(!L)return q;
  const px=q.price,tv=q.total_volume;
  q.industry=L.industry;q.revenue_yoy=L.revenue_yoy;q.eps_ttm=L.eps_ttm;q.eps_last=L.eps_last;
  q.ma5=L.ma5;q.ma20=L.ma20;q.high20=L.high20;
  q.turnover_rate=(isNum(tv)&&isNum(L.shares)&&L.shares>0)?(tv*1000/L.shares*100):null;
  q.breakout=!!(isNum(px)&&isNum(L.high20)&&px>L.high20*1.003);
  q.at_ma5=!!(isNum(px)&&isNum(L.ma5)&&Math.abs(px/L.ma5-1)<=0.015&&px>=L.ma5*0.985);
  return q;
}
/* 內外盤比走逐筆資料(一檔兩萬多筆),由盤中盯盤每 10 分鐘算一次寫成 deep.json,

/* 盤中時段(台北 09:00–13:35,週一~五)。用使用者本機時間判斷 —— 使用者在台灣,

function inSession(){

function startLiveQuotes(sec){

  setInterval(()=>{if(!document.hidden){loadDeep();loadSeries();loadFresh();loadPulse();}},300000);

/* 盤中大盤即時(docs/pulse.json,盯盤每輪重算)。

/* 資料源狀態(鐵則二:降級要看得見)。FinMind Sponsor 是按月訂閱,到期後全市場即時
   快照就沒了,系統會自動退回 MIS 逐檔 / 昨收 —— 但**絕不能靜默降級**,否則你會拿
   昨收當即時在做決定。這一條也順便當續訂提醒(剩 ≤7 天轉警示色)。 */
function dataSourceBox(){
  const rt=(DATA&&DATA.realtime)||null;
  if(!rt||!rt.sponsor)return '';
  const s=rt.sponsor,a=rt.archive||{};
  const live=!!s.active,dl=s.days_left;
  const warn=live&&isNum(dl)&&dl<=7;

  const label=!live
    ? '非即時 — 已降級為昨收/MIS 逐檔'

  const exp=live&&s.expires
    ? ` · 訂閱至 ${esc(s.expires)}${isNum(dl)?`(剩 ${dl} 天${warn?',該續訂了':''})`:''}` : '';
  const arc=a.days?` · 已存 ${a.days} 個交易日快照 ${a.mb} MB`:'';
  return `<div class="note-box" style="border-left:3px solid ${col}">

   個股健檢(Stock Health)— 2026-06-30 新增
   設計原則:每個分數都可點開回推依據(formula/source/asof/missing_reason),

   ============================================================ */
const HEALTH_RISK_COLOR={Low:'var(--up)',Medium:'var(--warn)',High:'var(--down)',Critical:'var(--down)'};
const HEALTH_RISK_DOT={Low:'🟢',Medium:'🟡',High:'🟠',Critical:'🔴'};
const HEALTH_MISSING_LABEL={stale_cache:'快取不夠新/不夠長,持續累積中',api_unavailable:'資料來源這次抓不到',not_applicable:'目前不適用或無此資料'};
const HEALTH_STATUS_ARROW={improving:'<span class="up">↑</span>',worsening:'<span class="down">↓</span>',stable:'<span class="flat">→</span>'};
const HEALTH_RADAR_ORDER=['financial','growth','value','risk','technical','chip','news'];

function healthStars(n){
  n=Math.max(0,Math.min(5,Math.round(Number(n)||0)));
  return '★'.repeat(n)+'☆'.repeat(5-n);
}
function riskLight(level){
  if(!level)return '<span style="color:var(--muted)">風險等級:資料不足</span>';
  return `<span style="color:${HEALTH_RISK_COLOR[level]||'var(--muted)'};font-weight:800">${HEALTH_RISK_DOT[level]||''} 風險等級:${esc(level)}</span>`;
}
function healthRadar(engines){
  const map={};(engines||[]).forEach(e=>{map[e.key]=e;});
  const n=HEALTH_RADAR_ORDER.length,R=68,CX=90,CY=90;
  const pts=HEALTH_RADAR_ORDER.map((k,i)=>{
    const e=map[k]||{};
    const v=isNum(e.score)?Math.max(0,Math.min(100,Number(e.score)))/100:0;
    const ang=-Math.PI/2+i*(2*Math.PI/n);
    return {x:CX+R*v*Math.cos(ang),y:CY+R*v*Math.sin(ang),
            lx:CX+(R+22)*Math.cos(ang),ly:CY+(R+22)*Math.sin(ang),
            label:e.label||k,has:isNum(e.score)};
  });
  const poly=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const rings=[0.25,0.5,0.75,1].map(f=>{
    const rp=HEALTH_RADAR_ORDER.map((_,i)=>{const ang=-Math.PI/2+i*(2*Math.PI/n);
      return `${(CX+R*f*Math.cos(ang)).toFixed(1)},${(CY+R*f*Math.sin(ang)).toFixed(1)}`;}).join(' ');
    return `<polygon points="${rp}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }).join('');
  const spokes=HEALTH_RADAR_ORDER.map((_,i)=>{const ang=-Math.PI/2+i*(2*Math.PI/n);
    return `<line x1="${CX}" y1="${CY}" x2="${(CX+R*Math.cos(ang)).toFixed(1)}" y2="${(CY+R*Math.sin(ang)).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;}).join('');
  const labels=pts.map(p=>`<text x="${p.lx.toFixed(1)}" y="${p.ly.toFixed(1)}" font-size="9" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">${esc(p.label)}${p.has?'':'(缺)'}</text>`).join('');
  return `<div class="health-radar"><svg viewBox="0 0 180 180">${rings}${spokes}<polygon points="${poly}" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="1.5"/></svg>${labels?`<svg viewBox="0 0 180 180" style="margin-top:-180px">${labels}</svg>`:''}</div>`;
}
function swingBox(label,val,reason){
  return `<div class="health-swing-box"><div class="hsb-l">${esc(label)}</div><div class="hsb-v">${isNum(val)?Math.round(Number(val)):'-'}</div><div class="hsb-r">${esc(reason||'')}</div></div>`;
}
function metricRow(m){
  const has=m.value!==null&&m.value!==undefined;
  const valStr=has?(typeof m.value==='number'?num(m.value,2):esc(String(m.value))):'資料不足';
  const arrow=HEALTH_STATUS_ARROW[m.status]||'';
  const ratingColor=m.rating==='good'?'var(--up)':m.rating==='bad'?'var(--down)':m.rating==='neutral'?'var(--warn)':null;
  const ratingDot=ratingColor?`<span class="hm-dot" style="background:${ratingColor}"></span>`:'';
  const indStr=isNum(m.industry_avg)?`同業約 ${num(m.industry_avg,2)}${esc(m.unit||'')}`:'';
  const missingStr=(!has&&m.missing_reason)?`<span class="hm-missing">(${esc(HEALTH_MISSING_LABEL[m.missing_reason]||m.missing_reason)})</span>`:'';
  const trendStr=(m.trend&&m.trend.length)?m.trend.map(t=>`${esc(t.period)}:${isNum(t.value)?num(t.value,2):'-'}`).join(' → '):'';
  return `<details class="hm-row"><summary>
      <span class="hm-label">${ratingDot}${esc(m.label)}</span>
      <span class="hm-val">${esc(valStr)}${has?esc(m.unit||''):''} ${arrow}</span>

function engineCard(eng){

    <div class="hnl-body">${news.map(newsLinkRow).join('')}</div></details>`:'';
  return `<details class="health-engine-card">

   但那需要每檔的均線 —— 我們有 levels.json(1022 檔),所以做得到:
     · 漲跌幅 chg → 直接用即時價 vs 昨收
     · 20 日動能 r20 → 用即時價 vs 20 日前收盤(levels 沒存,退回批次值)
     · 廣度 a20/a60/bl → 用即時價與 levels 的 ma20/ma60/ma5 現算
   算完就地改寫 _hmData.stocks,再重畫。批次那份的欄位當作 fallback。

   ⚠️ 只覆蓋 levels.json 有的股票(1022 檔,以成交額篩過);其餘沿用批次值。
   所以標題會標明「即時(N 檔)」讓使用者知道涵蓋範圍。 */
/* 取整份報價,不假設伺服器一次吃得下幾檔(2026-08-12 加)。

   ⚠️ **前端在 GitHub Pages、後端在 Vercel,是兩套分開的部署** —— 兩邊版本不同步的空窗
   必然存在(實際踩到:前端 CH 已上到 900,Vercel 還是舊的 MAX_IDS=200)。
   舊伺服器超過上限是**靜默截斷**,沒有錯誤、沒有旗標,結果就是 755 檔只回 200 檔:
   一部分即時、一部分昨收,而使用者完全看不出差別 —— 2026-07-21 已經確認過
   「半新半舊比全舊更糟」。

   所以這裡不信任任何關於伺服器上限的假設:少拿到的就把缺的再要一次,直到沒有進展。
   伺服器夠新時只打 1 次;伺服器還舊時自己補到齊。兩邊誰先部署都不會壞。 */
const QUOTE_CH=900;
async function quoteAll(ids){
  const out={};
  let todo=ids.slice(), guard=0;
  while(todo.length && guard++<8){
    const batch=todo.slice(0,QUOTE_CH);
    const d=await fetch(HEALTH_API_BASE+'/api/quote?ids='+encodeURIComponent(batch.join(',')))
      .then(r=>r.ok?r.json():null).catch(()=>null);
    if(!d||!d.quotes)break;                      /* 端點掛了:用已拿到的部分,別空轉 */
    Object.assign(out,d.quotes);
    const next=todo.filter(id=>!(id in out));
    if(next.length===todo.length)break;          /* 這輪一檔都沒補到 → 不是截斷,是真的沒資料 */
    todo=next;
  }
  return out;
}

let _hmLiveTimer=null,_hmLiveN=0;

/* ⚠️ 這條輪詢是 Vercel Active CPU 的頭號來源(2026-08-12 修)。
   2026-07-21 已經替 `_liveTimer` 修過一模一樣的 bug(見 startLiveQuotes 的註解),
   但**熱力圖這條當時漏掉了** —— 它是全檔唯一沒有 clearInterval、沒有 document.hidden、
   沒有 inSession() 的計時器,開過一次就永遠停不下來:切到別的分頁、收盤、半夜、週末照打。

   規模:熱力圖 755 檔 ÷ 每批 CH 檔 → 每 30 秒數個並行 /api/quote = 每小時數百次呼叫。
   實測 /api/quote 真正的工作只有 2.2ms,但每次冷啟動 `import pandas` 要 846ms,
   所以帳單幾乎全是「一直重新啟動 Python」的錢(實際平均 284ms/次 ≈ 三次有一次冷啟動)。
   開著 10 小時 ≈ 28 分鐘 CPU/天,與 Vercel 用量圖上的尖峰完全吻合;
   4 小時免費額度只夠這樣開 85 小時/月,超過整個專案會被自動暫停。

   ⚠️ 舊版把「熱力圖分頁是否開著」的檢查放在**函式最後**,是打完所有請求才決定要不要重畫 ——
   貴的部分早就花掉了。三道閘門一律放最前面。 */
function startHmLive(){
  stopHmLive();
  if(!_hmReady)return;              /* 還沒載完:initHeatmap 載完會自己再叫一次 */
  hmLive();
  _hmLiveTimer=setInterval(hmLive,30000);
  if(!startHmLive._vis){            /* 切回前景立刻補一次,不讓使用者看到過期價格 */
    startHmLive._vis=true;
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&_hmLiveTimer)hmLive();});
  }
}
function stopHmLive(){if(_hmLiveTimer){clearInterval(_hmLiveTimer);_hmLiveTimer=null;}}

async function hmLive(){
  /* 三道閘門,務必留在最前面(理由見上) */
  if(document.hidden)return;                                    /* 分頁在背景 */
  const _p=$('#p-heatmap');
  if(!_p||!_p.classList.contains('active'))return;              /* 沒在看熱力圖 */
  if(!inSession()&&_hmLiveN)return;                             /* 非盤中且已取過一次即時 */
  if(!_hmData||!_hmData.stocks)return;
  if(!LEVELS)await loadLevels();
  if(!LEVELS)return;
  const ids=_hmData.stocks.map(s=>String(s.id)).filter(id=>LEVELS[id]);
  if(!ids.length)return;
  /* ⚠️ 必須**分批取完整**,不能只取前 200 檔。
     2026-07-21 使用者截圖抓到:熱力圖的台積電顯示 +1.31%(昨收)、自選池顯示 +3.01%(即時)
     —— 因為 200 檔上限剛好把台積電切在外面。**半新半舊比全舊更糟**:
     使用者無從得知眼前這格是今天還是昨天。
     /api/quote 的 MAX_IDS 就是這裡的上限;伺服器端有 20 秒 TTL 快取,
     同一輪的多批其實共用同一份全市場快照,不會多打 FinMind API。

     ⚠️ 但「不多打 FinMind」不等於免費 —— 每一批都是**一次獨立的 Vercel 函式呼叫**,
     每次冷啟動 `import pandas` 要 846ms 純 CPU,而真正的查詢工作只有 2.2ms。
     2026-08-12 把 CH 從 180 提到 900(MAX_IDS 同步 200→1000):755 檔從 5 批變 1 批,
     冷啟動次數直接砍 5 倍。改這個數字前先確認 api/quote.py 的 MAX_IDS 跟得上。 */
  const quotes=await quoteAll(ids);
  if(!Object.keys(quotes).length)return;
  let n=0;
  for(const s of _hmData.stocks){
    const q=quotes[String(s.id)],L=LEVELS[String(s.id)];
    if(!q||!isNum(q.price)||!L)continue;
    const px=q.price;
    s.p=px;
    if(isNum(q.change_pct))s.chg=q.change_pct;
    /* 廣度三項現算 —— 市場氛圍的權重 75% 在這裡,不更新等於整頁都是昨天的 */
    if(isNum(L.ma20))s.a20=px>L.ma20?1:0;
    if(isNum(L.ma60))s.a60=px>L.ma60?1:0;
    if(isNum(L.ma5)&&isNum(L.ma20)&&isNum(L.ma60))s.bl=(L.ma5>L.ma20&&L.ma20>L.ma60&&px>L.ma5)?1:0;
    n++;
  }
  _hmLiveN=n;
  const lbl=$('#hm-date-label');
  const rest=_hmData.stocks.length-n;
  if(lbl)lbl.textContent=rest>0
    ? `即時 ${n} 檔・其餘 ${rest} 檔為 ${_hmData.date} 收盤`
    : `全部 ${n} 檔即時・${new Date().toTimeString().slice(0,5)} 更新`;
  /* 分頁是否開著已在函式最前面擋掉,這裡只需決定畫哪一種 */
  if($('#heatmap-chart').style.display!=='none')renderHeatmap(); else renderMood();
}
function _hmLerp(a,b,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const [ar,ag,ab]=p(a),[br,bg,bb]=p(b);
  return '#'+[ar+(br-ar)*t,ag+(bg-ag)*t,ab+(bb-ab)*t].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
}
function _hmColor(v,maxAbs){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  const neutral=dark?'#1e2840':'#dde2ec';
  const gUp=dark?'#34d27e':'#0f9d58',gDn=dark?'#ff5c63':'#e0383e';
  if(v==null)return neutral;
  const t=Math.min(1,Math.abs(v)/maxAbs);
  return v>=0?_hmLerp(neutral,gUp,t):_hmLerp(neutral,gDn,t);
}

/* 個股 → 產業鏈(sector_map.json,FinMind TaiwanStockIndustryChain:47 產業 / 483 細產業)。
   跟舊版手工 46 條對照表最大的差別是「一檔可以屬於多條產業鏈」——鴻海同時在
   電腦及週邊設備(伺服器/主機板/機殼)、通信網路、連接器、電動車輛,這才是台股在講的族群。
     hmSecsOf 回全部歸屬  → 市場氛圍(一檔可計入多個族群)
     hmSecOf  回代表性那條 → treemap(一檔只能放一格,不然成交額會重複計)
   FinMind 沒收錄的(多為 KY 股,約掃描池 2%)退回 TWSE 原始產業名,不硬塞。 */
function hmSecsOf(s,sm){
  const c=(sm.chain||{})[s.id];
  if(c&&c.length)return c.map(([sec,sub])=>({sec,sub}));
  const raw=s.ind||'其他';
  return [{sec:raw,sub:raw}];
}
function hmSecOf(s,sm){
  const p=(sm.primary||{})[s.id];
  if(p)return {sec:p[0],sub:p[1]};
  const raw=s.ind||'其他';
  return {sec:raw,sub:raw};
}
/* ============================================================
   市場氛圍(2026-07-19)— 各產業/細產業當下偏多還偏空。
   氣氛值(−50~+50)以「廣度」為主而非漲跌幅:只看漲跌幅會被少數大漲股帶偏,
   廣度(多少成分股站上均線/多頭排列)才看得出族群是真轉強還是假彈。
     站上季線比例 35% + 多頭排列比例 25% + 站上月線比例 15% + 20日動能 25%
   每項先置中成 −1~+1(比例 0.5 = 中性 0),加權後 ×50。
   舊版 heatmap.json 沒有廣度欄位(a20/a60/bl)時自動退化成只用動能+漲跌幅,不會壞掉。
   ============================================================ */
const _clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
function _moodOf(arr,hasBreadth){
  const avg=f=>arr.reduce((a,s)=>a+(isNum(f(s))?f(s):0),0)/arr.length;
  const chg=avg(s=>s.chg),r20=avg(s=>s.r20);
  const momc=_clamp(r20/20,-1,1);
  const mood=hasBreadth
    ? 50*(0.35*((avg(s=>s.a60)-0.5)*2)+0.25*((avg(s=>s.bl)-0.5)*2)+0.15*((avg(s=>s.a20)-0.5)*2)+0.25*momc)
    : 50*(0.6*momc+0.4*_clamp(chg/3,-1,1));
  return {chg,r20,mood};
}
/* 依產業鏈分組算氣氛值。一檔股票屬於幾條鏈就計入幾組(鴻海會同時進 電腦及週邊設備、
   通信網路、連接器…),所以各組家數加總會大於總檔數 —— 這是刻意的,族群本來就重疊。 */
function moodAgg(stocks,sm,level){
  const hasBreadth=stocks.some(s=>s.a20!=null);
  const g={};
  for(const s of stocks){
    const seen=new Set();
    for(const {sec,sub} of hmSecsOf(s,sm)){
      const k=level==='sub'?sub:sec;
      if(!k||seen.has(k))continue;                /* 同一檔在同組只算一次 */
      seen.add(k);
      (g[k]=g[k]||[]).push(s);
    }
  }
  const out=[];
  for(const [name,arr] of Object.entries(g)){
    if(arr.length<3)continue;                     /* 家數太少無代表性 */
    const {chg,r20,mood}=_moodOf(arr,hasBreadth);
    out.push({name,n:arr.length,chg,r20,mood,
      up:arr.filter(s=>isNum(s.chg)&&s.chg>0).length,stocks:arr});
  }
  return out.sort((a,b)=>b.mood-a.mood);
}
/* 迷你 K 棒:用最後一根的 [開,高,低,收] 畫「實體+上下影線」,一眼看出當日型態
   (長紅/長黑/十字/上影線=衝高被壓…)。無 OHLC 就回空字串,不畫佔位。 */
function miniK(k){
  if(!Array.isArray(k)||k.length<4||!k.every(isNum))return '<span class="mk-e"></span>';
  const [o,h,l,c]=k, span=h-l;
  const W=9,H=26,cx=W/2;
  if(!(span>0)){                                   /* 一字板(開高低收同價) */
    return `<svg class="mk" width="${W}" height="${H}"><line x1="1" y1="${H/2}" x2="${W-1}" y2="${H/2}" stroke="${c>=o?'var(--up)':'var(--down)'}" stroke-width="2"/></svg>`;
  }
  const y=v=>1+(H-2)*(1-(v-l)/span);
  const up=c>=o, col=up?'var(--up)':'var(--down)';
  const yo=y(o),yc=y(c),top=Math.min(yo,yc),bh=Math.max(1.5,Math.abs(yc-yo));
  return `<svg class="mk" width="${W}" height="${H}" aria-hidden="true">
    <line x1="${cx}" y1="${y(h)}" x2="${cx}" y2="${y(l)}" stroke="${col}" stroke-width="1"/>
    <rect x="1.5" y="${top}" width="${W-3}" height="${bh}" fill="${up?col:'none'}" stroke="${col}" stroke-width="1.2"/>
  </svg>`;
}
function _moodRow(r,i){
  const col=r.mood>=0?'var(--up-ink)':'var(--down-ink)';
  const w=Math.min(100,Math.abs(r.mood)/50*100);
  /* 成分股:依漲跌幅排序,列出 名稱/代號、股價、漲跌幅、最後一根K棒型態 */
  const list=r.stocks.slice().sort((a,b)=>(b.chg==null?-1e9:b.chg)-(a.chg==null?-1e9:a.chg))
    .map(s=>`<div class="mk-row">
        <div class="mk-k">${miniK(s.k)}</div>
        <div class="mk-nm"><b>${esc(s.n||'')}</b><span class="mk-id">${slink(s.id)}</span></div>
        <div class="mk-p num">${s.p==null?'—':num(s.p)}</div>
        <div class="mk-c num ${cls(s.chg)}">${fmt(s.chg)}%</div>
      </div>`).join('');
  return `<div class="mood-r" onclick="if(!event.target.closest('a'))this.classList.toggle('open')">
    <div class="mood-main">
      <div class="mood-nm"><span class="mood-rk">${i+1}</span>${esc(r.name)}<span class="mood-cnt">${r.n}</span></div>
      <div class="mood-num ${cls(r.chg)}">${fmt(r.chg)}%</div>
      <div class="mood-bar"><span style="width:${w}%;background:${col}"></span></div>
      <div class="mood-val" style="color:${col}">${r.mood>=0?'+':''}${r.mood.toFixed(1)}</div>
    </div>
    <div class="mood-sub">
      <div class="mk-meta">上漲 ${r.up}/${r.n} 檔・20日 <span class="${cls(r.r20)}">${fmt(r.r20,1)}%</span></div>
      <div class="mk-head"><span></span><span>名稱 / 代號</span><span class="r">股價</span><span class="r">漲跌幅</span></div>
      ${list}
    </div>
  </div>`;
}
let _moodTab=null;
function setMoodTab(t){_moodTab=t;renderMood();}
function renderMood(){
  const el=$('#mood-view');if(!el||!_hmData||!_hmSM)return;
  /* 首次進入自動選「有內容」的那一邊:全盤偏空的日子預設開多方會是空白(沒用),
     反之亦然。使用者手動切過之後就尊重他的選擇。 */
  if(_moodTab===null){
    const s0=moodAgg(_hmData.stocks,_hmSM,'sec');
    _moodTab=s0.some(r=>r.mood>0)?'long':'short';
  }
  const level=_moodTab==='sub'?'sub':'sec';
  let rows=moodAgg(_hmData.stocks,_hmSM,level);
  if(_moodTab==='long')rows=rows.filter(r=>r.mood>0);
  else if(_moodTab==='short')rows=rows.slice().reverse().filter(r=>r.mood<0);
  /* 大盤氣氛直接用全體個股算,不用各族群加權平均 —— 產業鏈會重疊,
     跨鏈多的權值股(鴻海、台達電)會被重複計到好幾次而放大。 */
  const mkt=_hmData.stocks.length
    ? _moodOf(_hmData.stocks,_hmData.stocks.some(s=>s.a20!=null)).mood : 0;
  const mc=mkt>=0?'var(--up-ink)':'var(--down-ink)';
  const tab=(k,t)=>`<button class="hm-toggle-btn${_moodTab===k?' active':''}" onclick="setMoodTab('${k}')">${t}</button>`;
  /* 單層分類(CMoney 類股)時不顯示「細產業」切換 —— sub===sec,點了會是同一份,徒增困惑。 */
  const single=!!(_hmSM&&_hmSM._stats&&_hmSM._stats.single_level);
  const noteSrc=single
    ?`分類為 CMoney 產業類股(${(_hmSM._stats.industries)||''} 類股),一檔一類,家數<3 的族群不列。`
    :`分類為 FinMind 產業鏈,一檔可跨多條鏈,家數<3 的族群不列。`;
  el.innerHTML=`<div class="mood-head">
      <div class="mood-mkt">市場氛圍 <b style="color:${mc}">${mkt>=0?'+':''}${mkt.toFixed(1)}</b>
        <span style="color:${mc};font-weight:800">${mkt>=8?'偏多':mkt<=-8?'偏空':'中性'}</span></div>
      <div class="hm-toggle">${tab('long','多方')}${tab('short','空方')}${single?'':tab('sub','細產業')}</div>
    </div>
    <div class="mood-note">氣氛值 −50~+50,以廣度為主(站上季線35%+多頭排列25%+站上月線15%+20日動能25%);點一列看領漲股。${noteSrc}</div>
    ${rows.length?rows.map(_moodRow).join(''):'<div class="empty" style="padding:40px 0">此分類目前沒有符合的族群</div>'}`;
}
function setHmView(v){
  const map=v!=='mood';
  $('#hm-btn-map').classList.toggle('active',map);
  $('#hm-btn-mood').classList.toggle('active',!map);
  $('#heatmap-chart').style.display=map?'':'none';
  $('#mood-view').style.display=map?'none':'';
  $('#hm-metric-toggle').style.display=map?'':'none';
  $('#hm-hint').textContent=map?'方塊大小＝日均成交額・點族群下鑽・點個股查摘要':'各產業當下偏多/偏空・點一列展開領漲股';
  if(map){if(_hmChart)_hmChart.resize();}else renderMood();
}
function _buildHmTree(stocks,sm,mode){
  const secs={};
  for(const s of stocks){
    const {sec,sub}=hmSecOf(s,sm);
    if(!secs[sec])secs[sec]={};
    if(!secs[sec][sub])secs[sec][sub]=[];
    const val=mode==='chg'?s.chg:s.r20;
    const disp=val!=null?(val>=0?'+':'')+val.toFixed(1)+'%':'-';
    secs[sec][sub].push({
      name:s.id,
      value:Math.max(s.vol||1,1),
      itemStyle:{color:_hmColor(val,mode==='chg'?6:20)},
      label:{show:true,formatter:()=>(s.n?s.n+'\n':'')+s.id+' '+disp,fontSize:10,lineHeight:14,color:'rgba(255,255,255,.92)',overflow:'truncate'},
      _s:s,_sub:sub,_sec:sec,
    });
  }
  const sortV=c=>c.reduce((s,x)=>s+x.value,0);
  const result=[];
  for(const[sec,subs]of Object.entries(secs)){
    const subEntries=Object.entries(subs);
    /* 單層模式(CMoney 類股:sub===sec)—— 直接把個股掛在類股底下,不要多一層同名方塊。
       舊的 FinMind 產業鏈(sub!==sec)維持 產業→細產業→個股 兩層。 */
    if(subEntries.length===1&&subEntries[0][0]===sec){
      result.push({name:sec,children:subEntries[0][1].sort((a,b)=>b.value-a.value)});
      continue;
    }
    const children=subEntries
      .map(([sub,items])=>({name:sub,children:items.sort((a,b)=>b.value-a.value)}))
      .sort((a,b)=>sortV(b.children)-sortV(a.children));
    result.push({name:sec,children});
  }
  return result.sort((a,b)=>{
    /* 單層模式 sec 的 children 直接是個股(有 .value);兩層模式是細產業組(有 .children)。兩者都要能加總 */
    const v=x=>x.children.reduce((s,c)=>s+(c.children?sortV(c.children):(c.value||0)),0);
    return v(b)-v(a);
  });
}

function renderHeatmap(){
  const el=$('#heatmap-chart');
  if(!el||!_hmData||!_hmSM)return;
  if(!_hmChart){
    _hmChart=echarts.init(el,null,{renderer:'canvas'});
    _hmChart.on('click',params=>{if(params.data&&params.data._s)_showHmPopup(params.data);});

function activateTab(p){
  document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.p===p;t.classList.toggle('active',on);t.setAttribute('aria-selected',on?'true':'false');});
  document.querySelectorAll('.panel').forEach(pl=>pl.classList.toggle('active',pl.id==='p-'+p));
  if(p==='live')startLivePoll();else stopLivePoll();
  if(p==='dash')loadDashLive();
  if(p==='health'&&!HEALTH_TAB_INIT){HEALTH_TAB_INIT=true;renderHealthTab();}
  /* 離開熱力圖一定要停輪詢 —— 它是 Vercel CPU 的頭號來源(見 hmLive 註解)。
     重進時 initHeatmap 因 _hmReady 會直接 return,所以計時器必須由 startHmLive 另外起。 */
  if(p==='heatmap'){initHeatmap();startHmLive();}else stopHmLive();
}
(function wireTabs(){
  const tabs=[...document.querySelectorAll('.tab')];
  tabs.forEach((t,i)=>{
    t.onclick=()=>activateTab(t.dataset.p);
    t.onkeydown=e=>{
      let j=null;
      if(e.key==='ArrowRight'||e.key==='ArrowDown')j=(i+1)%tabs.length;
      else if(e.key==='ArrowLeft'||e.key==='ArrowUp')j=(i-1+tabs.length)%tabs.length;
      else if(e.key==='Home')j=0;
      else if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();tabs[j].focus();activateTab(tabs[j].dataset.p);}
    };
  });
})();

function loadDay(dt){
  if(!LATEST)return;
  if(dt===LATEST.date){DATA=LATEST;LABEL=LATEST.label||{};renderAll();return;}
  fetch('./history/'+dt+'.json?'+Date.now()).then(r=>{
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(h=>{
    /* history snapshots carry NO performance / generated_at — keep latest's perf for the 績效 tab,
       but override the day-specific fields. Label perf widgets as 最新 (handled in renderDash/renderPerf). */
    DATA=Object.assign({},LATEST,{
      date:h.date||dt,
      core:Array.isArray(h.core)?h.core:[],
      watch:Array.isArray(h.watch)?h.watch:[],
      watchlist:Array.isArray(h.watchlist)?h.watchlist:[],
      index_below_ma20:!!h.index_below_ma20,
      market_regime:h.market_regime||null,
      scored_count:isNum(h.scored_count)?h.scored_count:0,
      label:h.label||LATEST.label||{}
    });
    LABEL=DATA.label||{};
    renderAll();
  }).catch(e=>{
    /* keep DATA pointing at whatever we last had; show a clear, non-crashing error in every core-derived panel */
    const msg=`<div class="err">讀取 ${esc(dt)} 的歷史快照失敗(${esc(e&&e.message||e)})。此日期可能尚無歷史檔。</div>`;
    $('#p-core').innerHTML=msg;
    $('#p-watch').innerHTML=msg;
    $('#p-watchlist').innerHTML=msg;
    $('#p-dash').innerHTML=msg;
  });
}

/* ---------- 盤中分K(2026-07-19)----------
   放在詳情頁而不是卡片上,是因為這裡是「專心看一檔」的地方,值得完整的圖;
   卡片是掃視用的,一條走勢線就夠(見 sparkline 註解)。
   **點了「分K」才去抓** —— 主 detail 已經要 5~15 秒,不該為了沒人看的圖再加成本。 */
function setDetailK(mode){
  const dEl=$('#detail-kchart'),iEl=$('#detail-ichart');
  if(!dEl||!iEl)return;
  const isD=mode!=='i';
  dEl.style.display=isD?'':'none'; iEl.style.display=isD?'none':'';
  $('#dk-btn-d').classList.toggle('active',isD);
  $('#dk-btn-i').classList.toggle('active',!isD);
  $('#dk-title').innerHTML=isD?`<span${tip('kline')}>日K線 · 量 · 均線(MA5/20/60)</span>`
                             :`<span${tip('intraday')}>盤中 1 分K</span> · 量 · <span${tip('vwap')}>均價線</span>`;
  if(isD){if(_detailK)_detailK.resize();return;}
  const sid=(_detailSid||'');
  if(INTRA_CACHE[sid]){drawIntraChart(INTRA_CACHE[sid]);return;}
  iEl.innerHTML='<div class="empty">載入分K中…</div>';
  fetch(HEALTH_API_BASE+'/api/detail?intraday=1&stock='+encodeURIComponent(sid))
    /* 路由不存在時回的是 HTML,r.json() 會噴「Unexpected token '<'」這種看不懂的錯 ——
       跟 openDetail 一樣先攔下來,講人話。 */
    .then(r=>r.json().catch(()=>{throw new Error('API 未部署或無回應(http '+r.status+')');}))
    .then(d=>{
      if(!d||d.error)throw new Error(d&&d.error||'無資料');
      INTRA_CACHE[sid]=d; drawIntraChart(d);
    }).catch(e=>{iEl.innerHTML=`<div class="err">分K 載入失敗:${esc(e&&e.message||e)}</div>`;});
}
function drawIntraChart(d){
  const el=$('#detail-ichart');if(!el||!window.echarts)return;
  const bars=d.bars||[];
  if(bars.length<2){el.innerHTML='<div class="empty">無分K資料</div>';return;}
  el.innerHTML='';
  const t=bars.map(r=>r[0]);
  const ohlc=bars.map(r=>[r[1],r[4],r[3],r[2]]);      // ECharts 順序:開,收,低,高
  const up=cssVar('--up'),down=cssVar('--down'),ink=cssVar('--ink-2'),
        line=cssVar('--line'),muted=cssVar('--muted'),surf=cssVar('--surface');
  const vols=bars.map(r=>({value:r[5],itemStyle:{color:(r[4]>=r[1]?up:down),opacity:.55}}));
  if(_detailIntra)_detailIntra.dispose();
  _detailIntra=echarts.init(el,null,{renderer:'canvas'});
  _detailIntra.setOption({
    animation:false,
    legend:{data:['均價'],top:0,textStyle:{color:muted,fontSize:11},itemWidth:16,itemHeight:2},
    tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:surf,borderColor:line,
      textStyle:{color:ink,fontSize:12}},
    axisPointer:{link:[{xAxisIndex:'all'}]},
    grid:[{left:58,right:16,top:26,height:'62%'},{left:58,right:16,top:'74%',height:'16%'}],
    xAxis:[{type:'category',data:t,boundaryGap:true,axisLine:{lineStyle:{color:line}},
        axisLabel:{color:muted,fontSize:10,interval:Math.floor(t.length/6)},splitLine:{show:false}},
      {type:'category',gridIndex:1,data:t,boundaryGap:true,axisLine:{lineStyle:{color:line}},
        axisLabel:{show:false},axisTick:{show:false}}],
    yAxis:[{scale:true,position:'right',axisLine:{show:false},axisLabel:{color:muted,fontSize:10},
        splitLine:{lineStyle:{color:line,opacity:.5}}},
      {scale:true,gridIndex:1,axisLine:{show:false},axisLabel:{show:false},splitLine:{show:false}}],
    dataZoom:[{type:'inside',xAxisIndex:[0,1]},{type:'slider',xAxisIndex:[0,1],height:16,bottom:4,
      borderColor:line,fillerColor:'rgba(120,130,160,.15)',handleStyle:{color:muted},
      textStyle:{color:muted,fontSize:9}}],
    series:[
      {name:'分K',type:'candlestick',data:ohlc,
        itemStyle:{color:up,color0:down,borderColor:up,borderColor0:down},
        /* 昨收基準線:判斷「今天是紅盤還黑盤」的錨點,沒有它只看得出形狀看不出強弱 */
        markLine:isNum(d.prev_close)?{silent:true,symbol:'none',
          lineStyle:{color:muted,type:'dashed',width:1},
          label:{formatter:'昨收 '+num(d.prev_close),color:muted,fontSize:10,position:'insideEndTop'},
          data:[{yAxis:d.prev_close}]}:undefined},
      {name:'均價',type:'line',data:d.vwap||[],smooth:false,showSymbol:false,
        lineStyle:{width:1.3,color:cssVar('--accent')},z:3},
      {name:'量',type:'bar',xAxisIndex:1,yAxisIndex:1,data:vols,barWidth:'70%'}
    ]
  });
  const n=$('#dk-note');
  if(n)n.textContent=`${d.date} · ${bars.length} 根 · 均價線＝當日累計成交額÷成交量`;
}
function drawKChart(d){
  const el=$('#detail-kchart');if(!el||!window.echarts)return;
  const k=d.kline||[],ma=d.ma||{};
  if(!k.length){el.innerHTML='<div class="empty">無價格資料</div>';return;}
  const dates=k.map(r=>r[0]);
  const ohlc=k.map(r=>[r[1],r[4],r[3],r[2]]);          // ECharts 蠟燭順序:open,close,low,high
  const up=cssVar('--up'),down=cssVar('--down'),ink=cssVar('--ink-2'),
        line=cssVar('--line'),muted=cssVar('--muted'),surf=cssVar('--surface');
  const vols=k.map(r=>({value:r[5],itemStyle:{color:(r[4]>=r[1]?up:down),opacity:.55}}));
  const maLine=(name,arr,color)=>({name,type:'line',data:arr||[],smooth:true,showSymbol:false,
    lineStyle:{width:1.2,color},z:3});
  _detailK=echarts.init(el,null,{renderer:'canvas'});
  _detailK.setOption({
    animation:false,
    legend:{data:['MA5','MA20','MA60'],top:0,textStyle:{color:muted,fontSize:11},itemWidth:16,itemHeight:2},
    tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:surf,borderColor:line,
      textStyle:{color:ink,fontSize:12}},
    axisPointer:{link:[{xAxisIndex:'all'}]},
    grid:[{left:52,right:16,top:26,height:'62%'},{left:52,right:16,top:'74%',height:'16%'}],
    xAxis:[
      {type:'category',data:dates,boundaryGap:true,axisLine:{lineStyle:{color:line}},
        axisLabel:{color:muted,fontSize:10},splitLine:{show:false}},
      {type:'category',gridIndex:1,data:dates,boundaryGap:true,axisLine:{lineStyle:{color:line}},
        axisLabel:{show:false},axisTick:{show:false}}
    ],
    yAxis:[
      {scale:true,position:'right',axisLine:{show:false},axisLabel:{color:muted,fontSize:10},
        splitLine:{lineStyle:{color:line,opacity:.5}}},
      {scale:true,gridIndex:1,axisLine:{show:false},axisLabel:{show:false},splitLine:{show:false}}
    ],
    dataZoom:[
      {type:'inside',xAxisIndex:[0,1],start:60,end:100},
      {type:'slider',xAxisIndex:[0,1],bottom:6,height:16,start:60,end:100,
        borderColor:line,textStyle:{color:muted,fontSize:10}}
    ],
    series:[
      {name:'K',type:'candlestick',data:ohlc,
        itemStyle:{color:up,color0:down,borderColor:up,borderColor0:down},z:2},
      maLine('MA5',ma.ma5,cssVar('--accent')),
      maLine('MA20',ma.ma20,'#e8912d'),
      maLine('MA60',ma.ma60,'#3aa0a0'),
      {name:'量',type:'bar',xAxisIndex:1,yAxisIndex:1,data:vols}
    ]
  });
}
function drawInstChart(d){
  const el=$('#detail-instchart');if(!el||!window.echarts)return;
  const rows=d.inst||[];
  if(!rows.length){el.innerHTML='<div class="empty" style="font-size:12px">無三大法人資料(免費 dataset 當下不可用或該股無)</div>';return;}
  const dates=rows.map(r=>r[0]);
  const ink=cssVar('--ink-2'),line=cssVar('--line'),muted=cssVar('--muted'),surf=cssVar('--surface');
  const ser=(name,idx,color)=>({name,type:'bar',stack:'inst',data:rows.map(r=>r[idx]),
    itemStyle:{color},barMaxWidth:14});
  _detailInst=echarts.init(el,null,{renderer:'canvas'});
  _detailInst.setOption({
    animation:false,
    legend:{data:['外資','投信','自營商'],top:0,textStyle:{color:muted,fontSize:11}},
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'},backgroundColor:surf,borderColor:line,
      textStyle:{color:ink,fontSize:12}},
    grid:{left:52,right:16,top:26,bottom:24},
    xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:line}},
      axisLabel:{color:muted,fontSize:10}},
    yAxis:{type:'value',axisLine:{show:false},axisLabel:{color:muted,fontSize:10},
      splitLine:{lineStyle:{color:line,opacity:.5}}},
    dataZoom:[{type:'inside',start:60,end:100},{type:'slider',bottom:2,height:14,start:60,end:100,
      borderColor:line,textStyle:{color:muted,fontSize:10}}],
    series:[ser('外資',1,cssVar('--accent')),ser('投信',2,'#e8912d'),ser('自營商',3,'#3aa0a0')]
  });
}
function _emptyPanel(el,msg){el.innerHTML='<div class="empty" style="font-size:12px">'+msg+'</div>';}
function drawRevChart(d){
  const el=$('#detail-revchart');if(!el||!window.echarts)return;
  const rows=d.revenue||[];
  if(!rows.length){_emptyPanel(el,'無月營收資料(免費 dataset 當下不可用或該股無)');return;}
  const ym=rows.map(r=>r[0]);
  const rev=rows.map(r=>r[1]==null?null:+(r[1]/1e8).toFixed(2));   // 元 → 億元
  const yoy=rows.map(r=>r[2]);
  const ink=cssVar('--ink-2'),line=cssVar('--line'),muted=cssVar('--muted'),surf=cssVar('--surface'),acc=cssVar('--accent');
  _detailRev=echarts.init(el,null,{renderer:'canvas'});
  _detailRev.setOption({
    animation:false,
    legend:{data:['月營收(億)','YoY(%)'],top:0,textStyle:{color:muted,fontSize:11}},
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'},backgroundColor:surf,borderColor:line,textStyle:{color:ink,fontSize:12}},
    grid:{left:52,right:46,top:26,bottom:24},
    xAxis:{type:'category',data:ym,axisLine:{lineStyle:{color:line}},axisLabel:{color:muted,fontSize:10}},
    yAxis:[
      {type:'value',axisLine:{show:false},axisLabel:{color:muted,fontSize:10},splitLine:{lineStyle:{color:line,opacity:.5}}},
      {type:'value',position:'right',axisLine:{show:false},axisLabel:{color:muted,fontSize:10,formatter:'{value}%'},splitLine:{show:false}}
    ],
    series:[
      {name:'月營收(億)',type:'bar',data:rev,itemStyle:{color:acc,opacity:.7},barMaxWidth:16},
      {name:'YoY(%)',type:'line',yAxisIndex:1,data:yoy,smooth:true,showSymbol:false,
        connectNulls:true,lineStyle:{width:1.6,color:'#e8912d'}}
    ]
  });
}
function drawMarginChart(d){
  const el=$('#detail-marginchart');if(!el||!window.echarts)return;
  const rows=d.margin||[];
  if(!rows.length){_emptyPanel(el,'無融資券資料(免費 dataset 當下不可用或該股無)');return;}
  const dates=rows.map(r=>r[0]);
  const ink=cssVar('--ink-2'),line=cssVar('--line'),muted=cssVar('--muted'),surf=cssVar('--surface');
  const mline=(name,idx,color)=>({name,type:'line',data:rows.map(r=>r[idx]),smooth:true,showSymbol:false,
    connectNulls:true,lineStyle:{width:1.5,color}});
  _detailMargin=echarts.init(el,null,{renderer:'canvas'});
  _detailMargin.setOption({
    animation:false,
    legend:{data:['融資餘額','融券餘額'],top:0,textStyle:{color:muted,fontSize:11}},
    tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:surf,borderColor:line,textStyle:{color:ink,fontSize:12}},
    grid:{left:58,right:16,top:26,bottom:24},
    xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:line}},axisLabel:{color:muted,fontSize:10}},
    yAxis:{type:'value',scale:true,axisLine:{show:false},axisLabel:{color:muted,fontSize:10},splitLine:{lineStyle:{color:line,opacity:.5}}},
    dataZoom:[{type:'inside',start:50,end:100},{type:'slider',bottom:2,height:14,start:50,end:100,borderColor:line,textStyle:{color:muted,fontSize:10}}],
    series:[mline('融資餘額',1,cssVar('--accent')),mline('融券餘額',2,'#e8912d')]
  });
}
function drawHoldingChart(d){
  const el=$('#detail-holdingchart');if(!el||!window.echarts)return;
  const rows=d.holding||[];
  if(!rows.length){_emptyPanel(el,'無外資持股資料(免費 dataset 當下不可用或該股無)');return;}
  const dates=rows.map(r=>r[0]);
  const ink=cssVar('--ink-2'),line=cssVar('--line'),muted=cssVar('--muted'),surf=cssVar('--surface'),acc=cssVar('--accent');
  _detailHolding=echarts.init(el,null,{renderer:'canvas'});
  _detailHolding.setOption({
    animation:false,
    tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:surf,borderColor:line,textStyle:{color:ink,fontSize:12},
      valueFormatter:v=>v==null?'-':v+'%'},
    grid:{left:48,right:16,top:16,bottom:24},
    xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:line}},axisLabel:{color:muted,fontSize:10}},
    yAxis:{type:'value',scale:true,axisLine:{show:false},axisLabel:{color:muted,fontSize:10,formatter:'{value}%'},splitLine:{lineStyle:{color:line,opacity:.5}}},
    dataZoom:[{type:'inside',start:50,end:100},{type:'slider',bottom:2,height:14,start:50,end:100,borderColor:line,textStyle:{color:muted,fontSize:10}}],
    series:[{name:'外資持股',type:'line',data:rows.map(r=>r[1]),smooth:true,showSymbol:false,connectNulls:true,
      lineStyle:{width:1.8,color:acc},areaStyle:{color:acc,opacity:.12}}]
  });
}
function drawPieChart(d){
  const el=$('#detail-piechart');if(!el||!window.echarts)return;
  const h=d.holder||{},pie=h.pie||[];
  const dl=$('#detail-pie-date');if(dl)dl.textContent=h.date?('· '+h.date):'';
  if(!pie.length){_emptyPanel(el,'無股權分散資料(集保 dataset 當下不可用或該股無)');return;}
  const ink=cssVar('--ink-2'),line=cssVar('--line'),muted=cssVar('--muted'),surf=cssVar('--surface');
  _detailPie=echarts.init(el,null,{renderer:'canvas'});
  _detailPie.setOption({
    animation:false,
    color:[cssVar('--accent'),'#e8912d','#3aa0a0','#c05b8c','#7a6ff0'],
    tooltip:{trigger:'item',backgroundColor:surf,borderColor:line,textStyle:{color:ink,fontSize:12},
      formatter:p=>`${p.name}<br/>持股佔比 ${p.value}%`},
    legend:{orient:'vertical',right:6,top:'middle',textStyle:{color:muted,fontSize:11},itemWidth:12,itemHeight:12},
    series:[{name:'股權分散',type:'pie',radius:['42%','70%'],center:['34%','52%'],avoidLabelOverlap:true,
      data:pie.map(p=>({name:p[0],value:p[1]})),
      itemStyle:{borderColor:surf,borderWidth:2},
      label:{color:ink,fontSize:10,formatter:'{d}%'},labelLine:{length:6,length2:6}}]
  });
}
window.addEventListener('resize',()=>{[_detailK,_detailInst,_detailRev,_detailMargin,_detailHolding,_detailPie,_detailIntra].forEach(c=>{if(c)c.resize();});});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#detail-overlay')&&$('#detail-overlay').classList.contains('open'))closeDetail();});
/* 深連結:網址帶 #stock=2330 時自動開啟 */
(function initDetailHash(){
  const m=/[#&]stock=(\d{4})/.exec(location.hash||'');
  if(m)setTimeout(()=>openDetail(m[1]),300);
})();
</script>
