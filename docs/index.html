<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>台股短線選股 · 交易終端</title>
<style>
  /* ============================================================
     DESIGN TOKENS — light (default) + dark
     "trading terminal" : 中性深藍灰 + 靛色強調 ; 漲綠 / 跌紅
     ============================================================ */
  :root{
    /* surfaces */
    --bg:#f4f6f9; --bg-grad-1:#eef1f6; --bg-grad-2:#f6f8fb;
    --surface:#ffffff; --surface-2:#fafbfd; --surface-3:#f1f4f8;
    --line:#e6eaf0; --line-soft:#eef1f5; --line-strong:#d4dae3;
    /* ink */
    --ink:#0d1424; --ink-2:#3a4658; --muted:#69748a; --muted-2:#9aa4b6;
    /* brand / accent (靛 indigo) */
    --accent:#5b63f5; --accent-2:#7c83ff; --accent-ink:#4a52e6; --accent-bg:#eef0ff; --accent-line:#dfe2ff;
    /* up / down semantics */
    --up:#0f9d58; --up-ink:#0b7a44; --up-bg:#e7f7ee; --up-line:#bfe9cf;
    --down:#e0383e; --down-ink:#c42a30; --down-bg:#fdeced; --down-line:#f7cdcf;
    --flat:#8a93a4;
    --warn:#d98a17; --warn-ink:#b3700f; --warn-bg:#fdf4e3; --warn-line:#f3dcae;
    /* profile chips */
    --mom:#e0383e; --mom-bg:#fdeced; --qual:#2a6df0; --qual-bg:#e9f1ff; --bal:#69748a; --bal-bg:#eef1f5;
    /* effects */
    --shadow-sm:0 1px 2px rgba(13,20,36,.05);
    --shadow:0 1px 2px rgba(13,20,36,.04), 0 6px 20px rgba(13,20,36,.07);
    --shadow-lg:0 4px 12px rgba(13,20,36,.06), 0 18px 44px rgba(13,20,36,.12);
    --ring:0 0 0 3px var(--accent-bg);
    --radius:16px; --radius-sm:11px; --radius-xs:8px;
    --mono:'SFMono-Regular',ui-monospace,'JetBrains Mono','Menlo','Consolas',monospace;
  }
  [data-theme="dark"]{
    --bg:#0a0e17; --bg-grad-1:#0c121e; --bg-grad-2:#0a0e17;
    --surface:#121826; --surface-2:#161d2e; --surface-3:#1c2436;
    --line:#263043; --line-soft:#1d2638; --line-strong:#33405a;
    --ink:#eef2f8; --ink-2:#c2ccdc; --muted:#8a96ab; --muted-2:#5d687d;
    --accent:#7c83ff; --accent-2:#9aa0ff; --accent-ink:#a6abff; --accent-bg:#1c2140; --accent-line:#2c3460;
    --up:#34d27e; --up-ink:#5bdd97; --up-bg:#10271b; --up-line:#1d4632;
    --down:#ff5c63; --down-ink:#ff7b81; --down-bg:#2a1316; --down-line:#4a2024;
    --flat:#7a8499;
    --warn:#f0b048; --warn-ink:#f5c373; --warn-bg:#2a2010; --warn-line:#4a3a18;
    --mom:#ff5c63; --mom-bg:#2a1316; --qual:#5b9dff; --qual-bg:#13213a; --bal:#8a96ab; --bal-bg:#1c2436;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.45);
    --shadow-lg:0 6px 18px rgba(0,0,0,.4), 0 24px 60px rgba(0,0,0,.6);
    --ring:0 0 0 3px var(--accent-bg);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
  body{margin:0;color:var(--ink);
    background:
      radial-gradient(1200px 600px at 100% -5%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%),
      linear-gradient(180deg,var(--bg-grad-1),var(--bg-grad-2));
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif;
    font-feature-settings:"tnum" 1;line-height:1.5;-webkit-font-smoothing:antialiased;
    transition:background-color .3s ease,color .3s ease;}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 72px;}
  .num{font-variant-numeric:tabular-nums;font-family:var(--mono);letter-spacing:-.01em;}
  .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--flat);}
  a{color:var(--accent-ink);text-decoration:none;} a:hover{text-decoration:underline;}
  ::selection{background:var(--accent-bg);color:var(--accent-ink);}

  /* ---------- Header ---------- */
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{width:42px;height:42px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(140deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent);}
  .logo svg{width:24px;height:24px;}
  .title{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
  .title .tg{color:var(--muted);font-weight:600;font-size:13px;display:block;letter-spacing:.02em;margin-top:3px;}
  .sub{color:var(--muted);font-size:13px;margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;}
  .sub .dot{width:3px;height:3px;border-radius:50%;background:var(--muted-2);}

  /* theme toggle */
  .tgl{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-2);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600;
    box-shadow:var(--shadow-sm);transition:all .18s ease;}
  .tgl:hover{border-color:var(--line-strong);transform:translateY(-1px);box-shadow:var(--shadow);}
  .tgl svg{width:16px;height:16px;}
  .tgl .ico-sun{display:none;} [data-theme="dark"] .tgl .ico-sun{display:block;}
  [data-theme="dark"] .tgl .ico-moon{display:none;}

  .pill-mkt{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid transparent;}
  .pill-mkt .pdot{width:6px;height:6px;border-radius:50%;}
  .mkt-up{background:var(--up-bg);color:var(--up-ink);border-color:var(--up-line);}
  .mkt-up .pdot{background:var(--up);}
  .mkt-dn{background:var(--down-bg);color:var(--down-ink);border-color:var(--down-line);}
  .mkt-dn .pdot{background:var(--down);}
  .tag-hist{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;}
  .tag-latest{display:inline-block;background:var(--accent-bg);color:var(--accent-ink);border:1px solid var(--accent-line);padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:800;margin-left:6px;vertical-align:middle;letter-spacing:.02em;}

  /* visible keyboard focus everywhere (a11y) */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
  .tab:focus-visible{outline-offset:-2px;}

  .datebar{margin-top:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13px;color:var(--muted);}

  /* ---------- Tabs ---------- */
  .tabs{display:inline-flex;gap:3px;background:var(--surface-3);padding:4px;border-radius:14px;margin:20px 0 24px;
    flex-wrap:wrap;border:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .tab{padding:8px 15px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;
    border:none;background:transparent;transition:all .18s cubic-bezier(.4,0,.2,1);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
  .tab:hover{color:var(--ink-2);}
  .tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
  .tab .tdot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}

  .panel{display:none;animation:fade .28s cubic-bezier(.2,.8,.2,1);}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

  .lead{color:var(--muted);font-size:13px;margin-bottom:14px;line-height:1.6;}
  .lead b{color:var(--ink-2);}

  /* ---------- Section heading ---------- */
  .sec-h{font-size:13.5px;font-weight:700;letter-spacing:.01em;margin:24px 0 12px;color:var(--ink);
    display:flex;align-items:center;gap:8px;}
  .sec-h .bar{width:3px;height:14px;border-radius:2px;background:var(--accent);}
  .sec-h .cnt{color:var(--muted-2);font-weight:600;font-size:12px;}
  .sec-h2{font-size:13px;font-weight:700;margin:20px 0 11px;color:var(--ink);display:flex;align-items:center;gap:7px;}

  /* ---------- Generic card ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px;}

  /* ============================================================
     DASHBOARD
     ============================================================ */
  .dash-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:6px;}
  .gcol-3{grid-column:span 3;} .gcol-4{grid-column:span 4;} .gcol-6{grid-column:span 6;}
  .gcol-8{grid-column:span 8;} .gcol-12{grid-column:span 12;}

  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease;}
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
  .kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent);opacity:.85;}
  .kpi.k-up::after{background:var(--up);} .kpi.k-down::after{background:var(--down);} .kpi.k-warn::after{background:var(--warn);}
  .kpi .kl{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:6px;}
  .kpi .kl svg{width:14px;height:14px;opacity:.7;}
  .kpi .kv{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:7px;line-height:1;}
  .kpi .kv small{font-size:14px;font-weight:700;color:var(--muted);margin-left:2px;}
  .kpi .ks{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5;}

  .panelcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px 20px;height:100%;}
  .pc-h{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;}
  .pc-h .lk{font-size:12px;font-weight:600;color:var(--accent-ink);cursor:pointer;}
  .pc-h .lk:hover{text-decoration:underline;}

  /* market regime hero */
  .regime{display:flex;align-items:center;gap:16px;}
  .regime .ring{width:74px;height:74px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;position:relative;}
  .regime .ring svg{width:74px;height:74px;transform:rotate(-90deg);}
  .regime .rlabel{position:absolute;font-size:11px;font-weight:800;letter-spacing:.02em;}
  .regime .rtext .rt{font-size:18px;font-weight:800;letter-spacing:-.01em;}
  .regime .rtext .rd{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;}

  /* top picks list */
  .pick{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
  .pick:last-child{border-bottom:none;}
  .pick .rk{width:22px;height:22px;flex:0 0 auto;border-radius:7px;background:var(--surface-3);color:var(--muted);
    font-size:11.5px;font-weight:800;display:grid;place-items:center;}
  .pick:nth-child(1) .rk{background:var(--accent-bg);color:var(--accent-ink);}
  .pick .pinfo{flex:1;min-width:0;}
  .pick .pn{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .pick .pn .id{color:var(--ink);} .pick .pn .nm{color:var(--ink-2);font-weight:600;font-size:12.5px;}
  .pick .pmeta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .pick .pscore{text-align:right;flex:0 0 auto;}
  .pick .pscore .v{font-size:16px;font-weight:800;color:var(--accent-ink);}
  .pick .pscore .b{font-size:10.5px;color:var(--up);font-weight:700;}

  /* distribution mini bars */
  .dist{display:flex;flex-direction:column;gap:9px;}
  .dist .row{display:flex;align-items:center;gap:10px;font-size:12px;}
  .dist .row .lab{width:62px;flex:0 0 auto;color:var(--muted);font-weight:600;}
  .dist .row .track{flex:1;height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden;}
  .dist .row .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .dist .row .val{width:30px;text-align:right;flex:0 0 auto;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;}

  /* horizon mini grid */
  .hmini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .hmini .hc{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius-xs);padding:10px 8px;text-align:center;}
  .hmini .hc .ht{font-size:11px;color:var(--muted);font-weight:600;}
  .hmini .hc .hv{font-size:16px;font-weight:800;margin-top:4px;letter-spacing:-.01em;}
  .hmini .hc .hw{font-size:10.5px;color:var(--muted-2);margin-top:2px;}

  /* live preview strip */
  .gatestrip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .gatebadge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:800;border:1px solid transparent;}
  .gatebadge .gd{width:7px;height:7px;border-radius:50%;}
  .g-on{background:var(--up-bg);color:var(--up-ink);border-color:var(--up-line);} .g-on .gd{background:var(--up);}
  .g-off{background:var(--down-bg);color:var(--down-ink);border-color:var(--down-line);} .g-off .gd{background:var(--down);}
  .g-neu{background:var(--surface-3);color:var(--muted);border-color:var(--line);} .g-neu .gd{background:var(--muted-2);}
  .gmetrics{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);}
  .gmetrics b{color:var(--ink-2);font-weight:700;}

  /* ============================================================
     CORE cards
     ============================================================ */
  .ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:17px 19px;margin-bottom:14px;transition:box-shadow .22s ease,transform .22s ease,border-color .22s ease;}
  .ccard:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--line-strong);}
  .ccard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .tkr{font-size:16.5px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .tkr .rank{color:var(--muted-2);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;}
  .tkr .nm{color:var(--ink-2);font-weight:600;font-size:14px;}
  .score{text-align:right;line-height:1;flex:0 0 auto;}
  .score .v{font-size:25px;font-weight:800;letter-spacing:-.02em;color:var(--accent-ink);font-variant-numeric:tabular-nums;}
  .score .l{font-size:10px;color:var(--muted-2);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}
  .score .chipb{display:inline-block;margin-top:5px;background:var(--up-bg);color:var(--up-ink);border:1px solid var(--up-line);
    padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:800;}
  .meta{color:var(--muted);font-size:13px;margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;}
  .meta .mdot{width:3px;height:3px;border-radius:50%;background:var(--muted-2);}
  .meta b{color:var(--ink-2);font-weight:700;}
  .trig{color:var(--up-ink);font-weight:700;background:var(--up-bg);border:1px solid var(--up-line);padding:1px 8px;border-radius:6px;font-size:12px;}

  .kbars{margin-top:10px;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line-soft);padding:6px 4px 4px;}
  .kbars svg{display:block;width:100%;height:64px;}
  .kbars .kfoot{font-size:10.5px;color:var(--muted-2);text-align:right;padding:2px 6px 0;}

  .bars{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .bar{font-size:11px;color:var(--muted);background:var(--surface-3);padding:4px 9px;border-radius:8px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;}
  .bar .mb{width:34px;height:4px;border-radius:999px;background:var(--line-strong);overflow:hidden;}
  .bar .mb i{display:block;height:100%;background:var(--accent);border-radius:999px;}
  .bar b{color:var(--ink-2);font-weight:800;font-variant-numeric:tabular-nums;}

  /* badge / chips */
  .badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:7px;font-size:11px;font-weight:800;letter-spacing:.02em;vertical-align:middle;border:1px solid transparent;}
  .b-mom{background:var(--mom-bg);color:var(--mom);} .b-qual{background:var(--qual-bg);color:var(--qual);} .b-bal{background:var(--bal-bg);color:var(--bal);}
  .chip-tag{display:inline-flex;align-items:center;background:var(--accent-bg);color:var(--accent-ink);border:1px solid var(--accent-line);
    padding:2px 9px;border-radius:7px;font-size:11.5px;font-weight:600;margin:2px 4px 2px 0;}
  .chip-combo{background:var(--up-bg);color:var(--up-ink);border-color:var(--up-line);}

  /* plan box */
  .plan{margin-top:13px;background:linear-gradient(180deg,var(--surface-2),var(--surface-3));
    border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;}
  .plan .ph{font-weight:800;font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:7px;}
  .plan .ph .ref{color:var(--muted);font-weight:600;font-size:11.5px;}
  .plan table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;}
  .plan td{padding:6px 6px;vertical-align:top;color:var(--ink-2);}
  .plan tr+tr td{border-top:1px solid var(--line-soft);}
  .plan td:first-child{white-space:nowrap;width:1%;}
  .scn{font-weight:800;font-size:12px;display:inline-flex;align-items:center;gap:5px;}
  .scn small{display:block;color:var(--muted);font-weight:600;font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums;}
  .scn .dt{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .plan .foot{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line-strong);font-size:12px;color:var(--ink-2);line-height:1.6;}
  .plan .foot .tiny{color:var(--muted);font-size:11px;margin-top:4px;display:block;}

  .row-meta{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.6;}
  .row-meta b{color:var(--ink-2);font-weight:700;}
  .row-meta .ml{color:var(--muted-2);font-weight:600;margin-right:3px;}

  /* ---------- Stats (perf) ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px;margin-bottom:18px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px 19px;position:relative;overflow:hidden;}
  .stat::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent);opacity:.8;}
  .stat .v{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;}
  .stat .l{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.55;}
  .stat .l b{color:var(--ink-2);}

  /* ---------- Table ---------- */
  .tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
  .tbl-wrap::-webkit-scrollbar{height:7px;} .tbl-wrap::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
  table.t{width:100%;border-collapse:collapse;font-size:13px;}
  table.t th{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.01em;text-align:left;
    padding:13px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;
    position:sticky;top:0;transition:color .15s;}
  table.t th:hover{color:var(--ink);}
  table.t th.r{text-align:right;} table.t td.r{text-align:right;}
  table.t td{padding:12px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap;color:var(--ink-2);}
  table.t tbody tr{transition:background .14s ease;}
  table.t tbody tr:hover td{background:var(--surface-2);}
  table.t tbody tr:last-child td{border-bottom:none;}
  table.t .tk{font-weight:800;color:var(--ink);}

<script>
const $=(s,el=document)=>el.querySelector(s);
const isNum=v=>v!==null&&v!==undefined&&v!==''&&!isNaN(v)&&isFinite(Number(v));
const fmt=(v,d=2)=>!isNum(v)?'-':(v>=0?'+':'')+Number(v).toFixed(d);
const num=(v,d=2)=>!isNum(v)?'-':Number(v).toFixed(d);
const fmtInt=v=>!isNum(v)?'-':Math.round(Number(v)).toLocaleString('en-US');
const cls=v=>!isNum(v)?'flat':(v>0?'up':v<0?'down':'flat');
/* score / integer-ish numeric display: '-' when missing, no 'null'/'NaN' leak */
const iv=(v,suffix='')=>!isNum(v)?'-':String(Number(v))+suffix;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge=p=>p==='動能'?'<span class="badge b-mom">動能</span>':p==='品質'?'<span class="badge b-qual">品質</span>':p?`<span class="badge b-bal">${esc(p)}</span>`:'<span class="badge b-bal">—</span>';
// 股票代號 → 連到 CMoney 個股頁(新分頁)。只把代號做成連結,其餘排版不變。
const slink=id=>`<a class="slink" href="https://www.cmoney.tw/forum/stock/${encodeURIComponent(String(id==null?'':id))}" target="_blank" rel="noopener" title="在 CMoney 看 ${esc(id)} 走勢/技術線圖">${esc(id)}↗</a>`;
let DATA=null,LATEST=null,LABEL={};
const lbl=h=>LABEL[h]||h;
/* 個股健檢狀態(2026-06-30 新增)。HEALTH_API_ENABLED=false(預設):只用每日批次的
   docs/health/*.json,不嘗試任意代號即時查詢。部署 Vercel(docs+api 同一個 project)後
   改 true 即可啟用;HEALTH_API_BASE 同源部署留空字串(相對路徑 /api/health 即可,
   不會有 CORS 問題);若 API 部署在不同網域,填那個網域(例如 'https://xxx.vercel.app',
   不要結尾斜線)。 */
let HEALTH_TAB_INIT=false,HEALTH_CACHE={},HEALTH_STYLE='value_investing';
const HEALTH_API_ENABLED=true;
const HEALTH_API_BASE='';

/* ---------- shared premarket fetch (de-dupe dashboard live-strip vs live tab) ---------- */
let _pmCache=null,_pmTs=0,_pmInflight=null;
function getPremarket(force){
  const now=Date.now();
  if(!force&&_pmCache&&(now-_pmTs)<30000)return Promise.resolve(_pmCache);
  if(_pmInflight)return _pmInflight;
  _pmInflight=fetch('./premarket.json?'+now)
    .then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .then(d=>{_pmCache=d;_pmTs=Date.now();_pmInflight=null;return d;})
    .catch(err=>{_pmInflight=null;throw err;});
  return _pmInflight;
}

/* ---------- theme ---------- */
(function initTheme(){
  let t=null;
  try{t=localStorage.getItem('twse-theme');}catch(e){}
  if(!t)t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);
})();
function applyThemeLabel(){
  const t=document.documentElement.getAttribute('data-theme');
  const el=$('#themeLabel');if(el)el.textContent=t==='dark'?'淺色':'深色';
}
window.addEventListener('DOMContentLoaded',()=>{
  applyThemeLabel();
  const btn=$('#themeToggle');
  if(btn)btn.onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('twse-theme',next);}catch(e){}
    applyThemeLabel();
  };
});
/* react to system change only if user hasn't chosen */
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{
    let saved=null;try{saved=localStorage.getItem('twse-theme');}catch(_){}
    if(!saved){document.documentElement.setAttribute('data-theme',e.matches?'dark':'light');applyThemeLabel();}
  });
}

function setSub(){

  const isHist=!!(LATEST&&d.date!==LATEST.date);
  const hist=isHist?'<span class="tag-hist">歷史</span>':'';
  /* generated_at only belongs to the latest snapshot; don't show it next to a historical date */
  const upd=(!isHist&&LATEST&&LATEST.generated_at)?`<span class="dot"></span>更新 ${esc(LATEST.generated_at)}`:'';
  $('#sub').innerHTML=`<span>${esc(d.date)||''}</span>${hist}<span class="dot"></span>全市場 <b style="color:var(--ink-2)">${isNum(d.scored_count)?d.scored_count:0}</b> 檔評分<span class="dot"></span>${mkt}${upd}`;
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function donut(pct,color,label){
  const r=30,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(1,pct)));
  return `<div class="ring">
    <svg viewBox="0 0 74 74">
      <circle cx="37" cy="37" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="7"/>
      <circle cx="37" cy="37" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg>
    <div class="rlabel" style="color:${color}">${label}</div>
  </div>`;
}
function renderDash(){
  const d=DATA||{}, c=d.core||[], w=d.watch||[];
  /* performance lives ONLY on the latest snapshot (history files lack it).
     Always read perf from LATEST so historical views show latest perf, clearly labelled. */
  const p=(LATEST&&LATEST.performance)||{};
  const o=p.overall||{}, es=p.exit_sim||{}, bh=p.by_horizon||{};
  const bull=!d.index_below_ma20;
  const isHist=!!(LATEST&&d.date!==LATEST.date);

// 迷你日K棒圖(近 40 交易日)— 純 SVG,零外部套件;無 s.ohlc(舊資料/降級)時回傳空字串,不報錯。
function kbars(s){
  const o=s.ohlc;
  if(!o||!o.length)return '';
  const W=320,H=64,padL=2,padR=2,padT=5,padB=5;
  const n=o.length, cw=(W-padL-padR)/n, bw=Math.max(1,cw*0.62);
  let lo=Infinity,hi=-Infinity;
  for(const c of o){if(c.every(isNum)){lo=Math.min(lo,c[2]);hi=Math.max(hi,c[1]);}}
  if(!isFinite(lo)||!isFinite(hi)||hi<=lo)return '';
  const span=hi-lo;
  const y=v=>padT+(H-padT-padB)*(1-(v-lo)/span);
  let bars='';
  o.forEach((c,i)=>{
    if(!c.every(isNum))return;
    const [op,hg,lw,cl]=c;
    const x=padL+cw*i+cw/2, up=cl>=op, col=up?'var(--up)':'var(--down)';
    const yo=y(op),yc=y(cl),yh=y(hg),yl=y(lw);
    const top=Math.min(yo,yc), bh=Math.max(1,Math.abs(yc-yo));
    bars+=`<line x1="${x.toFixed(1)}" y1="${yh.toFixed(1)}" x2="${x.toFixed(1)}" y2="${yl.toFixed(1)}" style="stroke:${col};stroke-width:1"/>`;
    bars+=`<rect x="${(x-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" style="fill:${col}"/>`;
  });
  return `<div class="kbars"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}</svg><div class="kfoot">近 ${n} 日K線(資料延遲至前日收盤)</div></div>`;
}
function bars(s){
  const m=[['趨勢',s.trend],['強度',s.rs],['時機',s.setup],['品質',s.quality],['量能',s.liquidity]];
  return `<div class="bars">${m.map(([k,v])=>{const has=isNum(v);const pct=has?Math.max(0,Math.min(1,Number(v))):0;return `<span class="bar">${k} <span class="mb"><i style="width:${(pct*100).toFixed(0)}%"></i></span> <b>${has?Math.round(pct*100):'-'}</b></span>`;}).join('')}</div>`;
}
function planBox(p,pos){

          <td>別接刀:需<b>站回開盤價 + 帶量吞噬</b>、大盤沒同步崩才試單;破停損 ${num(p.init_stop)} 則放棄。</td></tr>

// 「為什麼選這檔」— 純用已算好的資料把信心分各維度+催化劑翻成白話,零額外 API/token。
function whyPanel(s){
  const dim=(label,v,hi,mid,lo)=>{if(!isNum(v))return null;const p=Math.round(Math.max(0,Math.min(1,Number(v)))*100);
    return `<b>${label} ${p}</b> — ${p>=70?hi:(p>=45?mid:lo)}`;};
  const pts=[];
  pts.push(s.breakout?'今日<b>帶量突破</b> — 價量同步站上近期壓力,屬「剛啟動」型,順勢進場。'
         :s.pullback_turn?'今日<b>回測支撐轉強</b> — 多頭中回檔到均線止穩、買盤回流,屬「低接轉強」型。'
         :'今日出現新鮮進場訊號。');
  [dim('趨勢',s.trend,'完整多頭排列、站穩均線','均線偏多但未全多排','均線轉弱,留意'),
   dim('強度',s.rs,'明顯強於大盤、資金流入','與大盤同步','弱於大盤'),
   dim('時機',s.setup,'短線時機佳(量縮整理剛轉強)','時機普通','時機偏弱,主要靠突破帶動'),
   dim('品質',s.quality,'體質/財務穩健','體質中等','體質普通、偏題材'),
   dim('量能',s.liquidity,'成交活絡、進出容易','量能尚可','量能偏低,掛單注意滑價')
  ].forEach(d=>{if(d)pts.push(d);});
  const bz=[];
  if(isNum(s.chip_bonus)&&s.chip_bonus>0)bz.push(`籌碼 +${iv(s.chip_bonus)}(法人站買方)`);
  if(isNum(s.catalyst_bonus)&&s.catalyst_bonus>0)bz.push(`題材 +${iv(s.catalyst_bonus)}(新聞催化)`);
  if(isNum(s.fund_bonus)&&s.fund_bonus>0)bz.push(`基本面 +${iv(s.fund_bonus)}(財報加分)`);
  if(isNum(s.industry_bonus)&&s.industry_bonus>0)bz.push(`產業 +${iv(s.industry_bonus)}(身處強勢產業)`);
  if(bz.length)pts.push('信心分加成:'+bz.join(' · '));
  if(s.catalysts&&s.catalysts.length){
    const ev=s.catalysts.filter(c=>c.evidence).map(c=>`<div class="ev">・<b>${esc(c.type)}</b>${isNum(c.confidence)?` ${Math.round(c.confidence*100)}%`:''}:<span style="color:var(--muted)">「${esc(c.evidence)}」</span></div>`).join('');
    if(ev)pts.push('題材依據(新聞原文,AI 標註):'+ev);
  }
  if(s.target_prices&&s.target_prices.length){
    const tpEv=s.target_prices.map(t=>`<div class="ev">・<b>${esc(t.broker)}</b> ${isNum(t.price)?num(t.price):'?'}元${t.asof?`(${esc(t.asof)})`:''}:<span style="color:var(--muted)">「${esc(t.evidence)}」</span></div>`).join('');
    pts.push('法人目標價(新聞轉述,AI 標註,僅新聞有報導才抓到,非完整即時清單):'+tpEv);
  }
  if(s.risk_flags&&s.risk_flags.length)pts.push(`<span style="color:var(--down)">⚠ 風險:${s.risk_flags.map(esc).join(' · ')}</span>`);
  return `<details class="why"><summary>為什麼選這檔(解讀)</summary>
    <ul>${pts.map(p=>`<li>${p}</li>`).join('')}</ul>
    <div class="whyfoot">系統把信心分各維度與新聞催化「翻成白話」,非漲跌預測;實際進出依上方決策卡,並自負風險。</div>
  </details>`;
}
function coreCard(s,i){
  const trig=s.breakout?'帶量突破':s.pullback_turn?'回測轉強':'觸發';
  let chip='';

  }
  // 基本面(毛利/營益/ROE/負債/月營收YoY)
  let fund2='';
  if(ff&&(isNum(ff.gross_margin)||isNum(ff.roe)||isNum(ff.debt_ratio)||isNum(ff.revenue_yoy))){

  }
  const rf=(s.risk_flags&&s.risk_flags.length)?`<div class="row-meta"><span class="ml" style="background:var(--down-bg);color:var(--down)">風險</span><span style="color:var(--down)">${s.risk_flags.map(esc).join(' · ')}</span></div>`:'';
  // 法人目標價(新聞轉述,非完整即時清單,見 whyPanel 原文引用)
  const tp=(s.target_prices&&s.target_prices.length)?`<div class="row-meta"><span class="ml">法人目標價</span>${s.target_prices.map(t=>`${esc(t.broker)} <b class="num">${isNum(t.price)?num(t.price):'?'}</b>元${t.asof?`(${esc(t.asof)})`:''}`).join(' · ')}<span style="color:var(--muted-2);font-size:11px">(新聞轉述,非完整)</span></div>`:'';
  // 分數區:三種 stage-2 加成各自顯示
  const bonuses=[];
  if(isNum(s.chip_bonus)&&s.chip_bonus>0)bonuses.push(`籌碼 +${iv(s.chip_bonus)}`);
  if(isNum(s.catalyst_bonus)&&s.catalyst_bonus>0)bonuses.push(`題材 +${iv(s.catalyst_bonus)}`);
  if(isNum(s.fund_bonus)&&s.fund_bonus>0)bonuses.push(`基本面 +${iv(s.fund_bonus)}`);
  if(isNum(s.industry_bonus)&&s.industry_bonus>0)bonuses.push(`產業 +${iv(s.industry_bonus)}`);
  const bonusHtml=bonuses.map(b=>`<div class="chipb">${b}</div>`).join('');
  return `<div class="ccard">
    <div class="top">
      <div style="min-width:0"><div class="tkr"><span class="rank">#${i+1}</span>${s.hot_industry?'🔥 ':''}${slink(s.stock_id)}<span class="nm">${esc(s.name)}</span> ${badge(s.profile)}</div>
        <div class="meta">收 <b class="num">${num(s.close)}</b> <span class="${cls(s.change_pct)} num">(${fmt(s.change_pct)}%)</span><span class="mdot"></span>${esc(s.industry)||''}<span class="mdot"></span><span class="trig">${trig}</span>${isNum(s.ret5_pct)?`<span class="mdot"></span>5日 <span class="${cls(s.ret5_pct)} num">${fmt(s.ret5_pct,1)}%</span>`:''}${isNum(s.ret20_pct)?`<span class="mdot"></span>20日 <span class="${cls(s.ret20_pct)} num">${fmt(s.ret20_pct,1)}%</span>`:''}</div>
      </div>
      <div class="score"><div class="v">${iv(s.score)}</div><div class="l">信心分</div>${bonusHtml}</div>
    </div>
    ${kbars(s)}${bars(s)}${planBox(s.plan,s.position)}${cat}${tp}${rf}${chip}${val}${fund2}${whyPanel(s)}
  </div>`;
}

let LED=[],sortKey='ret_pct',sortDir=-1,fStatus='all',fProfile='all',fDate='all',q='';
function renderPerf(){
  /* perf always comes from the latest snapshot (history files have no performance block) */
  const p=(LATEST&&LATEST.performance)||{};
  const o=p.overall||{},es=p.exit_sim||{},bh=p.by_horizon||{};
  const isHist=!!(LATEST&&DATA&&DATA.date!==LATEST.date);
  const hname={1:'隔日',3:'3日',5:'5日',10:'10日',20:'20日',30:'30日'};
  let stats='<div class="stats">';
  if(isNum(o.win_rate))stats+=`<div class="stat"><div class="v">${o.win_rate}%</div><div class="l">勝率(最新報酬)<br>總 ${isNum(o.total)?o.total:'-'} · <span class="up">賺 ${isNum(o.win)?o.win:'-'}</span> · <span class="down">賠 ${isNum(o.loss)?o.loss:'-'}</span></div></div>`;
  if(isNum(es.closed)&&es.closed>0){
    stats+=`<div class="stat"><div class="v">${isNum(es.win_rate)?es.win_rate+'%':'-'}</div><div class="l">已實現勝率 · 平均(已扣成本) <span class="${cls(es.avg_ret)}">${fmt(es.avg_ret)}%</span>${isNum(es.avg_ret_gross)?` <span style="color:var(--muted-2)">(扣前${fmt(es.avg_ret_gross)}%)</span>`:''} · 持有 ${isNum(es.avg_hold_days)?es.avg_hold_days+'日':'-'}<br><span style="color:var(--muted-2)">隔日開盤進場 · 開高&gt;${isNum(es.max_chase)?es.max_chase:'-'}%棄單 · 停損-${isNum(es.hard_stop)?es.hard_stop:'-'}%/TP1=${isNum(es.r_multiple)?es.r_multiple:'-'}R · 含手續費${isNum(es.fee_rate)?es.fee_rate:'-'}%×2+稅${isNum(es.tax_rate)?es.tax_rate:'-'}%(同日出場才用當沖${isNum(es.tax_rate_daytrade)?es.tax_rate_daytrade:'-'}%)+滑價${isNum(es.slippage_pct)?es.slippage_pct:'-'}%×2</span></div></div>`;
    const rs=Object.entries(es.reasons||{}).map(([k,v])=>`${esc(k)} ${isNum(v)?v:'-'}%`).join(' · ');
    stats+=`<div class="stat"><div class="v" style="font-size:15px;font-weight:700">${rs||'—'}</div><div class="l">出場原因 · 持有中 ${isNum(es.open)?es.open:0} · 跳空棄單 ${isNum(es.skipped_gap)?es.skipped_gap:0} · 待進場 ${isNum(es.pending)?es.pending:0}${es.chased_catalyst?` · <span style="color:#8e44ad">催化劑放寬進場 ${es.chased_catalyst}</span>`:''}</div></div>`;
    /* 出場拆分:依進場型態(突破/回測轉強)與風格(動能/波段)—— 看哪種組合真有 edge,調參依據 */
    const trigLbl={breakout:'突破',pullback_turn:'回測轉強',other:'其他'},styleLbl={momentum:'動能',swing:'波段'};
    const brk=(grp,lbl)=>Object.entries(grp||{}).map(([k,s])=>`${lbl[k]||esc(k)} <span style="color:var(--muted-2)">n${s.n}</span>·勝${isNum(s.win_rate)?s.win_rate:'-'}%·<span class="${cls(s.avg_ret)}">${fmt(s.avg_ret)}%</span>·${isNum(s.avg_hold_days)?s.avg_hold_days:'-'}日`).join('　｜　');
    if(es.by_trigger&&Object.keys(es.by_trigger).length)
      stats+=`<div class="stat"><div class="v" style="font-size:13px;font-weight:600">${brk(es.by_trigger,trigLbl)}</div><div class="l">出場拆分 · 依進場型態</div></div>`;
    if(es.by_style&&Object.keys(es.by_style).length)
      stats+=`<div class="stat"><div class="v" style="font-size:13px;font-weight:600">${brk(es.by_style,styleLbl)}</div><div class="l">出場拆分 · 依風格</div></div>`;
  }
  stats+='</div>';

  let htab='';
  const hs=(p.horizons||[]).filter(h=>bh[h]);
  if(hs.length){
    htab=`<div class="sec-h"><span class="bar"></span>各天期平均報酬 + 期間最高漲幅</div><div class="tbl-wrap"><table class="t"><thead><tr>
      <th>進場後</th><th class="r">樣本</th><th class="r">勝率</th><th class="r">平均報酬</th><th class="r">平均最高漲幅</th></tr></thead><tbody>`
      +hs.map(h=>{const s=bh[h]||{};return `<tr><td class="tk">${hname[h]||esc(h)}</td><td class="r num">${isNum(s.n)?s.n:'-'}</td><td class="r num">${isNum(s.win_rate)?s.win_rate+'%':'-'}</td>
      <td class="r num ${cls(s.avg_ret)}">${fmt(s.avg_ret)}%</td><td class="r num" style="color:var(--warn)">${isNum(s.avg_maxgain)?fmt(s.avg_maxgain)+'%':'-'}</td></tr>`;}).join('')
      +`</tbody></table></div>`;
  }

  LED=p.ledger||[];
  const dates=[...new Set(LED.map(r=>r.date).filter(Boolean))].sort().reverse();
  if(fDate!=='all'&&fDate!==null&&!dates.includes(fDate))fDate='all'; /* selected date no longer present */
  const dateOpts=`<option value="all">全部選股日</option>`+dates.map(d=>`<option value="${esc(d)}"${fDate===d?' selected':''}>${esc(d)}</option>`).join('');
  const ledArea=LED.length?`
    <div class="sec-h"><span class="bar"></span>追蹤台帳 <span class="cnt">仍追蹤 ${isNum(p.ledger_total)?p.ledger_total:LED.length} 檔</span></div>
    <div class="filters" role="group" aria-label="台帳篩選">
      ${['all:全部','win:獲利','loss:虧損','止損:止損','移動停利:移動停利','持有中:持有中'].map(x=>{const[k,t]=x.split(':');return `<button type="button" class="fchip ${fStatus===k?'on':''}" data-st="${k}" aria-pressed="${fStatus===k}">${t}</button>`;}).join('')}
      <span class="sep"></span>
      ${['all:全部型態','動能:動能','品質:品質','均衡:均衡'].map(x=>{const[k,t]=x.split(':');return `<button type="button" class="fchip ${fProfile===k?'on':''}" data-pf="${k}" aria-pressed="${fProfile===k}">${t}</button>`;}).join('')}
      <span class="sep"></span>
      <select class="sel" id="fdate" aria-label="依選股日篩選">${dateOpts}</select>
      <input class="search" id="q" placeholder="搜尋代號 / 名稱" value="${esc(q)}" aria-label="搜尋代號或名稱">
    </div>
    <div id="ledtable"></div>`
    :`<div class="empty"><span class="ei">⏳</span>績效資料累積中 — 選股需經過至少 1 個交易日才有後續報酬,系統每天自動更新。</div>`;

  /* 選股 vs 執行 + 跳空棄單機會成本(有 signal 資料才顯示) */
  const sx=p.signal_vs_exec||{}, sig=p.signal||{}, sk=p.skip_cost||{};
  let edge='';
  if(isNum(sig.avg_ret)){
    let cards='<div class="stats">';
    cards+=`<div class="stat"><div class="v ${cls(sig.avg_ret)}">${fmt(sig.avg_ret)}%</div><div class="l">選股報酬 signal<br>從選股日收盤持有到最新 · 勝率 ${isNum(sig.win_rate)?sig.win_rate+'%':'-'} · ${isNum(sig.n)?sig.n:0} 檔</div></div>`;
    cards+=`<div class="stat"><div class="v ${cls(sx.exec_avg_ret)}">${isNum(sx.exec_avg_ret)?fmt(sx.exec_avg_ret)+'%':'—'}</div><div class="l">執行報酬 execution<br>照規則(跳空棄單視為未進場)· ${isNum(sx.n_decided)?sx.n_decided:0} 筆已決策</div></div>`;
    cards+=`<div class="stat"><div class="v ${cls(sx.delta)}">${isNum(sx.delta)?fmt(sx.delta)+'%':'—'}</div><div class="l">執行層 ${isNum(sx.delta)?(sx.delta<0?'<span class="down">在扣分</span>':'<span class="up">在加分</span>'):'—'}<br>execution − signal(edge 在選股還是執行)</div></div>`;
    cards+='</div>';
    const bg=sk.by_gap||{}, keys=Object.keys(bg);
    let skTab;
    if(isNum(sk.n)&&sk.n>0&&keys.length){
      skTab=`<div class="tbl-wrap"><table class="t"><thead><tr><th>跳空區間</th><th class="r">樣本</th><th class="r">勝率</th><th class="r">平均報酬</th><th class="r">平均最高漲幅</th></tr></thead><tbody>`
        +keys.map(k=>{const s=bg[k]||{};return `<tr><td class="tk">${esc(k)}</td><td class="r num">${isNum(s.n)?s.n:'-'}</td><td class="r num">${isNum(s.win_rate)?s.win_rate+'%':'-'}</td><td class="r num ${cls(s.avg_ret)}">${fmt(s.avg_ret)}%</td><td class="r num" style="color:var(--warn)">${isNum(s.avg_maxgain)?fmt(s.avg_maxgain)+'%':'-'}</td></tr>`;}).join('')
        +`</tbody></table></div><div class="hint">「跳空開高棄單」的票若當初照隔日開盤買進的後續表現;明顯為正 = 3% 一刀切在錯失 alpha。</div>`;
    } else {
      skTab=`<div class="empty" style="padding:14px"><span class="ei">⏳</span>尚無「跳空棄單」樣本可評估(需有開高超過門檻且已成熟的交易)。</div>`;
    }
    edge=`<div class="sec-h"><span class="bar"></span>選股 vs 執行 — edge 在哪?</div>${cards}<div class="sec-h"><span class="bar"></span>跳空棄單機會成本</div>${skTab}`;
  }

  const histNote=isHist?'<span class="tag-latest">最新</span> 績效統計與台帳恆顯示最新資料,不隨上方選股日切換。':'';
  $('#p-perf').innerHTML=`<div class="lead">每天自動更新過去所有核心選股後續走勢(以每日收盤計)。共追蹤 <b>${isNum(p.total_tracked)?p.total_tracked:0}</b> 檔。${histNote}</div>`+stats+htab+edge+ledArea;

  if(LED.length){
    /* chip clicks only update state + redraw rows; rebuild the chip bar's active state in place
       so the search box keeps focus/caret */
    const refreshChips=()=>{
      $('#p-perf').querySelectorAll('[data-st]').forEach(c=>{const on=c.dataset.st===fStatus;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on);});
      $('#p-perf').querySelectorAll('[data-pf]').forEach(c=>{const on=c.dataset.pf===fProfile;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on);});
    };
    $('#p-perf').querySelectorAll('[data-st]').forEach(c=>c.onclick=()=>{fStatus=c.dataset.st;refreshChips();drawLedger();});
    $('#p-perf').querySelectorAll('[data-pf]').forEach(c=>c.onclick=()=>{fProfile=c.dataset.pf;refreshChips();drawLedger();});
    $('#fdate').onchange=e=>{fDate=e.target.value;drawLedger();};
    const qi=$('#q');qi.oninput=()=>{q=qi.value;drawLedger();};
    drawLedger();
  }
}
function drawLedger(){
  let rows=LED.slice();
  if(fStatus==='win')rows=rows.filter(r=>r.ret_pct>0);
  else if(fStatus==='loss')rows=rows.filter(r=>r.ret_pct<0);
  else if(['止損','移動停利','均線停損','到期','持有中'].includes(fStatus))rows=rows.filter(r=>r.exit_reason===fStatus);
  if(fProfile!=='all')rows=rows.filter(r=>r.profile===fProfile);
  if(fDate!=='all')rows=rows.filter(r=>r.date===fDate);
  if(q.trim()){const s=q.trim();rows=rows.filter(r=>String(r.stock_id).includes(s)||(r.name||'').includes(s));}
  rows.sort((a,b)=>{const x=a[sortKey],y=b[sortKey];if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*sortDir;});
  const arrow=k=>sortKey===k?(sortDir<0?' ↓':' ↑'):'';
  const cols=[
    {k:'date',t:'選股日',f:r=>`<span style="color:var(--muted)">${esc(r.date)}</span>`},
    {k:'stock_id',t:'代號',f:r=>`<span class="tk">${slink(r.stock_id)}</span>`},
    {k:'name',t:'名稱',f:r=>esc(r.name)},
    {k:'profile',t:'型態',f:r=>badge(r.profile)},
    {k:'entry',t:'成本',r:1,f:r=>`<span class="num">${num(r.entry)}</span>`},
    {k:'latest_close',t:'最新',r:1,f:r=>`<span class="num">${num(r.latest_close)}</span>`},
    {k:'days',t:'天',r:1,f:r=>`<span class="num" style="color:var(--muted-2)">${isNum(r.days)?r.days:'-'}</span>`},
    {k:'ret_pct',t:'報酬率',r:1,f:r=>`<span class="num ${cls(r.ret_pct)}" style="font-weight:800">${fmt(r.ret_pct)}%</span>`},
    {k:'peak_gain_pct',t:'最高漲幅',r:1,f:r=>`<span class="num" style="color:var(--warn)">${isNum(r.peak_gain_pct)?fmt(r.peak_gain_pct)+'%':'-'}</span>`},
    {k:'exit_reason',t:'模擬出場',f:r=>r.exit_reason?`${esc(r.exit_reason)}${isNum(r.exit_ret_pct)?` <span class="num ${cls(r.exit_ret_pct)}">${fmt(r.exit_ret_pct)}%</span>`:''}`:'-'},
  ];
  const head=cols.map(c=>`<th class="${c.r?'r':''}" data-k="${c.k}">${c.t}${arrow(c.k)}</th>`).join('');
  const body=rows.map(r=>'<tr>'+cols.map(c=>`<td class="${c.r?'r':''}">${c.f(r)}</td>`).join('')+'</tr>').join('');
  $('#ledtable').innerHTML=`<div class="tbl-wrap"><table class="t"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="hint">顯示 ${rows.length} 檔 · 點欄位標題可排序</div>`;
  $('#ledtable').querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1;}drawLedger();});
}

/* ============================================================
   盤中即時
   ============================================================ */
function gateBox(g){
  if(!g) return '';
  const lab=g.label||'—';
  const klass=lab==='risk-on'?'gate-on':lab==='risk-off'?'gate-off':'gate-neu';
  const col=lab==='risk-on'?'var(--up)':lab==='risk-off'?'var(--down)':'var(--muted)';
  const seg=[];
  if(g.sox)seg.push(`費半 SOX <span class="num ${cls(g.sox.pct)}">${fmt(g.sox.pct)}%</span>`);
  if(g.nasdaq)seg.push(`NASDAQ期 <span class="num ${cls(g.nasdaq.pct)}">${fmt(g.nasdaq.pct)}%</span>`);

function orbCard(r){

function renderLive(force){

    h+=`<div class="note-box">盤前 08:45 自動分類、開盤後 09:25 自動判突破。掛<b>限價單</b>、別市價追。本頁非逐秒即時,於上述時點(與你手動觸發)更新。</div>`;
    if(po){h+=gateBox(po.gate);h+=`<div class="sec-h2"><span class="bar" style="width:3px;height:13px;border-radius:2px;background:var(--accent);display:inline-block"></span>盤前分類 — 有效 ${isNum(po.valid_count)?po.valid_count:0}/${isNum(po.total)?po.total:0} 檔</div>`;
      h+=(po.rows||[]).map(liveCard).join('')||'<div class="empty">盤前無分類資料</div>';}
    if(orb){h+=`<div class="sec-h2"><span class="bar" style="width:3px;height:13px;border-radius:2px;background:var(--accent);display:inline-block"></span>開盤 15 分 ORB — 已突破 ${isNum(orb.fired_count)?orb.fired_count:0} 檔</div>`;
      h+=(orb.rows||[]).map(orbCard).join('')||'<div class="empty">開盤後無 ORB 資料</div>';}

    panel.innerHTML='<div class="live-head"><div class="live-upd" style="color:var(--muted)">盤中即時資料尚未產生</div><button class="refresh" id="lrefresh" aria-label="重新整理盤中資料"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>重新整理</button></div><div class="empty"><span class="ei">📡</span>盤中即時資料尚未產生。系統於每交易日 08:45(盤前分類)與 09:25(開盤15分突破)自動更新;需先有當日盤後核心選股。</div>';
    const rb=$('#lrefresh');if(rb)rb.onclick=()=>renderLive(true);
  });

/* ============================================================
   個股健檢(Stock Health)— 2026-06-30 新增
   設計原則:每個分數都可點開回推依據(formula/source/asof/missing_reason),
   後端 scripts/health/engine.py 已把 9 個面向算好,這裡只負責「泛型渲染」——
   新增 Engine 不必改這段前端程式碼,只要 JSON 多一個 engines[] 項目就會自動出現一張卡。
   ============================================================ */
const HEALTH_RISK_COLOR={Low:'var(--up)',Medium:'var(--warn)',High:'var(--down)',Critical:'var(--down)'};
const HEALTH_RISK_DOT={Low:'🟢',Medium:'🟡',High:'🟠',Critical:'🔴'};
const HEALTH_MISSING_LABEL={stale_cache:'快取不夠新/不夠長,持續累積中',api_unavailable:'資料來源這次抓不到',not_applicable:'目前不適用或無此資料'};
const HEALTH_STATUS_ARROW={improving:'<span class="up">↑</span>',worsening:'<span class="down">↓</span>',stable:'<span class="flat">→</span>'};
const HEALTH_RADAR_ORDER=['financial','growth','value','risk','technical','chip','news'];

function healthStars(n){
  n=Math.max(0,Math.min(5,Math.round(Number(n)||0)));
  return '★'.repeat(n)+'☆'.repeat(5-n);
}
function riskLight(level){
  if(!level)return '<span style="color:var(--muted)">風險等級:資料不足</span>';
  return `<span style="color:${HEALTH_RISK_COLOR[level]||'var(--muted)'};font-weight:800">${HEALTH_RISK_DOT[level]||''} 風險等級:${esc(level)}</span>`;
}
function healthRadar(engines){
  const map={};(engines||[]).forEach(e=>{map[e.key]=e;});
  const n=HEALTH_RADAR_ORDER.length,R=68,CX=90,CY=90;
  const pts=HEALTH_RADAR_ORDER.map((k,i)=>{
    const e=map[k]||{};
    const v=isNum(e.score)?Math.max(0,Math.min(100,Number(e.score)))/100:0;
    const ang=-Math.PI/2+i*(2*Math.PI/n);
    return {x:CX+R*v*Math.cos(ang),y:CY+R*v*Math.sin(ang),
            lx:CX+(R+22)*Math.cos(ang),ly:CY+(R+22)*Math.sin(ang),
            label:e.label||k,has:isNum(e.score)};
  });
  const poly=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const rings=[0.25,0.5,0.75,1].map(f=>{
    const rp=HEALTH_RADAR_ORDER.map((_,i)=>{const ang=-Math.PI/2+i*(2*Math.PI/n);
      return `${(CX+R*f*Math.cos(ang)).toFixed(1)},${(CY+R*f*Math.sin(ang)).toFixed(1)}`;}).join(' ');
    return `<polygon points="${rp}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }).join('');
  const spokes=HEALTH_RADAR_ORDER.map((_,i)=>{const ang=-Math.PI/2+i*(2*Math.PI/n);
    return `<line x1="${CX}" y1="${CY}" x2="${(CX+R*Math.cos(ang)).toFixed(1)}" y2="${(CY+R*Math.sin(ang)).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;}).join('');
  const labels=pts.map(p=>`<text x="${p.lx.toFixed(1)}" y="${p.ly.toFixed(1)}" font-size="9" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">${esc(p.label)}${p.has?'':'(缺)'}</text>`).join('');
  return `<div class="health-radar"><svg viewBox="0 0 180 180">${rings}${spokes}<polygon points="${poly}" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="1.5"/></svg>${labels?`<svg viewBox="0 0 180 180" style="margin-top:-180px">${labels}</svg>`:''}</div>`;
}
function swingBox(label,val,reason){
  return `<div class="health-swing-box"><div class="hsb-l">${esc(label)}</div><div class="hsb-v">${isNum(val)?Math.round(Number(val)):'-'}</div><div class="hsb-r">${esc(reason||'')}</div></div>`;
}
function metricRow(m){
  const has=m.value!==null&&m.value!==undefined;
  const valStr=has?(typeof m.value==='number'?num(m.value,2):esc(String(m.value))):'資料不足';
  const arrow=HEALTH_STATUS_ARROW[m.status]||'';
  const ratingColor=m.rating==='good'?'var(--up)':m.rating==='bad'?'var(--down)':m.rating==='neutral'?'var(--warn)':null;
  const ratingDot=ratingColor?`<span class="hm-dot" style="background:${ratingColor}"></span>`:'';
  const indStr=isNum(m.industry_avg)?`同業約 ${num(m.industry_avg,2)}${esc(m.unit||'')}`:'';
  const missingStr=(!has&&m.missing_reason)?`<span class="hm-missing">(${esc(HEALTH_MISSING_LABEL[m.missing_reason]||m.missing_reason)})</span>`:'';
  const trendStr=(m.trend&&m.trend.length)?m.trend.map(t=>`${esc(t.period)}:${isNum(t.value)?num(t.value,2):'-'}`).join(' → '):'';
  return `<details class="hm-row"><summary>
      <span class="hm-label">${ratingDot}${esc(m.label)}</span>
      <span class="hm-val">${esc(valStr)}${has?esc(m.unit||''):''} ${arrow}</span>
      ${indStr?`<span class="hm-ind">${esc(indStr)}</span>`:''}${missingStr}
    </summary>
    <div class="hm-detail">
      ${m.formula?`<div><b>算法:</b>${esc(m.formula)}</div>`:''}
      <div><b>來源:</b>${esc(m.source||'-')}${m.asof?`(資料時點:${esc(m.asof)})`:''}</div>
      <div><b>更新時間:</b>${esc(m.updated_at||'-')}</div>
      ${trendStr?`<div><b>近期趨勢:</b>${trendStr}</div>`:''}
    </div>
  </details>`;
}
function engineCard(eng){
  const has=isNum(eng.score);
  const color=has?(eng.score>=70?'var(--up)':eng.score<=40?'var(--down)':'var(--warn)'):'var(--muted)';
  const notes=(eng.notes||[]).map(n=>`<div class="hm-note">${esc(n)}</div>`).join('');
  return `<details class="health-engine-card">
    <summary><span>${esc(eng.label)}</span><span style="color:${color};font-weight:800">${has?num(eng.score,1):'資料不足'}</span></summary>
    <div class="health-metric-list">${(eng.metrics||[]).map(metricRow).join('')}</div>
    ${notes}
  </details>`;
}
function healthEmptyState(sid){

    本系統只對「核心精選 + 自選池」每日自動算健檢(控制 FinMind 免費 API 額度);

    <span style="color:var(--muted-2);font-size:12px">${HEALTH_API_ENABLED?'即時查詢失敗,請稍後再試。':'(任意代號即時查詢需另外部署 Vercel API,目前未啟用)'}</span></div>`;
}
function renderHealthReport(d){
  const out=$('#health-report');if(!out)return;
  const scores=d.scores||{};
  const styles=Object.keys(scores);
  if(!styles.includes(HEALTH_STYLE))HEALTH_STYLE=d.default_style||styles[0]||'value_investing';
  const cur=scores[HEALTH_STYLE]||{};
  const diag=cur.diagnosis||{};
  const scoreColor=(diag.stars||0)>=4?'var(--up)':(diag.stars||0)<=2?'var(--down)':'var(--warn)';
  const engineLabelMap={};(d.engines||[]).forEach(e=>{engineLabelMap[e.key]=e.label;});
  const styleTgls=styles.map(s=>`<button class="tgl hs-tgl${s===HEALTH_STYLE?' on':''}" data-style="${esc(s)}">${esc((scores[s]&&scores[s].label)||s)}</button>`).join('');

  let html='';
  html+=`<div class="health-top">
    <div class="health-score-block">
      ${donut(isNum(cur.total)?cur.total/100:0,scoreColor,isNum(cur.total)?num(cur.total,0):'-')}
      <div class="health-stars">${healthStars(diag.stars)}</div>
      <div class="health-label" style="color:${scoreColor}">${esc(diag.label||'-')}</div>
      <div class="health-reason">${esc(diag.reason||'')}</div>
    </div>
    <div class="health-radar-block">${healthRadar(d.engines)}</div>
    <div class="health-meta-block">
      <div class="health-risk-line">${riskLight(d.risk_level)}</div>
      <div class="health-style-row">${styleTgls}</div>

      ${(cur.missing_engines&&cur.missing_engines.length)?`<div class="health-missing-note">未涵蓋面向(資料不足):${cur.missing_engines.map(k=>esc(engineLabelMap[k]||k)).join('、')}(權重已按比例重分配給其餘面向,涵蓋權重 ${num(cur.covered_weight_pct,0)}%)</div>`:''}
      <div style="font-size:11px;color:var(--muted-2)">${esc(d.updated_at||'')}${d.live?' · 即時查詢':' · 每日批次'}</div>
    </div>
  </div>`;

  const sum=d.ai_summary||{};
  html+=`<div class="panelcard health-summary-card">
    <div class="pc-h"><span>AI 解讀</span>${sum.narrative_ai?'<span class="lk" id="health-ai-toggle">查看原始規則句</span>':''}</div>
    <div id="health-narrative">${esc(sum.narrative_ai||sum.narrative||'目前可用資料不足以形成完整摘要。')}</div>
    ${(sum.pros&&sum.pros.length)?`<div class="health-pc"><b style="color:var(--up-ink)">優點</b><ul>${sum.pros.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:''}
    ${(sum.cons&&sum.cons.length)?`<div class="health-pc"><b style="color:var(--down-ink)">缺點</b><ul>${sum.cons.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:''}
    ${(sum.risks&&sum.risks.length)?`<div class="health-pc"><b style="color:var(--warn-ink)">風險</b><ul>${sum.risks.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:''}
    ${(sum.watch&&sum.watch.length)?`<div class="health-pc"><b style="color:var(--muted)">未來需要觀察</b><ul>${sum.watch.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:''}
  </div>`;

  const swing=d.swing||{};
  const sr=swing.reasons||{};
  html+=`<div class="panelcard" style="margin-top:14px">
    <div class="pc-h"><span>短線評估(Swing Score)</span></div>
    <div class="health-swing">
      ${swingBox('當沖',swing.day_trade,sr.day_trade)}

    html+=`<div class="panelcard" style="margin-top:14px">

      <div class="health-dcf">

        <div class="health-dcf-assump">假設:成長率 ${num(asu.growth_rate_pct,1)}% · 折現率 ${num(asu.discount_rate_pct,1)}% · 永續成長 ${num(asu.terminal_growth_pct,1)}%</div>
        <div class="health-dcf-formula">${esc(dcf.formula||'')}</div>
      </div>
    </div>`;
  } else if(d.dcf&&d.dcf.reason){
    html+=`<div class="panelcard" style="margin-top:14px"><div class="pc-h"><span>DCF 估值</span></div><div class="health-dcf" style="color:var(--muted)">資料不足:${esc(d.dcf.reason)}</div></div>`;

  out.innerHTML=html;
  out.querySelectorAll('.hs-tgl').forEach(b=>b.onclick=()=>{HEALTH_STYLE=b.dataset.style;renderHealthReport(d);});
  const aiToggle=$('#health-ai-toggle');
  if(aiToggle){
    let showingAi=true;
    aiToggle.onclick=()=>{
      showingAi=!showingAi;
      $('#health-narrative').textContent=showingAi?(sum.narrative_ai||sum.narrative):sum.narrative;
      aiToggle.textContent=showingAi?'查看原始規則句':'查看 AI 潤飾版';
    };
  }
}
function loadHealthStock(sid){
  sid=String(sid||'').trim();
  if(!sid)return;
  const out=$('#health-report');if(!out)return;
  if(HEALTH_CACHE[sid]){renderHealthReport(HEALTH_CACHE[sid]);return;}
  out.innerHTML='<div class="empty">即時查詢中,約需 10~20 秒…</div>';
  fetch(HEALTH_API_BASE+'/api/health?stock='+encodeURIComponent(sid)).then(r=>{
    if(!r.ok)throw new Error('http '+r.status);
    return r.json();
  }).then(d=>{HEALTH_CACHE[sid]=d;renderHealthReport(d);})
  .catch(e=>{out.innerHTML=healthEmptyState(sid)+`<div class="err" style="margin-top:10px">即時查詢失敗:${esc(e&&e.message||e)}</div>`;});
}

      輸入任意上市櫃代號即時查詢,約需 10~20 秒。</div>
    <div class="health-search">
      <input type="text" id="health-input" class="health-input" placeholder="輸入股票代號,例如 2330" autocomplete="off">
      <button class="tgl" id="health-go">查詢</button>
    </div>
    <div id="health-quicklist" class="health-quicklist"></div>
    <div id="health-report"></div>
  `;
  const input=$('#health-input'),go=$('#health-go');
  const submit=()=>{if(input.value.trim())loadHealthStock(input.value.trim());};
  go.onclick=submit;
  input.onkeydown=e=>{if(e.key==='Enter')submit();};
  $('#health-quicklist').innerHTML='<span class="hq-label">常用:</span>'+
    ['2330 台積電','2454 聯發科','2317 鴻海','2881 富邦金','6669 緯穎'].map(s=>{
      const [id,name]=s.split(' ');
      return `<button class="hq-chip" data-sid="${id}">${id} ${name}</button>`;
    }).join('');
  $('#health-quicklist').querySelectorAll('.hq-chip').forEach(c=>c.onclick=()=>{input.value=c.dataset.sid;loadHealthStock(c.dataset.sid);});
}

/* ============================================================
   tabs / 載入
   ============================================================ */
function activateTab(p){
  document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.p===p;t.classList.toggle('active',on);t.setAttribute('aria-selected',on?'true':'false');});
  document.querySelectorAll('.panel').forEach(pl=>pl.classList.toggle('active',pl.id==='p-'+p));
  if(p==='live')startLivePoll();else stopLivePoll();
  if(p==='dash')loadDashLive();
  if(p==='health'&&!HEALTH_TAB_INIT){HEALTH_TAB_INIT=true;renderHealthTab();}
}
(function wireTabs(){
  const tabs=[...document.querySelectorAll('.tab')];
  tabs.forEach((t,i)=>{
    t.onclick=()=>activateTab(t.dataset.p);
    t.onkeydown=e=>{
      let j=null;
      if(e.key==='ArrowRight'||e.key==='ArrowDown')j=(i+1)%tabs.length;
      else if(e.key==='ArrowLeft'||e.key==='ArrowUp')j=(i-1+tabs.length)%tabs.length;
      else if(e.key==='Home')j=0;
      else if(e.key==='End')j=tabs.length-1;
      if(j!==null){e.preventDefault();tabs[j].focus();activateTab(tabs[j].dataset.p);}
    };
  });
})();

function renderAll(){setSub();renderDash();renderCore();renderWatch();renderWatchlist();renderPerf();}
function loadDay(dt){
  if(!LATEST)return;
  if(dt===LATEST.date){DATA=LATEST;LABEL=LATEST.label||{};renderAll();return;}
  fetch('./history/'+dt+'.json?'+Date.now()).then(r=>{
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(h=>{
    /* history snapshots carry NO performance / generated_at — keep latest's perf for the 績效 tab,
       but override the day-specific fields. Label perf widgets as 最新 (handled in renderDash/renderPerf). */
    DATA=Object.assign({},LATEST,{
      date:h.date||dt,
      core:Array.isArray(h.core)?h.core:[],
      watch:Array.isArray(h.watch)?h.watch:[],
      watchlist:Array.isArray(h.watchlist)?h.watchlist:[],
      index_below_ma20:!!h.index_below_ma20,
      scored_count:isNum(h.scored_count)?h.scored_count:0,
      label:h.label||LATEST.label||{}
    });
    LABEL=DATA.label||{};
    renderAll();
  }).catch(e=>{
    /* keep DATA pointing at whatever we last had; show a clear, non-crashing error in every core-derived panel */
    const msg=`<div class="err">讀取 ${esc(dt)} 的歷史快照失敗(${esc(e&&e.message||e)})。此日期可能尚無歷史檔。</div>`;
    $('#p-core').innerHTML=msg;
    $('#p-watch').innerHTML=msg;
    $('#p-watchlist').innerHTML=msg;
    $('#p-dash').innerHTML=msg;
  });
}
fetch('./data.json?'+Date.now()).then(r=>r.json()).then(d=>{
  LATEST=d;DATA=d;LABEL=d.label||{};
  setSub();renderDash();renderCore();renderWatch();renderWatchlist();renderPerf();
  fetch('./dates.json?'+Date.now()).then(r=>r.json()).then(dates=>{
    if(!dates||dates.length<2)return;
    const sel=document.createElement('select');sel.className='sel';
    dates.slice().reverse().forEach(dt=>{const o=document.createElement('option');o.value=dt;o.textContent=dt+(dt===LATEST.date?' (最新)':'');sel.appendChild(o);});
    sel.value=LATEST.date;sel.onchange=()=>loadDay(sel.value);
    const bar=$('#datebar');bar.innerHTML='<span>看哪一天的選股:</span>';bar.appendChild(sel);
    bar.insertAdjacentHTML('beforeend','<span style="color:var(--muted-2)">(績效分頁可在台帳內依選股日篩選)</span>');
  }).catch(()=>{});
}).catch(e=>{$('#sub').innerHTML='';$('#p-dash').innerHTML=`<div class="err">讀取 data.json 失敗:${e}。請先讓 GitHub Actions 跑一次產生 docs/data.json。</div>`;});
</script>
