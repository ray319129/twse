<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股短線選股</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --line:#eef0f3; --line-soft:#f4f5f7;
    --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --muted-2:#94a3b8;
    --up:#16a34a; --up-bg:#ecfdf3; --down:#dc2626; --down-bg:#fef2f2; --flat:#94a3b8;
    --accent:#6366f1; --accent-ink:#4f46e5; --accent-bg:#eef2ff;
    --warn:#d97706; --warn-bg:#fffbeb;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06);
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --radius:14px; --radius-sm:10px;
    --mom:#e11d48; --mom-bg:#fff1f2; --qual:#2563eb; --qual-bg:#eff6ff; --bal:#64748b; --bal-bg:#f1f5f9;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif;
    font-feature-settings:"tnum" 1;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1120px;margin:0 auto;padding:32px 24px 64px;}
  .num{font-variant-numeric:tabular-nums;}
  .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--flat);}
  a{color:var(--accent-ink);text-decoration:none;} a:hover{text-decoration:underline;}

  /* Header */
  .head{margin-bottom:22px;}
  .title{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;}
  .sub{color:var(--muted);font-size:13.5px;margin-top:6px;}
  .pill-mkt{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;}
  .datebar{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);}

  /* Tabs (segmented pill) */
  .tabs{display:inline-flex;gap:4px;background:#eef0f3;padding:4px;border-radius:999px;margin:18px 0 22px;flex-wrap:wrap;}
  .tab{padding:7px 16px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:transparent;transition:all .18s ease;white-space:nowrap;}
  .tab:hover{color:var(--ink-2);}
  .tab.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);}

  .panel{display:none;animation:fade .25s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .lead{color:var(--muted);font-size:13px;margin-bottom:14px;}

  /* Card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px;}
  .card-pad{padding:8px;}

  /* Core card */
  .ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px;transition:box-shadow .2s ease,transform .2s ease;}
  .ccard:hover{box-shadow:0 2px 4px rgba(16,24,40,.05),0 10px 28px rgba(16,24,40,.09);transform:translateY(-1px);}
  .ccard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .tkr{font-size:16px;font-weight:800;letter-spacing:-.01em;}
  .tkr .rank{color:var(--muted-2);font-weight:700;margin-right:2px;}
  .tkr .nm{color:var(--ink-2);font-weight:600;margin-left:4px;}
  .score{text-align:right;line-height:1;}
  .score .v{font-size:24px;font-weight:800;letter-spacing:-.02em;}
  .score .l{font-size:10.5px;color:var(--muted-2);font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
  .meta{color:var(--muted);font-size:13px;margin-top:7px;}
  .meta b{color:var(--ink-2);font-weight:600;}
  .bars{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .bar{font-size:11px;color:var(--muted);background:var(--line-soft);padding:3px 8px;border-radius:7px;font-weight:600;}
  .bar i{font-style:normal;color:var(--ink-2);}

  /* Badge */
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.01em;vertical-align:middle;}
  .b-mom{background:var(--mom-bg);color:var(--mom);} .b-qual{background:var(--qual-bg);color:var(--qual);} .b-bal{background:var(--bal-bg);color:var(--bal);}
  .chip-tag{display:inline-block;background:var(--accent-bg);color:var(--accent-ink);padding:2px 8px;border-radius:7px;font-size:11.5px;font-weight:600;margin:2px 4px 2px 0;}
  .chip-combo{background:var(--up-bg);color:#15803d;}

  /* plan box */
  .plan{margin-top:12px;background:linear-gradient(180deg,#fbfdfc,#f6faf8);border:1px solid #e6efe9;border-radius:var(--radius-sm);padding:12px 14px;}
  .plan .ph{font-weight:700;font-size:13px;color:#14532d;display:flex;align-items:center;gap:6px;}
  .plan table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px;}
  .plan td{padding:5px 6px;vertical-align:top;}
  .plan td:first-child{white-space:nowrap;width:1%;}
  .scn{font-weight:700;font-size:12px;}
  .scn small{display:block;color:var(--muted);font-weight:600;font-size:11px;margin-top:1px;}
  .plan .foot{margin-top:9px;padding-top:9px;border-top:1px dashed #dbe7df;font-size:12px;color:var(--ink-2);}
  .plan .foot .tiny{color:var(--muted);font-size:11px;margin-top:3px;display:block;}

  /* extra meta rows */
  .row-meta{margin-top:7px;font-size:12.5px;color:var(--muted);}
  .row-meta b{color:var(--ink-2);font-weight:600;}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px 18px;}
  .stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;}
  .stat .l{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.45;}

  /* Table */
  .tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
  .tbl-wrap::-webkit-scrollbar{height:6px;} .tbl-wrap::-webkit-scrollbar-thumb{background:#d7dce2;border-radius:3px;}
  table.t{width:100%;border-collapse:collapse;font-size:13px;}
  table.t th{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:.01em;
    text-align:left;padding:12px 14px;background:#fbfcfd;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;transition:color .15s;}
  table.t th:hover{color:var(--ink-2);}
  table.t th.r{text-align:right;} table.t td.r{text-align:right;}
  table.t td{padding:12px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap;color:var(--ink-2);}
  table.t tbody tr{transition:background .14s ease;}
  table.t tbody tr:hover td{background:#f8fafc;}
  table.t tbody tr:last-child td{border-bottom:none;}
  table.t .tk{font-weight:700;color:var(--ink);}
  .sec-h{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:20px 0 10px;}

  /* Filters */
  .filters{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px;}
  .fchip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);
    cursor:pointer;font-size:12.5px;font-weight:600;transition:all .16s ease;box-shadow:var(--shadow-sm);}
  .fchip:hover{color:var(--ink);border-color:#dfe3e8;background:#fbfcfd;}
  .fchip.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(99,102,241,.28);}
  .sep{width:1px;height:20px;background:var(--line);margin:0 4px;}
  select.sel,input.search{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);outline:none;transition:border-color .15s,box-shadow .15s;}
  select.sel:focus,input.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
  input.search{min-width:150px;}
  .hint{color:var(--muted-2);font-size:11.5px;margin-top:8px;}

  .empty{color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;font-size:13.5px;}
  .err{background:var(--down-bg);color:var(--down);border:1px solid #fecaca;border-radius:var(--radius);padding:16px;}
  .note-box{background:var(--accent-bg);border:1px solid #e0e3ff;border-radius:var(--radius-sm);padding:11px 14px;font-size:12.5px;color:var(--accent-ink);margin-bottom:14px;line-height:1.55;}
  .foot-note{color:var(--muted-2);font-size:12px;margin-top:26px;text-align:center;}
  .hot{filter:saturate(1.2);}

  /* 盤中即時 */
  .live-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .live-upd{font-size:12px;color:var(--muted);}
  .refresh{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-2);
    cursor:pointer;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-sm);transition:all .16s ease;}
  .refresh:hover{background:#fbfcfd;border-color:#dfe3e8;}
  .gate{border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px;border:1px solid var(--line);}
  .gate-on{background:var(--up-bg);border-color:#bbf7d0;} .gate-off{background:var(--down-bg);border-color:#fecaca;}
  .gate-neu{background:#f1f5f9;border-color:#e2e8f0;}
  .gate .mx{font-size:13px;color:var(--ink-2);margin-top:6px;}
  .lcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--muted-2);
    border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
  .lcard.A{border-left-color:var(--up);} .lcard.B{border-left-color:var(--warn);}
  .lcard.C{border-left-color:var(--down);} .lcard.skip{border-left-color:var(--muted-2);opacity:.82;}
  .lcard .lt{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
  .lcard .nm2{color:var(--ink-2);font-weight:600;margin-left:4px;}
  .lcard .scen{font-weight:700;font-size:13px;white-space:nowrap;}
  .lcard .act{font-size:13px;color:var(--ink);margin-top:6px;}
  .lcard .lvl{font-size:12px;color:var(--muted);margin-top:5px;}
  .lcard .lvl b{color:var(--ink-2);}
  .sec-h2{font-size:14px;font-weight:700;margin:18px 0 10px;color:var(--ink);}
  /* 手機版 */
  @media(max-width:640px){
    .wrap{padding:16px 12px 48px;}
    .title{font-size:19px;}
    .sub{font-size:12.5px;}
    .datebar{font-size:12px;}
    /* tabs 改水平滑動,不擠成兩排 */
    .tabs{display:flex;flex-wrap:nowrap;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:14px 0 18px;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{flex:0 0 auto;padding:7px 14px;}
    .stats{grid-template-columns:1fr;gap:10px;}
    .stat{padding:14px 16px;} .stat .v{font-size:22px;}
    .ccard,.card{padding:14px;}
    .ccard .top{gap:8px;}
    .tkr{font-size:15px;}
    .score .v{font-size:20px;}
    .meta{font-size:12px;}
    .plan{padding:10px 12px;} .plan table{font-size:11.5px;} .plan td{padding:4px 4px;}
    .note-box{font-size:12px;padding:10px 12px;}
    table.t{font-size:12.5px;} table.t th,table.t td{padding:10px 11px;}
    /* filters:讓搜尋/下拉撐滿、不溢出 */
    .filters{gap:6px;}
    select.sel,input.search{flex:1 1 140px;min-width:0;}
    .sep{display:none;}
  }
  @media(max-width:380px){
    .tkr{font-size:14px;} .score .v{font-size:18px;}
    .bar{font-size:10.5px;padding:2px 7px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="title">📈 台股短線選股</div>
    <div class="sub" id="sub">載入中…</div>
    <div class="datebar" id="datebar"></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-p="core">核心精選</button>
    <button class="tab" data-p="live">盤中即時</button>
    <button class="tab" data-p="watch">觀察清單</button>
    <button class="tab" data-p="watchlist">自選池</button>
    <button class="tab" data-p="perf">歷史追蹤與績效</button>
  </div>

  <div class="panel active" id="p-core"></div>
  <div class="panel" id="p-live"></div>
  <div class="panel" id="p-watch"></div>
  <div class="panel" id="p-watchlist"></div>
  <div class="panel" id="p-perf"></div>

  <div class="foot-note">資料每個交易日由 GitHub Actions 自動更新 · 本頁為條件排序結果,非投資建議</div>
</div>

<script>
const $=(s,el=document)=>el.querySelector(s);
const fmt=(v,d=2)=>(v===null||v===undefined||isNaN(v))?'-':(v>=0?'+':'')+Number(v).toFixed(d);
const num=(v,d=2)=>(v===null||v===undefined||isNaN(v))?'-':Number(v).toFixed(d);
const cls=v=>(v===null||v===undefined||isNaN(v))?'flat':(v>0?'up':v<0?'down':'flat');
const badge=p=>p==='動能'?'<span class="badge b-mom">動能</span>':p==='品質'?'<span class="badge b-qual">品質</span>':`<span class="badge b-bal">${p||'—'}</span>`;
let DATA=null,LATEST=null,LABEL={};
const lbl=h=>LABEL[h]||h;

function setSub(){
  const d=DATA||{};
  const mkt=d.index_below_ma20
    ? '<span class="pill-mkt" style="background:var(--down-bg);color:var(--down)">大盤在月線下 · 偏弱</span>'
    : '<span class="pill-mkt" style="background:var(--up-bg);color:var(--up)">大盤站上月線 · 偏多</span>';
  const hist=(LATEST&&d.date!==LATEST.date)?' <span style="color:var(--warn);font-weight:600">· 歷史</span>':'';
  $('#sub').innerHTML=`${d.date||''}${hist} &nbsp;·&nbsp; 全市場 ${d.scored_count||0} 檔評分 &nbsp;·&nbsp; ${mkt}${LATEST&&LATEST.generated_at?` &nbsp;·&nbsp; 更新 ${LATEST.generated_at}`:''}`;
}

/* ---------- 核心 ---------- */
function bars(s){
  const m=[['趨勢',s.trend],['強度',s.rs],['時機',s.setup],['品質',s.quality],['量能',s.liquidity]];
  return `<div class="bars">${m.map(([k,v])=>`<span class="bar">${k} <i>${Math.round((v||0)*100)}</i></span>`).join('')}</div>`;
}
function planBox(p){
  if(!p) return '';
  return `<div class="plan">
    <div class="ph">🎯 明日進場決策卡 <span style="color:var(--muted);font-weight:600">· 昨收 ${num(p.ref)}</span></div>
    <table>
      <tr><td><span class="scn" style="color:var(--qual)">A 平盤</span><small>開 ${num(p.flat_lo)}~${num(p.flat_hi)}</small></td>
          <td>等開盤後 15 分,<b>突破開盤區間高</b>再進(別開盤就追)。</td></tr>
      <tr><td><span class="scn" style="color:var(--warn)">B 開高</span><small>&gt; ${num(p.gap_up_line)}</small></td>
          <td>防開高走低:<b>別市價追</b>。回測昨收 ${num(p.ref)} 不破再進(上限 ${num(p.max_entry)});不回頭就放棄。</td></tr>
      <tr><td><span class="scn" style="color:var(--down)">C 開低</span><small>&lt; ${num(p.gap_dn_line)}</small></td>
          <td>別接刀:需<b>站回開盤價 + 帶量吞噬</b>、大盤沒同步崩才試單;破停損 ${num(p.init_stop)} 則放棄。</td></tr>
    </table>
    <div class="foot">進場後:<span class="down" style="font-weight:700">停損 ${num(p.init_stop)}</span> · <span class="up" style="font-weight:700">TP1 ${num(p.tp1)}</span>(${num(p.risk_pct,1)}R · 1:2)· 觸 TP1 後移動停利(收盤破 ${p.trail_ma}MA 出清)${p.tp1_resistance?' · <span style="color:var(--warn);font-weight:600">⚠ TP1 上方有壓</span>':''}
      <span class="tiny">停損 / TP1 以實際成交價重算;部位用固定風險回推股數。</span>
    </div>
  </div>`;
}
function coreCard(s,i){
  const trig=s.breakout?'帶量突破':s.pullback_turn?'回測轉強':'觸發';
  let chip='';
  if(s.chips&&s.chips.inst_total_today!==undefined){
    chip=`<div class="row-meta">籌碼:<b>三大法人 ${(s.chips.inst_total_today/1000).toFixed(0)} 張</b>${s.chips.inst_buy_streak>0?` · 連買 ${s.chips.inst_buy_streak} 日`:''}${s.chips.foreign_holding_pct!==undefined?` · 外資持股 ${s.chips.foreign_holding_pct}%`:''}</div>`;
  }
  let val='';
  if(s.valuation&&(s.valuation.pe||s.valuation.yield_pct)){
    val=`<div class="row-meta">估值:${s.valuation.pe?`PE ${num(s.valuation.pe,1)}`:''}${s.valuation.yield_pct?` · 殖利率 ${num(s.valuation.yield_pct,2)}%`:''}${s.fundamentals&&s.fundamentals.eps_latest!==undefined?` · 最新季EPS ${s.fundamentals.eps_latest}`:''}</div>`;
  }
  return `<div class="ccard">
    <div class="top">
      <div><div class="tkr"><span class="rank">#${i+1}</span>${s.hot_industry?'🔥 ':''}${s.stock_id}<span class="nm">${s.name}</span> ${badge(s.profile)}</div>
        <div class="meta">收 <b class="num">${num(s.close)}</b> <span class="${cls(s.change_pct)} num">(${fmt(s.change_pct)}%)</span> · ${s.industry||''} · <b style="color:var(--up)">${trig}</b>${s.ret5_pct!=null?` · 5日 <span class="${cls(s.ret5_pct)} num">${fmt(s.ret5_pct,1)}%</span>`:''}${s.ret20_pct!=null?` · 20日 <span class="${cls(s.ret20_pct)} num">${fmt(s.ret20_pct,1)}%</span>`:''}</div>
      </div>
      <div class="score"><div class="v" style="color:var(--accent-ink)">${s.score}</div><div class="l">信心分</div></div>
    </div>
    ${bars(s)}${planBox(s.plan)}${chip}${val}
  </div>`;
}
function renderCore(){
  const c=DATA.core||[];
  $('#p-core').innerHTML=`<div class="lead">信心分最高、今天有新鮮觸發(帶量突破 / 回測支撐轉強)、未過熱 → 可考慮進場(${c.length} 檔)。</div>`
    +`<div class="note-box">📌 <b>隔日跳空怎麼辦</b>:依每檔「進場決策卡」掛<b>限價單</b>,別市價追。開盤在進場上限內才進;開高超過上限就別追(R:R 已破壞),等回測或放棄;開低破初始停損則作廢。停損 / TP1 以實際成交價重算,部位用固定風險回推。</div>`
    +(c.length?c.map(coreCard).join(''):`<div class="empty">今日無核心標的(大盤偏弱或無新鮮突破)。寧缺勿濫。</div>`);
}

/* ---------- 觀察 ---------- */
function renderWatch(){
  const w=DATA.watch||[];
  if(!w.length){$('#p-watch').innerHTML=`<div class="lead">高信心分但還沒觸發,放口袋盯。</div><div class="empty">今日無醞釀中標的。</div>`;return;}
  const rows=w.map((r,i)=>`<tr>
    <td class="num" style="color:var(--muted-2)">${i+1}</td>
    <td class="tk">${r.hot_industry?'🔥 ':''}${r.stock_id}</td>
    <td>${r.name}</td>
    <td style="color:var(--muted)">${r.industry||''}</td>
    <td class="r num">${num(r.close)}</td>
    <td class="r num ${cls(r.change_pct)}">${fmt(r.change_pct)}%</td>
    <td class="r num ${cls(r.ret20_pct)}">${fmt(r.ret20_pct,1)}%</td>
    <td>${badge(r.profile)}</td>
    <td class="r num" style="font-weight:700;color:var(--accent-ink)">${r.score}</td></tr>`).join('');
  $('#p-watch').innerHTML=`<div class="lead">高信心分但還沒觸發(蓄勢 / 相對強度剛轉強),放口袋盯(${w.length} 檔)。</div>
    <div class="tbl-wrap"><table class="t"><thead><tr>
      <th>#</th><th>代號</th><th>名稱</th><th>產業</th><th class="r">收盤</th><th class="r">漲跌%</th><th class="r">20日%</th><th>型態</th><th class="r">信心</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- 自選池 ---------- */
function renderWatchlist(){
  const w=DATA.watchlist||[];
  if(!w.length){$('#p-watchlist').innerHTML='<div class="empty">自選池是空的,請編輯 config/watchlist.json</div>';return;}
  $('#p-watchlist').innerHTML=w.map(s=>{
    const tags=(s.hits||[]).map(h=>`<span class="chip-tag">${lbl(h)}</span>`).join('');
    const combos=(s.combos||[]).map(c=>`<span class="chip-tag chip-combo">${c}</span>`).join('');
    const news=(s.news||[]).slice(0,3).map(n=>`<li style="margin:3px 0"><a href="${n.link}" target="_blank">${n.title}</a></li>`).join('');
    return `<div class="ccard">
      <div class="top">
        <div><div class="tkr">🔔 ${s.stock_id}<span class="nm">${s.name}</span> ${s.profile?badge(s.profile):''}</div>
          ${s.note?`<div class="meta">備註:${s.note}</div>`:''}
          <div class="meta">收 <b class="num">${num(s.close)}</b> <span class="${cls(s.change_pct)} num">(${fmt(s.change_pct)}%)</span> · ${s.industry||''}</div>
        </div>
        ${s.score!==undefined?`<div class="score"><div class="v" style="color:var(--accent-ink)">${s.score}</div><div class="l">信心分</div></div>`:''}
      </div>
      ${(combos||tags)?`<div style="margin-top:9px">${combos}${tags}</div>`:''}
      ${news?`<ul style="margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)">${news}</ul>`:''}
    </div>`;
  }).join('');
}

/* ---------- 績效 ---------- */
let LED=[],sortKey='ret_pct',sortDir=-1,fStatus='all',fProfile='all',fDate='all',q='';
function renderPerf(){
  const p=DATA.performance||{};
  const o=p.overall||{},es=p.exit_sim||{},bh=p.by_horizon||{};
  const hname={1:'隔日',3:'3日',5:'5日',10:'10日',20:'20日',30:'30日'};
  let stats='<div class="stats">';
  if(o.win_rate!=null)stats+=`<div class="stat"><div class="v">${o.win_rate}%</div><div class="l">勝率(最新報酬)<br>總 ${o.total} · <span class="up">賺 ${o.win}</span> · <span class="down">賠 ${o.loss}</span></div></div>`;
  if(es.closed){
    stats+=`<div class="stat"><div class="v">${es.win_rate}%</div><div class="l">已實現勝率 · 平均 <span class="${cls(es.avg_ret)}">${fmt(es.avg_ret)}%</span> · 持有 ${es.avg_hold_days}日<br><span style="color:var(--muted-2)">隔日開盤進場 · 開高&gt;${es.max_chase}%棄單 · 停損-${es.hard_stop}%/TP1=${es.r_multiple}R</span></div></div>`;
    const rs=Object.entries(es.reasons||{}).map(([k,v])=>`${k} ${v}%`).join(' · ');
    stats+=`<div class="stat"><div class="v" style="font-size:15px;font-weight:700">${rs||'—'}</div><div class="l">出場原因 · 持有中 ${es.open} · 跳空棄單 ${es.skipped_gap||0} · 待進場 ${es.pending||0}</div></div>`;
  }
  stats+='</div>';

  let htab='';
  const hs=(p.horizons||[]).filter(h=>bh[h]);
  if(hs.length){
    htab=`<div class="sec-h">各天期平均報酬 + 期間最高漲幅</div><div class="tbl-wrap"><table class="t"><thead><tr>
      <th>進場後</th><th class="r">樣本</th><th class="r">勝率</th><th class="r">平均報酬</th><th class="r">平均最高漲幅</th></tr></thead><tbody>`
      +hs.map(h=>{const s=bh[h];return `<tr><td class="tk">${hname[h]||h}</td><td class="r num">${s.n}</td><td class="r num">${s.win_rate}%</td>
      <td class="r num ${cls(s.avg_ret)}">${fmt(s.avg_ret)}%</td><td class="r num" style="color:var(--warn)">${s.avg_maxgain!=null?fmt(s.avg_maxgain)+'%':'-'}</td></tr>`;}).join('')
      +`</tbody></table></div>`;
  }

  LED=p.ledger||[];
  const dates=[...new Set(LED.map(r=>r.date))].sort().reverse();
  const dateOpts=`<option value="all">全部選股日</option>`+dates.map(d=>`<option value="${d}"${fDate===d?' selected':''}>${d}</option>`).join('');
  const ledArea=LED.length?`
    <div class="sec-h">追蹤台帳 — 仍追蹤 ${p.ledger_total} 檔</div>
    <div class="filters">
      ${['all:全部','win:獲利','loss:虧損','止損:止損','移動停利:移動停利','持有中:持有中'].map(x=>{const[k,t]=x.split(':');return `<span class="fchip ${fStatus===k?'on':''}" data-st="${k}">${t}</span>`;}).join('')}
      <span class="sep"></span>
      ${['all:全部型態','動能:動能','品質:品質','均衡:均衡'].map(x=>{const[k,t]=x.split(':');return `<span class="fchip ${fProfile===k?'on':''}" data-pf="${k}">${t}</span>`;}).join('')}
      <span class="sep"></span>
      <select class="sel" id="fdate">${dateOpts}</select>
      <input class="search" id="q" placeholder="搜尋代號 / 名稱" value="${q}">
    </div>
    <div id="ledtable"></div>`
    :`<div class="empty">績效資料累積中 — 選股需經過至少 1 個交易日才有後續報酬,系統每天自動更新。</div>`;

  $('#p-perf').innerHTML=`<div class="lead">每天自動更新過去所有核心選股後續走勢(以每日收盤計)。共追蹤 ${p.total_tracked||0} 檔。</div>`+stats+htab+ledArea;

  if(LED.length){
    $('#p-perf').querySelectorAll('[data-st]').forEach(c=>c.onclick=()=>{fStatus=c.dataset.st;renderPerf();});
    $('#p-perf').querySelectorAll('[data-pf]').forEach(c=>c.onclick=()=>{fProfile=c.dataset.pf;renderPerf();});
    $('#fdate').onchange=e=>{fDate=e.target.value;drawLedger();};
    const qi=$('#q');qi.oninput=()=>{q=qi.value;drawLedger();qi.focus();};
    drawLedger();
  }
}
function drawLedger(){
  let rows=LED.slice();
  if(fStatus==='win')rows=rows.filter(r=>r.ret_pct>0);
  else if(fStatus==='loss')rows=rows.filter(r=>r.ret_pct<0);
  else if(['止損','移動停利','均線停損','到期','持有中'].includes(fStatus))rows=rows.filter(r=>r.exit_reason===fStatus);
  if(fProfile!=='all')rows=rows.filter(r=>r.profile===fProfile);
  if(fDate!=='all')rows=rows.filter(r=>r.date===fDate);
  if(q.trim()){const s=q.trim();rows=rows.filter(r=>String(r.stock_id).includes(s)||(r.name||'').includes(s));}
  rows.sort((a,b)=>{const x=a[sortKey],y=b[sortKey];if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*sortDir;});
  const arrow=k=>sortKey===k?(sortDir<0?' ↓':' ↑'):'';
  const cols=[
    {k:'date',t:'選股日',f:r=>`<span style="color:var(--muted)">${r.date}</span>`},
    {k:'stock_id',t:'代號',f:r=>`<span class="tk">${r.stock_id}</span>`},
    {k:'name',t:'名稱',f:r=>r.name},
    {k:'profile',t:'型態',f:r=>badge(r.profile)},
    {k:'entry',t:'成本',r:1,f:r=>`<span class="num">${num(r.entry)}</span>`},
    {k:'latest_close',t:'最新',r:1,f:r=>`<span class="num">${num(r.latest_close)}</span>`},
    {k:'days',t:'天',r:1,f:r=>`<span class="num" style="color:var(--muted-2)">${r.days}</span>`},
    {k:'ret_pct',t:'報酬率',r:1,f:r=>`<span class="num ${cls(r.ret_pct)}" style="font-weight:700">${fmt(r.ret_pct)}%</span>`},
    {k:'peak_gain_pct',t:'最高漲幅',r:1,f:r=>`<span class="num" style="color:var(--warn)">${r.peak_gain_pct!=null?fmt(r.peak_gain_pct)+'%':'-'}</span>`},
    {k:'exit_reason',t:'模擬出場',f:r=>r.exit_reason?`${r.exit_reason}${r.exit_ret_pct!=null?` <span class="num ${cls(r.exit_ret_pct)}">${fmt(r.exit_ret_pct)}%</span>`:''}`:'-'},
  ];
  const head=cols.map(c=>`<th class="${c.r?'r':''}" data-k="${c.k}">${c.t}${arrow(c.k)}</th>`).join('');
  const body=rows.map(r=>'<tr>'+cols.map(c=>`<td class="${c.r?'r':''}">${c.f(r)}</td>`).join('')+'</tr>').join('');
  $('#ledtable').innerHTML=`<div class="tbl-wrap"><table class="t"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="hint">顯示 ${rows.length} 檔 · 點欄位標題可排序</div>`;
  $('#ledtable').querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1;}drawLedger();});
}

/* ---------- 盤中即時 ---------- */
function gateBox(g){
  if(!g) return '';
  const lab=g.label||'—';
  const klass=lab==='risk-on'?'gate-on':lab==='risk-off'?'gate-off':'gate-neu';
  const col=lab==='risk-on'?'var(--up)':lab==='risk-off'?'var(--down)':'var(--muted)';
  const seg=[];
  if(g.sox)seg.push(`費半 SOX <span class="num ${cls(g.sox.pct)}">${fmt(g.sox.pct)}%</span>`);
  if(g.nasdaq)seg.push(`NASDAQ期 <span class="num ${cls(g.nasdaq.pct)}">${fmt(g.nasdaq.pct)}%</span>`);
  if(g.sp500)seg.push(`S&P期 <span class="num ${cls(g.sp500.pct)}">${fmt(g.sp500.pct)}%</span>`);
  if(g.vix)seg.push(`VIX <span class="num">${num(g.vix.last,1)}</span>`);
  return `<div class="gate ${klass}"><b style="color:${col};font-size:14px">大盤盤前閘門:${lab}</b><div class="mx">${seg.join(' · ')}</div></div>`;
}
function liveCard(r){
  const sc=r.scenario, k=(sc==='A'||sc==='B'||sc==='C')?sc:'skip';
  const col=sc==='A'?'var(--up)':sc==='B'?'var(--warn)':sc==='C'?'var(--down)':'var(--muted)';
  const p=r.plan||{};
  const price=r.price!=null
    ? `盤前估 <b class="num">${num(r.price)}</b>${r.src?` <span style="color:var(--muted-2)">(${r.src})</span>`:''}${r.gap_pct!=null?` · 對昨收 <span class="num ${cls(r.gap_pct)}">${fmt(r.gap_pct)}%</span>`:''}`
    : '<span style="color:var(--muted-2)">盤前無報價</span>';
  const adr=r.adr?` · ADR ${r.adr.ticker} <span class="num ${cls(r.adr.pct)}">${fmt(r.adr.pct)}%</span>`:'';
  return `<div class="lcard ${k}">
    <div class="lt"><div class="tkr" style="font-size:15px">${r.stock_id}<span class="nm2">${r.name||''}</span> ${r.profile?badge(r.profile):''}</div>
      <div class="scen" style="color:${col}">${r.scenario_label||''}</div></div>
    <div class="lvl">${price}${r.score!=null?` · 信心 <b style="color:var(--accent-ink)">${r.score}</b>`:''}${adr}</div>
    <div class="act">👉 ${r.action||''}</div>
    ${p.init_stop!=null?`<div class="lvl">停損 <span class="down">${num(p.init_stop)}</span> · TP1 <span class="up">${num(p.tp1)}</span> · 進場上限 <b>${num(p.max_entry)}</b></div>`:''}
  </div>`;
}
function orbCard(r){
  const st=r.status, p=r.plan||{};
  const k=st==='breakout'?'A':st==='pending'?'B':st==='below_orl'?'C':'skip';
  let body;
  if(st==='breakout'){const b=r.breakout||{};
    body=`<b style="color:var(--up)">✅ 已突破開盤區間高 ${num(r.orh)} 於 ${b.time}(收 ${num(b.price)}、量 ${b.vol}) → 可進</b>`
      +(p.init_stop!=null?`<div class="lvl">停損 <span class="down">${num(p.init_stop)}</span> · TP1 <span class="up">${num(p.tp1)}</span>(以實際成交價重算)</div>`:'');
  } else if(st==='pending') body=`<span style="color:var(--warn)">⏸ 尚未突破</span> · 區間 ${num(r.orl)}~${num(r.orh)} · 現價 <b class="num">${num(r.last)}</b>`;
  else if(st==='below_orl') body=`<span style="color:var(--down)">❌ 跌破開盤區間低 ${num(r.orl)}</span>(現價 ${num(r.last)})→ 今日略過`;
  else body=`<span style="color:var(--muted-2)">1 分K 未到(yfinance 未供或休市)→ 自行確認</span>`;
  return `<div class="lcard ${k}"><div class="lt"><div class="tkr" style="font-size:15px">${r.stock_id}<span class="nm2">${r.name||''}</span> ${r.profile?badge(r.profile):''}</div>${r.score!=null?`<div class="scen" style="color:var(--accent-ink)">信心 ${r.score}</div>`:''}</div><div class="act">${body}</div></div>`;
}
function renderLive(){
  fetch('./premarket.json?'+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json();}).then(d=>{
    const po=d.preopen,orb=d.orb;
    const upd=[po&&po.generated_at,orb&&orb.generated_at].filter(Boolean).sort().pop()||'';
    let h=`<div class="live-head"><div class="live-upd">選股基準日 ${d.date||'—'} · 最後更新 ${upd||'—'} · 每 60 秒自動檢查</div><button class="refresh" id="lrefresh">↻ 重新整理</button></div>`;
    h+=`<div class="note-box">盤前 08:45 自動分類、開盤後 09:25 自動判突破。掛<b>限價單</b>、別市價追。本頁非逐秒即時,於上述時點(與你手動觸發)更新。</div>`;
    if(po){h+=gateBox(po.gate);h+=`<div class="sec-h2">盤前分類 — 有效 ${po.valid_count}/${po.total} 檔</div>`;
      h+=(po.rows||[]).map(liveCard).join('')||'<div class="empty">無資料</div>';}
    if(orb){h+=`<div class="sec-h2">開盤 15 分 ORB — 已突破 ${orb.fired_count} 檔</div>`;
      h+=(orb.rows||[]).map(orbCard).join('')||'<div class="empty">無資料</div>';}
    if(!po&&!orb)h+='<div class="empty">今日盤中資料尚未產生。</div>';
    $('#p-live').innerHTML=h;
    const rb=$('#lrefresh');if(rb)rb.onclick=renderLive;
  }).catch(()=>{$('#p-live').innerHTML='<div class="empty">盤中即時資料尚未產生。系統於每交易日 08:45(盤前分類)與 09:25(開盤15分突破)自動更新;需先有當日盤後核心選股。</div>';});
}
let liveTimer=null;
function startLivePoll(){stopLivePoll();renderLive();liveTimer=setInterval(renderLive,60000);}
function stopLivePoll(){if(liveTimer){clearInterval(liveTimer);liveTimer=null;}}

/* ---------- tabs / 載入 ---------- */
function tabSwitch(p){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.p===p));
  document.querySelectorAll('.panel').forEach(pl=>pl.classList.toggle('active',pl.id==='p-'+p));
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  tabSwitch(t.dataset.p);
  if(t.dataset.p==='live')startLivePoll();else stopLivePoll();
});

function loadDay(dt){
  if(!LATEST)return;
  if(dt===LATEST.date){DATA=LATEST;LABEL=LATEST.label||{};setSub();renderCore();renderWatch();renderWatchlist();return;}
  fetch('./history/'+dt+'.json?'+Date.now()).then(r=>r.json()).then(h=>{
    DATA=Object.assign({},LATEST,{date:h.date,core:h.core||[],watch:h.watch||[],watchlist:h.watchlist||[],index_below_ma20:h.index_below_ma20,scored_count:h.scored_count});
    LABEL=DATA.label||{};setSub();renderCore();renderWatch();renderWatchlist();
  }).catch(e=>{$('#p-core').innerHTML=`<div class="err">讀取 ${dt} 失敗:${e}</div>`;});
}
fetch('./data.json?'+Date.now()).then(r=>r.json()).then(d=>{
  LATEST=d;DATA=d;LABEL=d.label||{};
  setSub();renderCore();renderWatch();renderWatchlist();renderPerf();renderLive();
  fetch('./dates.json?'+Date.now()).then(r=>r.json()).then(dates=>{
    if(!dates||dates.length<2)return;
    const sel=document.createElement('select');sel.className='sel';
    dates.slice().reverse().forEach(dt=>{const o=document.createElement('option');o.value=dt;o.textContent=dt+(dt===LATEST.date?' (最新)':'');sel.appendChild(o);});
    sel.value=LATEST.date;sel.onchange=()=>loadDay(sel.value);
    const bar=$('#datebar');bar.innerHTML='<span>看哪一天的選股:</span>';bar.appendChild(sel);
    bar.insertAdjacentHTML('beforeend','<span style="color:var(--muted-2)">(績效分頁可在台帳內依選股日篩選)</span>');
  }).catch(()=>{});
}).catch(e=>{$('#sub').innerHTML='';$('#p-core').innerHTML=`<div class="err">讀取 data.json 失敗:${e}。請先讓 GitHub Actions 跑一次產生 docs/data.json。</div>`;});
</script>
</body>
