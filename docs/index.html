<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>台股短線選股 · 交易終端</title>
<style>
  /* ============================================================
     DESIGN TOKENS — light (default) + dark
     "trading terminal" : 中性深藍灰 + 靛色強調 ; 漲綠 / 跌紅
     ============================================================ */
  :root{
    /* surfaces */
    --bg:#f4f6f9; --bg-grad-1:#eef1f6; --bg-grad-2:#f6f8fb;
    --surface:#ffffff; --surface-2:#fafbfd; --surface-3:#f1f4f8;
    --line:#e6eaf0; --line-soft:#eef1f5; --line-strong:#d4dae3;
    /* ink */
    --ink:#0d1424; --ink-2:#3a4658; --muted:#69748a; --muted-2:#9aa4b6;
    /* brand / accent (靛 indigo) */
    --accent:#5b63f5; --accent-2:#7c83ff; --accent-ink:#4a52e6; --accent-bg:#eef0ff; --accent-line:#dfe2ff;
    /* up / down semantics */
    --up:#0f9d58; --up-ink:#0b7a44; --up-bg:#e7f7ee; --up-line:#bfe9cf;
    --down:#e0383e; --down-ink:#c42a30; --down-bg:#fdeced; --down-line:#f7cdcf;
    --flat:#8a93a4;
    --warn:#d98a17; --warn-ink:#b3700f; --warn-bg:#fdf4e3; --warn-line:#f3dcae;
    /* profile chips */
    --mom:#e0383e; --mom-bg:#fdeced; --qual:#2a6df0; --qual-bg:#e9f1ff; --bal:#69748a; --bal-bg:#eef1f5;
    /* effects */
    --shadow-sm:0 1px 2px rgba(13,20,36,.05);
    --shadow:0 1px 2px rgba(13,20,36,.04), 0 6px 20px rgba(13,20,36,.07);
    --shadow-lg:0 4px 12px rgba(13,20,36,.06), 0 18px 44px rgba(13,20,36,.12);
    --ring:0 0 0 3px var(--accent-bg);
    --radius:16px; --radius-sm:11px; --radius-xs:8px;
    --mono:'SFMono-Regular',ui-monospace,'JetBrains Mono','Menlo','Consolas',monospace;
  }
  [data-theme="dark"]{
    --bg:#0a0e17; --bg-grad-1:#0c121e; --bg-grad-2:#0a0e17;
    --surface:#121826; --surface-2:#161d2e; --surface-3:#1c2436;
    --line:#263043; --line-soft:#1d2638; --line-strong:#33405a;
    --ink:#eef2f8; --ink-2:#c2ccdc; --muted:#8a96ab; --muted-2:#5d687d;
    --accent:#7c83ff; --accent-2:#9aa0ff; --accent-ink:#a6abff; --accent-bg:#1c2140; --accent-line:#2c3460;
    --up:#34d27e; --up-ink:#5bdd97; --up-bg:#10271b; --up-line:#1d4632;
    --down:#ff5c63; --down-ink:#ff7b81; --down-bg:#2a1316; --down-line:#4a2024;
    --flat:#7a8499;
    --warn:#f0b048; --warn-ink:#f5c373; --warn-bg:#2a2010; --warn-line:#4a3a18;
    --mom:#ff5c63; --mom-bg:#2a1316; --qual:#5b9dff; --qual-bg:#13213a; --bal:#8a96ab; --bal-bg:#1c2436;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.45);
    --shadow-lg:0 6px 18px rgba(0,0,0,.4), 0 24px 60px rgba(0,0,0,.6);
    --ring:0 0 0 3px var(--accent-bg);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
  body{margin:0;color:var(--ink);
    background:
      radial-gradient(1200px 600px at 100% -5%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%),
      linear-gradient(180deg,var(--bg-grad-1),var(--bg-grad-2));
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif;
    font-feature-settings:"tnum" 1;line-height:1.5;-webkit-font-smoothing:antialiased;
    transition:background-color .3s ease,color .3s ease;}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 72px;}
  .num{font-variant-numeric:tabular-nums;font-family:var(--mono);letter-spacing:-.01em;}
  .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--flat);}
  a{color:var(--accent-ink);text-decoration:none;} a:hover{text-decoration:underline;}
  ::selection{background:var(--accent-bg);color:var(--accent-ink);}

  /* ---------- Header ---------- */
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{width:42px;height:42px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(140deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent);}
  .logo svg{width:24px;height:24px;}
  .title{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
  .title .tg{color:var(--muted);font-weight:600;font-size:13px;display:block;letter-spacing:.02em;margin-top:3px;}
  .sub{color:var(--muted);font-size:13px;margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;}
  .sub .dot{width:3px;height:3px;border-radius:50%;background:var(--muted-2);}

  /* theme toggle */
  .tgl{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-2);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600;
    box-shadow:var(--shadow-sm);transition:all .18s ease;}
  .tgl:hover{border-color:var(--line-strong);transform:translateY(-1px);box-shadow:var(--shadow);}
  .tgl svg{width:16px;height:16px;}
  .tgl .ico-sun{display:none;} [data-theme="dark"] .tgl .ico-sun{display:block;}
  [data-theme="dark"] .tgl .ico-moon{display:none;}

  .pill-mkt{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid transparent;}
  .pill-mkt .pdot{width:6px;height:6px;border-radius:50%;}
  .mkt-up{background:var(--up-bg);color:var(--up-ink);border-color:var(--up-line);}
  .mkt-up .pdot{background:var(--up);}
  .mkt-dn{background:var(--down-bg);color:var(--down-ink);border-color:var(--down-line);}
  .mkt-dn .pdot{background:var(--down);}
  .tag-hist{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;}
  .tag-latest{display:inline-block;background:var(--accent-bg);color:var(--accent-ink);border:1px solid var(--accent-line);padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:800;margin-left:6px;vertical-align:middle;letter-spacing:.02em;}

  /* visible keyboard focus everywhere (a11y) */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
  .tab:focus-visible{outline-offset:-2px;}

  .datebar{margin-top:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13px;color:var(--muted);}

  /* ---------- Tabs ---------- */
  .tabs{display:inline-flex;gap:3px;background:var(--surface-3);padding:4px;border-radius:14px;margin:20px 0 24px;
    flex-wrap:wrap;border:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .tab{padding:8px 15px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;
    border:none;background:transparent;transition:all .18s cubic-bezier(.4,0,.2,1);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
  .tab:hover{color:var(--ink-2);}
  .tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
  .tab .tdot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}

  .panel{display:none;animation:fade .28s cubic-bezier(.2,.8,.2,1);}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

  .lead{color:var(--muted);font-size:13px;margin-bottom:14px;line-height:1.6;}
  .lead b{color:var(--ink-2);}

  /* ---------- Section heading ---------- */
  .sec-h{font-size:13.5px;font-weight:700;letter-spacing:.01em;margin:24px 0 12px;color:var(--ink);
    display:flex;align-items:center;gap:8px;}
  .sec-h .bar{width:3px;height:14px;border-radius:2px;background:var(--accent);}
  .sec-h .cnt{color:var(--muted-2);font-weight:600;font-size:12px;}
  .sec-h2{font-size:13px;font-weight:700;margin:20px 0 11px;color:var(--ink);display:flex;align-items:center;gap:7px;}

  /* ---------- Generic card ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px;}

  /* ============================================================
     DASHBOARD
     ============================================================ */
  .dash-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:6px;}
  .gcol-3{grid-column:span 3;} .gcol-4{grid-column:span 4;} .gcol-6{grid-column:span 6;}
  .gcol-8{grid-column:span 8;} .gcol-12{grid-column:span 12;}

  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease;}
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
  .kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent);opacity:.85;}
  .kpi.k-up::after{background:var(--up);} .kpi.k-down::after{background:var(--down);} .kpi.k-warn::after{background:var(--warn);}
  .kpi .kl{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:6px;}
  .kpi .kl svg{width:14px;height:14px;opacity:.7;}
  .kpi .kv{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:7px;line-height:1;}
  .kpi .kv small{font-size:14px;font-weight:700;color:var(--muted);margin-left:2px;}
  .kpi .ks{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5;}

  .panelcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px 20px;height:100%;}
  .pc-h{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;}
  .pc-h .lk{font-size:12px;font-weight:600;color:var(--accent-ink);cursor:pointer;}
  .pc-h .lk:hover{text-decoration:underline;}

  /* 持倉多帳戶切換列 */
  .acc-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .acc-bar .acc-lb{font-size:11px;font-weight:800;color:var(--muted-2);letter-spacing:.06em;margin-right:2px;}
  .acc-t{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:999px;
    padding:4px 11px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .acc-t:hover{border-color:var(--accent-line);color:var(--ink-2);}
  .acc-t.on{background:var(--accent-bg);color:var(--accent-ink);border-color:var(--accent-line);}
  .acc-t .acc-n{font-size:10.5px;font-weight:800;opacity:.7;background:var(--surface);border-radius:999px;padding:0 5px;}
  .acc-x{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:8px;
    padding:3px 8px;font-size:12px;cursor:pointer;line-height:1.5;}
  .acc-x:hover{border-color:var(--accent-line);color:var(--ink-2);}

  /* 我的實戰紀錄(買/跳標記 + 三組對照) */
  .mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .mp-c{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;}
  .mp-c.mp-hi{border-color:var(--accent-line);background:var(--accent-bg);}
  .mp-c .mp-t{font-size:11.5px;color:var(--muted);font-weight:700;}
  .mp-c .mp-v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:5px;line-height:1;}
  .mp-c .mp-s{font-size:10.5px;color:var(--muted-2);margin-top:5px;}
  .mp-verdict{margin-top:11px;font-size:12.5px;line-height:1.6;padding:9px 12px;border-radius:9px;}
  .mp-verdict.up{background:var(--up-bg);color:var(--up-ink);border:1px solid var(--up-line);}
  .mp-verdict.down{background:var(--down-bg);color:var(--down-ink);border:1px solid var(--down-line);}
  .mp-verdict.neu{background:var(--surface-3);color:var(--muted);border:1px solid var(--line);}
  .mp-btns{display:inline-flex;gap:3px;}
  .mp-card{display:flex;gap:4px;margin-top:7px;justify-content:flex-end;}
  .mp-card .mp-b{padding:3px 9px;font-size:11.5px;}
  .mp-b{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);
    border-radius:6px;font-size:11px;font-weight:700;padding:2px 7px;cursor:pointer;line-height:1.5;}
  .mp-b:hover{border-color:var(--accent-line);color:var(--ink-2);}
  .mp-b.on-b{background:var(--up-bg);color:var(--up-ink);border-color:var(--up-line);}
  .mp-b.on-s{background:var(--surface-3);color:var(--ink-2);border-color:var(--muted-2);}
  @media(max-width:640px){.mp-grid{grid-template-columns:1fr;}}

  /* 台帳未出場部位的即時損益(2026-07-21)。綠點 = 這一列的價格是即時報價,
     不是批次收盤 —— 不標的話使用者分不出哪些數字是活的。 */
  .led-live{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:12px;}
  .led-live .ll-h{font-size:12.5px;font-weight:800;color:var(--ink-2);display:flex;
    align-items:center;gap:7px;flex-wrap:wrap;}
  .led-live .ll-src{font-size:10.5px;font-weight:600;color:var(--muted-2);}
  .led-live .ll-g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:9px;}
  .led-live .ll-g>div{display:flex;flex-direction:column;gap:3px;}
  .led-live .ll-g b{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1;}
  .led-live .ll-g i{font-size:10.5px;color:var(--muted-2);font-style:normal;}
  .led-live .ll-n{font-size:10.5px;color:var(--muted-2);margin-top:9px;line-height:1.55;}
  .led-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up);
    margin-left:5px;vertical-align:middle;animation:ledpulse 2.4s ease-in-out infinite;}
  @keyframes ledpulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media(prefers-reduced-motion:reduce){.led-dot{animation:none}}
  @media(max-width:640px){.led-live .ll-g{grid-template-columns:1fr 1fr;}}

  /* 盤中大盤即時條(2026-07-21)。左緣色帶用「上漲家數占比」而非指數漲跌 ——
     權值股拉指數但多數股票在跌是很常見的陷阱。 */
  .pulse{border:1px solid var(--line);border-left:3px solid var(--muted-2);
    background:var(--surface-2);border-radius:10px;padding:12px 15px;margin-bottom:14px;}
  .pulse.on{border-left-color:var(--up);}
  .pulse.off{border-left-color:var(--down);}
  .pl-top{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;}
  .pl-i{display:flex;align-items:baseline;gap:7px;}
  .pl-i .pl-n{font-size:11.5px;color:var(--muted);font-weight:700;}
  .pl-i b{font-size:19px;font-weight:800;letter-spacing:-.02em;}
  .pl-t{margin-left:auto;font-size:10.5px;color:var(--muted-2);}
  .pl-b{display:flex;gap:18px;align-items:center;margin-top:11px;flex-wrap:wrap;}
  .pl-w{flex:1 1 220px;min-width:200px;}
  .pl-lab{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
    font-size:11.5px;color:var(--muted);}
  .pl-lab>b{font-size:13px;color:var(--ink-2);}
  .pl-bar{height:6px;border-radius:3px;background:var(--down);margin-top:6px;overflow:hidden;}
  .pl-bar>i{display:block;height:100%;background:var(--up);}
  .pl-k{display:flex;gap:16px;}
  .pl-k>div{display:flex;flex-direction:column;gap:2px;}
  .pl-k b{font-size:15px;font-weight:800;line-height:1;}
  .pl-k i{font-size:10px;color:var(--muted-2);font-style:normal;}
  .pl-n2{font-size:10.5px;color:var(--muted-2);margin-top:9px;line-height:1.55;}
  @media(max-width:640px){.pl-k{width:100%;justify-content:space-between;gap:8px;}}

  /* 技術訊號標籤(2026-07-23)。▲多 ▼空 ◆中性觀察;hover 看規則細節。
     色帶語意與全站一致:紅漲綠跌是行情數字,標籤用底色+描邊區分不搶版面。 */
  .tc-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:7px;}
  .tc-lab{font-size:10px;color:var(--muted-2);font-weight:700;margin-right:2px;}
  .tc{font-size:10.5px;font-weight:700;padding:1.5px 7px;border-radius:999px;line-height:1.5;
    border:1px solid transparent;cursor:default;}
  .tc-bull{background:var(--up-bg);color:var(--up-ink);border-color:var(--up-line);}
  .tc-bear{background:var(--down-bg);color:var(--down-ink);border-color:var(--down-line);}
  .tc-warn{background:var(--surface-3);color:var(--muted);border-color:var(--line);}

  /* market regime hero */
  .regime{display:flex;align-items:center;gap:16px;}
  .regime .ring{width:74px;height:74px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;position:relative;}
  .regime .ring svg{width:74px;height:74px;transform:rotate(-90deg);}
  .regime .rlabel{position:absolute;font-size:11px;font-weight:800;letter-spacing:.02em;}
  .regime .rtext .rt{font-size:18px;font-weight:800;letter-spacing:-.01em;}
  .regime .rtext .rd{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;}

  /* top picks list */
  .pick{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
  .pick:last-child{border-bottom:none;}
  .pick .rk{width:22px;height:22px;flex:0 0 auto;border-radius:7px;background:var(--surface-3);color:var(--muted);
    font-size:11.5px;font-weight:800;display:grid;place-items:center;}
  .pick:nth-child(1) .rk{background:var(--accent-bg);color:var(--accent-ink);}
  .pick .pinfo{flex:1;min-width:0;}
  .pick .pn{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .pick .pn .id{color:var(--ink);} .pick .pn .nm{color:var(--ink-2);font-weight:600;font-size:12.5px;}
  .pick .pmeta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .pick .pscore{text-align:right;flex:0 0 auto;}
  .pick .pscore .v{font-size:16px;font-weight:800;color:var(--accent-ink);}
  .pick .pscore .b{font-size:10.5px;color:var(--up);font-weight:700;}

  /* distribution mini bars */
  .dist{display:flex;flex-direction:column;gap:9px;}
  .dist .row{display:flex;align-items:center;gap:10px;font-size:12px;}
  .dist .row .lab{width:62px;flex:0 0 auto;color:var(--muted);font-weight:600;}
  .dist .row .track{flex:1;height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden;}
  .dist .row .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .dist .row .val{width:30px;text-align:right;flex:0 0 auto;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;}

  /* horizon mini grid */
  .hmini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .hmini .hc{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius-xs);padding:10px 8px;text-align:center;}
  .hmini .hc .ht{font-size:11px;color:var(--muted);font-weight:600;}
  .hmini .hc .hv{font-size:16px;font-weight:800;margin-top:4px;letter-spacing:-.01em;}
  .hmini .hc .hw{font-size:10.5px;color:var(--muted-2);margin-top:2px;}

  /* live preview strip */
  .gatestrip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .gatebadge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:800;border:1px solid transparent;}
  .gatebadge .gd{width:7px;height:7px;border-radius:50%;}
  .g-on{background:var(--up-bg);color:var(--up-ink);border-color:var(--up-line);} .g-on .gd{background:var(--up);}
  .g-off{background:var(--down-bg);color:var(--down-ink);border-color:var(--down-line);} .g-off .gd{background:var(--down);}
  .g-neu{background:var(--surface-3);color:var(--muted);border-color:var(--line);} .g-neu .gd{background:var(--muted-2);}
  .gmetrics{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);}
  .gmetrics b{color:var(--ink-2);font-weight:700;}

  /* ============================================================
     CORE cards
     ============================================================ */
  .ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:17px 19px;margin-bottom:14px;transition:box-shadow .22s ease,transform .22s ease,border-color .22s ease;}
  .ccard:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--line-strong);}
  .ccard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .tkr{font-size:16.5px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .tkr .rank{color:var(--muted-2);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;}
  .tkr .nm{color:var(--ink-2);font-weight:600;font-size:14px;}
  .score{text-align:right;line-height:1;flex:0 0 auto;}
  .score .v{font-size:25px;font-weight:800;letter-spacing:-.02em;color:var(--accent-ink);font-variant-numeric:tabular-nums;}
  .score .l{font-size:10px;color:var(--muted-2);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}
  .score .chipb{display:inline-block;margin-top:5px;background:var(--up-bg);color:var(--up-ink);border:1px solid var(--up-line);
    padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:800;}
  .meta{color:var(--muted);font-size:13px;margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;}
  .meta .mdot{width:3px;height:3px;border-radius:50%;background:var(--muted-2);}
  .meta b{color:var(--ink-2);font-weight:700;}
  .trig{color:var(--up-ink);font-weight:700;background:var(--up-bg);border:1px solid var(--up-line);padding:1px 8px;border-radius:6px;font-size:12px;}

  .kbars{margin-top:10px;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line-soft);padding:6px 4px 4px;}
  .kbars svg{display:block;width:100%;height:64px;}
  .kbars .kfoot{font-size:10.5px;color:var(--muted-2);text-align:right;padding:2px 6px 0;}

  .bars{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .bar{font-size:11px;color:var(--muted);background:var(--surface-3);padding:4px 9px;border-radius:8px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;}
  .bar .mb{width:34px;height:4px;border-radius:999px;background:var(--line-strong);overflow:hidden;}
  .bar .mb i{display:block;height:100%;background:var(--accent);border-radius:999px;}
  .bar b{color:var(--ink-2);font-weight:800;font-variant-numeric:tabular-nums;}

  /* badge / chips */
  .badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:7px;font-size:11px;font-weight:800;letter-spacing:.02em;vertical-align:middle;border:1px solid transparent;}
  .b-mom{background:var(--mom-bg);color:var(--mom);} .b-qual{background:var(--qual-bg);color:var(--qual);} .b-bal{background:var(--bal-bg);color:var(--bal);}
  .chip-tag{display:inline-flex;align-items:center;background:var(--accent-bg);color:var(--accent-ink);border:1px solid var(--accent-line);
    padding:2px 9px;border-radius:7px;font-size:11.5px;font-weight:600;margin:2px 4px 2px 0;}
  .chip-combo{background:var(--up-bg);color:var(--up-ink);border-color:var(--up-line);}

  /* plan box */
  .plan{margin-top:13px;background:linear-gradient(180deg,var(--surface-2),var(--surface-3));
    border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;}
  .plan .ph{font-weight:800;font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:7px;}
  .plan .ph .ref{color:var(--muted);font-weight:600;font-size:11.5px;}
  .plan table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;}
  .plan td{padding:6px 6px;vertical-align:top;color:var(--ink-2);}
  .plan tr+tr td{border-top:1px solid var(--line-soft);}
  .plan td:first-child{white-space:nowrap;width:1%;}
  .scn{font-weight:800;font-size:12px;display:inline-flex;align-items:center;gap:5px;}
  .scn small{display:block;color:var(--muted);font-weight:600;font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums;}
  .scn .dt{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .plan .foot{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line-strong);font-size:12px;color:var(--ink-2);line-height:1.6;}
  .plan .foot .tiny{color:var(--muted);font-size:11px;margin-top:4px;display:block;}

  .row-meta{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.6;}
  .row-meta b{color:var(--ink-2);font-weight:700;}
  .row-meta .ml{color:var(--muted-2);font-weight:600;margin-right:3px;}

  /* ---------- Stats (perf) ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px;margin-bottom:18px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px 19px;position:relative;overflow:hidden;}
  .stat::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent);opacity:.8;}
  .stat .v{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;}
  .stat .l{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.55;}
  .stat .l b{color:var(--ink-2);}

  /* ---------- Table ---------- */
  .tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
  .tbl-wrap::-webkit-scrollbar{height:7px;} .tbl-wrap::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
  table.t{width:100%;border-collapse:collapse;font-size:13px;}
  table.t th{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.01em;text-align:left;
    padding:13px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;
    position:sticky;top:0;transition:color .15s;}
  table.t th:hover{color:var(--ink);}
  table.t th.r{text-align:right;} table.t td.r{text-align:right;}
  table.t td{padding:12px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap;color:var(--ink-2);}
  table.t tbody tr{transition:background .14s ease;}
  table.t tbody tr:hover td{background:var(--surface-2);}
  table.t tbody tr:last-child td{border-bottom:none;}
  table.t .tk{font-weight:800;color:var(--ink);}
  a.slink{color:inherit;text-decoration:none;border-bottom:1px dashed var(--muted-2);cursor:pointer;}
  a.slink:hover{color:var(--accent-ink);border-bottom-color:var(--accent-ink);}
  details.why{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;}
  details.why>summary{cursor:pointer;font-weight:700;font-size:12.5px;color:var(--accent-ink);list-style:none;user-select:none;}
  details.why>summary::-webkit-details-marker{display:none;}
  details.why>summary::before{content:'▸ ';}
  details.why[open]>summary::before{content:'▾ ';}
  details.why ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;line-height:1.7;color:var(--ink-2);}
  details.why li{margin:3px 0;}
  details.why .ev{font-size:12px;margin:2px 0 2px 6px;}
  details.why .whyfoot{margin-top:8px;font-size:11px;color:var(--muted-2);line-height:1.5;}

  /* ---------- Filters ---------- */
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:13px;}
  .fchip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);
    cursor:pointer;font-size:12.5px;font-weight:600;transition:all .16s ease;box-shadow:var(--shadow-sm);
    font-family:inherit;line-height:1.4;}
  .fchip:hover{color:var(--ink);border-color:var(--line-strong);}
  .fchip.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 35%,transparent);}
  [data-theme="dark"] .fchip.on{color:#0a0e17;}
  .sep{width:1px;height:22px;background:var(--line);margin:0 3px;}
  select.sel,input.search{padding:8px 13px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--surface);
    color:var(--ink);box-shadow:var(--shadow-sm);outline:none;transition:border-color .15s,box-shadow .15s;}
  select.sel:focus,input.search:focus{border-color:var(--accent);box-shadow:var(--ring);}
  input.search{min-width:160px;}
  .hint{color:var(--muted-2);font-size:11.5px;margin-top:9px;}

  /* ---------- States ---------- */
  .empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);
    padding:28px 22px;text-align:center;font-size:13.5px;line-height:1.6;}
  .empty .ei{font-size:26px;display:block;margin-bottom:8px;opacity:.6;}
  .err{background:var(--down-bg);color:var(--down-ink);border:1px solid var(--down-line);border-radius:var(--radius);padding:16px;}
  .note-box{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:var(--radius-sm);padding:12px 15px;
    font-size:12.5px;color:var(--accent-ink);margin-bottom:14px;line-height:1.65;}
  .note-box b{font-weight:800;}
  .foot-note{color:var(--muted-2);font-size:12px;margin-top:30px;text-align:center;line-height:1.6;}

  /* ---------- 盤中即時 ---------- */
  .live-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .live-upd{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;}
  .live-upd .ld{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px var(--up-bg);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .refresh{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
    cursor:pointer;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-sm);transition:all .16s ease;display:inline-flex;align-items:center;gap:6px;}
  .refresh:hover{border-color:var(--line-strong);transform:translateY(-1px);}
  .refresh svg{width:14px;height:14px;}
  .gate{border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:16px;border:1px solid var(--line);}
  .gate-on{background:var(--up-bg);border-color:var(--up-line);} .gate-off{background:var(--down-bg);border-color:var(--down-line);}
  .gate-neu{background:var(--surface-3);border-color:var(--line);}
  .gate .gt{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .gate .mx{font-size:13px;color:var(--ink-2);margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 14px;}
  .lcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted-2);
    border-radius:var(--radius-sm);padding:13px 15px;margin-bottom:11px;box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .18s ease;}
  .lcard:hover{transform:translateX(2px);box-shadow:var(--shadow);}
  .lcard.A{border-left-color:var(--up);} .lcard.B{border-left-color:var(--warn);}
  .lcard.C{border-left-color:var(--down);} .lcard.skip{border-left-color:var(--muted-2);opacity:.78;}
  .lcard .lt{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
  .lcard .nm2{color:var(--ink-2);font-weight:600;margin-left:4px;font-size:13.5px;}
  .lcard .scen{font-weight:800;font-size:13px;white-space:nowrap;}
  .lcard .act{font-size:13px;color:var(--ink);margin-top:7px;}
  .lcard .lvl{font-size:12px;color:var(--muted);margin-top:6px;}
  .lcard .lvl b{color:var(--ink-2);}

  /* ---------- Responsive ---------- */
  @media(max-width:920px){
    .gcol-3{grid-column:span 6;} .gcol-4{grid-column:span 6;}
    .gcol-8{grid-column:span 12;} .gcol-6{grid-column:span 12;}
  }
  @media(max-width:640px){
    .wrap{padding:16px 12px 52px;}
    .title{font-size:18px;} .logo{width:38px;height:38px;}
    .sub{font-size:12px;gap:5px 10px;}
    .datebar{font-size:12px;}
    .tabs{display:flex;flex-wrap:nowrap;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:14px 0 18px;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{flex:0 0 auto;padding:8px 13px;}
    .dash-grid{gap:11px;}
    .gcol-3,.gcol-4{grid-column:span 6;}
    .kpi .kv{font-size:25px;}
    .hmini{grid-template-columns:repeat(2,1fr);}
    .stats{grid-template-columns:1fr;gap:11px;}
    .stat{padding:15px 16px;} .stat .v{font-size:23px;}
    .ccard,.card,.panelcard{padding:14px;}
    .ccard .top{gap:8px;}
    .tkr{font-size:15px;} .tkr .nm{font-size:13px;}
    .score .v{font-size:21px;}
    .meta{font-size:12px;}
    .plan{padding:11px 12px;} .plan table{font-size:11.5px;} .plan td{padding:5px 4px;}
    .note-box{font-size:12px;padding:11px 13px;}
    table.t{font-size:12.5px;} table.t th,table.t td{padding:11px 11px;}
    .filters{gap:6px;}
    select.sel,input.search{flex:1 1 140px;min-width:0;}
    .sep{display:none;}
    .regime{gap:13px;} .regime .ring,.regime .ring svg{width:64px;height:64px;}
  }
  @media(max-width:400px){
    .gcol-3,.gcol-4{grid-column:span 12;}
    .tkr{font-size:14px;} .score .v{font-size:19px;}
  }

  /* ============================================================
     個股健檢(Stock Health)— 2026-06-30 新增
     ============================================================ */
  .health-search{display:flex;gap:8px;margin-bottom:12px;}
  .health-input{flex:1 1 auto;min-width:0;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:9px 13px;font-size:14px;color:var(--ink);}
  .health-input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring);}
  .health-quicklist{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px;font-size:12px;}
  .hq-label{color:var(--muted);margin-right:2px;}
  .hq-chip{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);border-radius:999px;
    padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;}
  .hq-chip:hover{border-color:var(--accent);color:var(--accent-ink);}

  .health-top{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:20px 22px;margin-bottom:14px;}
  .health-score-block{text-align:center;}
  .health-score-block .ring{width:84px;height:84px;}
  .health-score-block .ring svg{width:84px;height:84px;}
  .health-score-block .rlabel{font-size:20px;}
  .health-stars{font-size:17px;color:var(--warn);letter-spacing:1px;margin-top:6px;}
  .health-label{font-weight:800;font-size:14px;margin-top:2px;}
  .health-reason{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .health-radar-block svg{width:100%;max-width:220px;height:auto;display:block;margin:0 auto;}
  .health-meta-block{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px;min-width:180px;}
  .health-style-row{display:flex;flex-wrap:wrap;gap:6px;}
  .hs-tgl{padding:5px 11px;font-size:11.5px;}

  .health-cap-note{color:var(--down-ink);font-weight:700;}
  .health-missing-note{color:var(--muted-2);font-size:11.5px;line-height:1.55;}
  .hm-cov{margin-left:8px;font-size:11px;color:var(--warn);font-weight:600;}

  .health-summary-card #health-narrative{font-size:13.5px;line-height:1.7;color:var(--ink-2);}
  .health-pc{margin-top:10px;font-size:12.5px;}
  .health-pc ul{margin:4px 0 0;padding-left:18px;line-height:1.7;color:var(--ink-2);}

  .health-swing{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .health-swing-box{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius-xs);
    padding:10px 9px;text-align:center;}
  .hsb-l{font-size:11px;color:var(--muted);font-weight:600;}
  .hsb-v{font-size:19px;font-weight:800;margin-top:4px;}
  .hsb-r{font-size:10px;color:var(--muted-2);margin-top:4px;line-height:1.4;}

  .health-dcf{font-size:12.5px;color:var(--ink-2);line-height:1.7;}
  .health-dcf-assump{color:var(--muted);margin-top:3px;}
  .health-dcf-formula{color:var(--muted-2);font-size:11.5px;margin-top:6px;line-height:1.6;}

  .health-engines{display:flex;flex-direction:column;gap:12px;margin-top:14px;}
  details.health-engine-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 18px;}
  details.health-engine-card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;
    justify-content:space-between;gap:8px;}
  details.health-engine-card>summary::-webkit-details-marker{display:none;}
  details.health-engine-card>summary::before{content:'▸ ';color:var(--muted-2);}
  details.health-engine-card[open]>summary::before{content:'▾ ';}
  .health-metric-list{margin-top:12px;border-top:1px solid var(--line-soft);}
  details.hm-row{border-bottom:1px solid var(--line-soft);padding:8px 0;}
  details.hm-row>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
    font-size:12.5px;flex-wrap:wrap;}
  details.hm-row>summary::-webkit-details-marker{display:none;}
  .hm-label{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:600;min-width:170px;}
  .hm-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .hm-val{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}

  .hm-note{margin-top:8px;font-size:11.5px;color:var(--muted-2);line-height:1.6;}
  details.hnl-panel{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:8px;}
  details.hnl-panel>summary{cursor:pointer;list-style:none;font-size:12px;font-weight:700;color:var(--accent);padding:2px 0;}

  .hnl-title{font-size:12.5px;line-height:1.5;}
  .hnl-title a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--muted);}

  .hnl-meta{font-size:11px;color:var(--muted-2);margin-top:2px;}
  .hnl-read{color:var(--up);}

  @media(max-width:760px){
    .health-top{grid-template-columns:1fr;text-align:center;}
    .health-meta-block{align-items:center;}
    .health-swing{grid-template-columns:repeat(2,1fr);}
    .hm-label{min-width:120px;}
  }
</style>

<div class="wrap">
  <div class="topbar">
    <div class="brand">

  /* ── 即時報價卡(2026-07-19 改版)────────────────────────────────
     原本把 17 個欄位平鋪成同樣大小的灰字,使用者反映「眼花撩亂、單色、字小密集」。
     改用美股/加密貨幣交易軟體的分層作法:
       1. 價格是 hero(28px),其餘一律降級 —— 一眼先看到最重要的數字
       2. 兩個比率(委買賣、內外盤)畫成 meter 長條,失衡程度用看的不用讀數字
       3. 量能四項做成 KPI 格,數字大、標籤小
       4. 狀態(突破/回測)只在成立時出現 chip,不成立就不佔版面(原本印一堆 ✗)
     ⚠️ 紅綠在色盲下 ΔE 僅 4.3(驗證器實測,正常視覺 32.2)→ meter 兩端一律附文字標籤,

     上面是昨日收盤的判斷,這一塊是現在的市況,兩者不該長得一樣。 */
  .q-strip{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:8px;
    padding:10px 12px;margin:10px 0;}

  /* 漲跌停:整塊底色。價格文字改用高對比的白/深色,不是把 --up 疊在 --up-bg 上(會糊掉)。

<!-- 個股詳情頁圖表用 ECharts(PyEcharts 的 JS 本體);只在使用者點開個股時才需要 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script>
const $=(s,el=document)=>el.querySelector(s);
const isNum=v=>v!==null&&v!==undefined&&v!==''&&!isNaN(v)&&isFinite(Number(v));
const fmt=(v,d=2)=>!isNum(v)?'-':(v>=0?'+':'')+Number(v).toFixed(d);
const num=(v,d=2)=>!isNum(v)?'-':Number(v).toFixed(d);
const fmtInt=v=>!isNum(v)?'-':Math.round(Number(v)).toLocaleString('en-US');
const cls=v=>!isNum(v)?'flat':(v>0?'up':v<0?'down':'flat');
/* score / integer-ish numeric display: '-' when missing, no 'null'/'NaN' leak */
const iv=(v,suffix='')=>!isNum(v)?'-':String(Number(v))+suffix;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge=p=>p==='動能'?'<span class="badge b-mom">動能</span>':p==='品質'?'<span class="badge b-qual">品質</span>':p?`<span class="badge b-bal">${esc(p)}</span>`:'<span class="badge b-bal">—</span>';
// 股票代號 → 點開站內個股詳情頁(K線/量/均線/三大法人)。CMoney 外連移到詳情頁內。
const slink=id=>{const s=String(id==null?'':id);return `<a class="slink" href="#stock=${encodeURIComponent(s)}" onclick="openDetail('${esc(s)}');return false;" title="點看 ${esc(s)} 技術圖 / 三大法人">${esc(s)}📈</a>`;};
let DATA=null,LATEST=null,LABEL={};
const lbl=h=>LABEL[h]||h;
/* 個股健檢狀態(2026-06-30 新增)。HEALTH_API_ENABLED=false(預設):只用每日批次的
   docs/health/*.json,不嘗試任意代號即時查詢。部署 Vercel(docs+api 同一個 project)後
   改 true 即可啟用;HEALTH_API_BASE 同源部署留空字串(相對路徑 /api/health 即可,
   不會有 CORS 問題);若 API 部署在不同網域,填那個網域(例如 'https://xxx.vercel.app',
   不要結尾斜線)。 */
let HEALTH_TAB_INIT=false,HEALTH_CACHE={},HEALTH_STYLE='value_investing';
const HEALTH_API_ENABLED=true;
const HEALTH_API_BASE='';

/* ---------- shared premarket fetch (de-dupe dashboard live-strip vs live tab) ---------- */
let _pmCache=null,_pmTs=0,_pmInflight=null;
function getPremarket(force){
  const now=Date.now();
  if(!force&&_pmCache&&(now-_pmTs)<30000)return Promise.resolve(_pmCache);
  if(_pmInflight)return _pmInflight;
  _pmInflight=fetch('./premarket.json?'+now)
    .then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .then(d=>{_pmCache=d;_pmTs=Date.now();_pmInflight=null;return d;})
    .catch(err=>{_pmInflight=null;throw err;});
  return _pmInflight;
}

/* ---------- theme ---------- */
(function initTheme(){
  let t=null;
  try{t=localStorage.getItem('twse-theme');}catch(e){}
  if(!t)t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);
})();
function applyThemeLabel(){
  const t=document.documentElement.getAttribute('data-theme');
  const el=$('#themeLabel');if(el)el.textContent=t==='dark'?'淺色':'深色';
}
window.addEventListener('DOMContentLoaded',()=>{
  applyThemeLabel();
  const btn=$('#themeToggle');
  if(btn)btn.onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('twse-theme',next);}catch(e){}
    applyThemeLabel();
  };
});
/* react to system change only if user hasn't chosen */
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{
    let saved=null;try{saved=localStorage.getItem('twse-theme');}catch(_){}
    if(!saved){document.documentElement.setAttribute('data-theme',e.matches?'dark':'light');applyThemeLabel();}
  });
}

function setSub(){
  const d=DATA||{};
  const mkt=d.index_below_ma20
    ? '<span class="pill-mkt mkt-dn"><span class="pdot"></span>大盤在月線下 · 偏弱</span>'
    : '<span class="pill-mkt mkt-up"><span class="pdot"></span>大盤站上月線 · 偏多</span>';
  /* 大盤閘門(regime):積極度分級 + 今日核心上限/門檻。取代純裝飾的月線標籤(月線標籤保留) */
  const mr=d.market_regime;
  let gate='';
  if(mr&&mr.enabled){
    const cmap={'積極':'mkt-up','中性':'','保守':'mkt-dn','觀望':'mkt-dn'};
    const pb=mr.prefer_pullback?' · 偏好回測':'';
    gate=`<span class="dot"></span><span class="pill-mkt ${cmap[mr.level_label]||''}" title="積極度 ${isNum(mr.votes)?mr.votes:'-'};核心上限 ${mr.core_count} 檔、入榜門檻 ${mr.min_score} 分${pb}">閘門:${esc(mr.level_label||'')} · 核心≤${isNum(mr.core_count)?mr.core_count:'-'} · 門檻${isNum(mr.min_score)?mr.min_score:'-'}${pb}</span>`;
  }
  const isHist=!!(LATEST&&d.date!==LATEST.date);
  const hist=isHist?'<span class="tag-hist">歷史</span>':'';
  /* generated_at only belongs to the latest snapshot; don't show it next to a historical date */
  const upd=(!isHist&&LATEST&&LATEST.generated_at)?`<span class="dot"></span>更新 ${esc(LATEST.generated_at)}`:'';
  /* 停更股:資料落後市場、已被新鮮度閘門排除。要露出來 —— 這類失敗不會讓流程紅燈,
     不顯示就等於又回到「靜默用舊資料算分」的老問題。 */
  const stale=(isNum(d.stale_count)&&d.stale_count>0)
    ? `<span class="dot"></span><span style="color:var(--warn)" title="${esc((d.stale_stocks||[]).slice(0,15).map(x=>x.stock_id+'('+x.last_bar+')').join(' · '))||'資料落後市場基準日,已排除不評分'}">⚠ ${d.stale_count} 檔資料停更已排除</span>`
    : '';
  $('#sub').innerHTML=`<span>${esc(d.date)||''}</span>${hist}<span class="dot"></span>全市場 <b style="color:var(--ink-2)">${isNum(d.scored_count)?d.scored_count:0}</b> 檔評分${stale}<span class="dot"></span>${mkt}${gate}${upd}`;
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function donut(pct,color,label){
  const r=30,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(1,pct)));
  return `<div class="ring">
    <svg viewBox="0 0 74 74">
      <circle cx="37" cy="37" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="7"/>
      <circle cx="37" cy="37" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg>
    <div class="rlabel" style="color:${color}">${label}</div>
  </div>`;
}
function renderDash(){
  const d=DATA||{}, c=d.core||[], w=d.watch||[];
  /* performance lives ONLY on the latest snapshot (history files lack it).
     Always read perf from LATEST so historical views show latest perf, clearly labelled. */
  const p=(LATEST&&LATEST.performance)||{};
  const o=p.overall||{}, es=p.exit_sim||{}, bh=p.by_horizon||{};
  const bull=!d.index_below_ma20;
  const isHist=!!(LATEST&&d.date!==LATEST.date);
  const latestTag=isHist?'<span class="tag-latest">最新</span>':'';

  /* ----- KPI row ----- */
  const winRate = isNum(es.win_rate)?es.win_rate : (isNum(o.win_rate)?o.win_rate:null);
  const avgRet  = es.avg_ret;
  const kHtml=`
    <div class="gcol-3"><div class="kpi ${bull?'k-up':'k-down'}">
      <div class="kl">${svgI('compass')}大盤位階</div>
      <div class="kv" style="color:${bull?'var(--up)':'var(--down)'}">${bull?'月線上':'月線下'}</div>
      <div class="ks">${bull?'偏多 · 可正常操作':'偏弱 · 控制部位'} · ${isNum(d.scored_count)?d.scored_count:0} 檔評分</div>
    </div></div>
    <div class="gcol-3"><div class="kpi">
      <div class="kl">${svgI('layers')}今日核心檔數</div>
      <div class="kv">${c.length}<small> 檔</small></div>
      <div class="ks">觀察清單 ${w.length} 檔醞釀中</div>
    </div></div>
    <div class="gcol-3"><div class="kpi ${isNum(winRate)&&winRate>=50?'k-up':'k-warn'}">
      <div class="kl">${svgI('target')}已實現勝率${latestTag}</div>
      <div class="kv">${isNum(winRate)?winRate+'%':'—'}</div>
      <div class="ks">${isNum(es.closed)?`已結 ${es.closed} 筆 · 持有 ${isNum(es.open)?es.open:0}`:'績效累積中'}</div>
    </div></div>
    <div class="gcol-3"><div class="kpi ${isNum(avgRet)?(avgRet>=0?'k-up':'k-down'):''}">
      <div class="kl">${svgI('trend')}平均報酬${latestTag}</div>
      <div class="kv ${cls(avgRet)}">${isNum(avgRet)?fmt(avgRet)+'%':'—'}</div>
      <div class="ks">${isNum(es.avg_hold_days)?`平均持有 ${es.avg_hold_days} 日`:'隔日開盤模擬進場'}</div>
    </div></div>`;

  /* ----- market regime hero(含 2026-07-18 加的「風險狀態」提示)----- */
  // risk_gate 來自含 2022 空頭的整合回測:同一批選股在「指數>60MA 且 期貨法人未平倉偏多」的
  // 日子平均淨 +0.58%/筆,不分日子則 −0.40%。刻意只提示、不過濾(不藏推薦、判斷權留給使用者)。
  const rg=(d.market_regime||{}).risk_gate;
  const rgStyle={risk_on:['var(--up-ink)','var(--up-bg)','var(--up-line)','🟢'],
                 risk_off:['var(--down-ink)','var(--down-bg)','var(--down-line)','🔴'],
                 mixed:['var(--warn)','var(--surface-3)','var(--line)','🟡']};
  const rgHtml=rg?(()=>{const [ink,bg,bd,ic]=rgStyle[rg.state]||rgStyle.mixed;
    return `<div style="background:${bg};border:1px solid ${bd};border-left:3px solid ${ink};
        border-radius:10px;padding:10px 13px;margin-top:12px;">
      <div style="font-size:12.5px;font-weight:800;color:${ink};">${ic} 風險狀態:${esc(rg.label)}</div>
      <div style="font-size:11.5px;color:var(--ink-2);margin-top:5px;line-height:1.6;">${esc(rg.text)}</div>
      <div style="font-size:10.5px;color:var(--muted-2);margin-top:5px;">
        指數 ${num(rg.index_last)} vs ${rg.ma_long}MA ${num(rg.index_ma)}${rg.fut_ok==null?'':' · 期貨法人未平倉偏'+(rg.fut_ok?'多':'空')}
        　·　僅為風險提示,不影響選股名單</div>
    </div>`;})():'';
  const regimeHtml=`<div class="panelcard">
    <div class="pc-h">市場狀態 <span class="lk" data-go="core">看核心精選 →</span></div>
    <div class="regime">
      ${donut(bull?0.82:0.28, bull?'var(--up)':'var(--down)', bull?'偏多':'偏弱')}
      <div class="rtext">
        <div class="rt" style="color:${bull?'var(--up)':'var(--down)'}">${bull?'大盤站上月線':'大盤在月線下'}</div>
        <div class="rd">${bull?'指數位於 20 日均線之上,趨勢偏多,系統正常輸出核心標的。':'指數跌破 20 日均線,趨勢轉弱。寧缺勿濫、嚴設停損、降低部位。'}</div>
      </div>
    </div>
    ${rgHtml}
  </div>`;

  /* ----- top picks (rank_score order) ----- */
  const picks=c.slice().sort((a,b)=>((isNum(b.rank_score)?b.rank_score:isNum(b.score)?b.score:0)-(isNum(a.rank_score)?a.rank_score:isNum(a.score)?a.score:0))).slice(0,5);
  const picksHtml=`<div class="panelcard">
    <div class="pc-h">今日精選 Top ${picks.length} <span class="lk" data-go="core">全部 ${c.length} 檔 →</span></div>
    ${picks.length?picks.map((s,i)=>`<div class="pick">
      <div class="rk">${i+1}</div>
      <div class="pinfo">
        <div class="pn"><span class="id">${s.hot_industry?'🔥':''}${slink(s.stock_id)}</span><span class="nm">${esc(s.name)}</span> ${badge(s.profile)}</div>
        <div class="pmeta">收 ${num(s.close)} <span class="${cls(s.change_pct)}">${fmt(s.change_pct)}%</span> · ${esc(s.industry)||''}</div>
      </div>
      <div class="pscore"><div class="v">${iv(s.score)}</div>${isNum(s.chip_bonus)&&s.chip_bonus>0?`<div class="b">籌碼 +${iv(s.chip_bonus)}</div>`:''}</div>
    </div>`).join(''):'<div class="empty" style="padding:18px"><span class="ei">🗒️</span>今日無核心標的 · 寧缺勿濫</div>'}
  </div>`;

  /* ----- confidence distribution ----- */
  // 分桶依 scoring.weights v3 的新尺度(2026-07-18):rs 轉負權重後分數攤開成 ~5~93、
  // 已觸發選股中位約 62(舊尺度是 52~97、中位 82.5)。沿用舊分桶會讓所有股看起來像變差。
  const buckets=[['75+',0],['60–74',0],['45–59',0],['<45',0]];
  c.forEach(s=>{const v=isNum(s.score)?Number(s.score):0;if(v>=75)buckets[0][1]++;else if(v>=60)buckets[1][1]++;else if(v>=45)buckets[2][1]++;else buckets[3][1]++;});
  const maxB=Math.max(1,...buckets.map(b=>b[1]));
  const distHtml=`<div class="panelcard">
    <div class="pc-h">信心分分布 <span style="font-size:12px;color:var(--muted);font-weight:600">核心 ${c.length} 檔</span></div>
    <div class="dist">
      ${buckets.map(([lab,n])=>`<div class="row"><span class="lab">${lab}</span>
        <span class="track"><span class="fill" style="width:${(n/maxB*100).toFixed(0)}%"></span></span>
        <span class="val">${n}</span></div>`).join('')}
    </div>
  </div>`;

  /* ----- perf by horizon mini ----- */
  const hname={1:'隔日',3:'3日',5:'5日',10:'10日',20:'20日',30:'30日'};
  const hs=(p.horizons||[]).filter(h=>bh[h]).slice(0,4);
  const horizonHtml=`<div class="panelcard">
    <div class="pc-h">各天期平均報酬${latestTag} <span class="lk" data-go="perf">看績效 →</span></div>
    ${hs.length?`<div class="hmini">${hs.map(h=>{const s=bh[h]||{};return `<div class="hc">
      <div class="ht">${hname[h]||esc(h)}</div>
      <div class="hv ${cls(s.avg_ret)}">${fmt(s.avg_ret)}%</div>
      <div class="hw">勝率 ${isNum(s.win_rate)?s.win_rate+'%':'-'} · n${isNum(s.n)?s.n:'-'}</div></div>`;}).join('')}</div>`
      :'<div class="empty" style="padding:18px"><span class="ei">⏳</span>績效資料累積中</div>'}
  </div>`;

  /* ----- live preview (premarket gate) ----- */

// 迷你日K棒圖(近 40 交易日)— 純 SVG,零外部套件;無 s.ohlc(舊資料/降級)時回傳空字串,不報錯。
function kbars(s){
  const o=s.ohlc;
  if(!o||!o.length)return '';
  const W=320,H=64,padL=2,padR=2,padT=5,padB=5;
  const n=o.length, cw=(W-padL-padR)/n, bw=Math.max(1,cw*0.62);
  let lo=Infinity,hi=-Infinity;
  for(const c of o){if(c.every(isNum)){lo=Math.min(lo,c[2]);hi=Math.max(hi,c[1]);}}
  if(!isFinite(lo)||!isFinite(hi)||hi<=lo)return '';
  const span=hi-lo;
  const y=v=>padT+(H-padT-padB)*(1-(v-lo)/span);
  let bars='';
  o.forEach((c,i)=>{
    if(!c.every(isNum))return;
    const [op,hg,lw,cl]=c;
    const x=padL+cw*i+cw/2, up=cl>=op, col=up?'var(--up)':'var(--down)';
    const yo=y(op),yc=y(cl),yh=y(hg),yl=y(lw);
    const top=Math.min(yo,yc), bh=Math.max(1,Math.abs(yc-yo));
    bars+=`<line x1="${x.toFixed(1)}" y1="${yh.toFixed(1)}" x2="${x.toFixed(1)}" y2="${yl.toFixed(1)}" style="stroke:${col};stroke-width:1"/>`;
    bars+=`<rect x="${(x-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" style="fill:${col}"/>`;
  });
  return `<div class="kbars"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}</svg><div class="kfoot">近 ${n} 日K線(資料延遲至前日收盤)</div></div>`;
}
function bars(s){
  const m=[['趨勢',s.trend],['強度',s.rs],['時機',s.setup],['品質',s.quality],['量能',s.liquidity]];
  return `<div class="bars">${m.map(([k,v])=>{const has=isNum(v);const pct=has?Math.max(0,Math.min(1,Number(v))):0;return `<span class="bar">${k} <span class="mb"><i style="width:${(pct*100).toFixed(0)}%"></i></span> <b>${has?Math.round(pct*100):'-'}</b></span>`;}).join('')}</div>`;
}

  return `<div class="plan">

          <td>防開高走低:<b>別市價追</b>。回測昨收 ${num(p.ref)} 不破再進(上限 ${num(p.max_entry)});不回頭就放棄。</td></tr>

          <td>別接刀:需<b>站回開盤價 + 帶量吞噬</b>、大盤沒同步崩才試單;破停損 ${num(p.init_stop)} 則放棄。</td></tr>
    </table>

// 「為什麼選這檔」— 純用已算好的資料把信心分各維度+催化劑翻成白話,零額外 API/token。
function whyPanel(s){
  const dim=(label,v,hi,mid,lo)=>{if(!isNum(v))return null;const p=Math.round(Math.max(0,Math.min(1,Number(v)))*100);
    return `<b>${label} ${p}</b> — ${p>=70?hi:(p>=45?mid:lo)}`;};
  const pts=[];
  pts.push(s.breakout?'今日<b>帶量突破</b> — 價量同步站上近期壓力,屬「剛啟動」型,順勢進場。'
         :s.pullback_turn?'今日<b>回測支撐轉強</b> — 多頭中回檔到均線止穩、買盤回流,屬「低接轉強」型。'
         :'今日出現新鮮進場訊號。');
  [dim('趨勢',s.trend,'完整多頭排列、站穩均線','均線偏多但未全多排','均線轉弱,留意'),
   dim('強度',s.rs,'明顯強於大盤、資金流入','與大盤同步','弱於大盤'),
   dim('時機',s.setup,'短線時機佳(量縮整理剛轉強)','時機普通','時機偏弱,主要靠突破帶動'),
   dim('品質',s.quality,'體質/財務穩健','體質中等','體質普通、偏題材'),
   dim('量能',s.liquidity,'成交活絡、進出容易','量能尚可','量能偏低,掛單注意滑價')
  ].forEach(d=>{if(d)pts.push(d);});
  const bz=[];
  if(isNum(s.chip_bonus)&&s.chip_bonus>0)bz.push(`籌碼 +${iv(s.chip_bonus)}(法人站買方)`);
  if(isNum(s.catalyst_bonus)&&s.catalyst_bonus>0)bz.push(`題材 +${iv(s.catalyst_bonus)}(新聞催化)`);
  if(isNum(s.fund_bonus)&&s.fund_bonus>0)bz.push(`基本面 +${iv(s.fund_bonus)}(財報加分)`);
  if(isNum(s.industry_bonus)&&s.industry_bonus>0)bz.push(`產業 +${iv(s.industry_bonus)}(身處強勢產業)`);
  if(bz.length)pts.push('信心分加成:'+bz.join(' · '));
  if(s.catalysts&&s.catalysts.length){
    const ev=s.catalysts.filter(c=>c.evidence).map(c=>`<div class="ev">・<b>${esc(c.type)}</b>${isNum(c.confidence)?` ${Math.round(c.confidence*100)}%`:''}:<span style="color:var(--muted)">「${esc(c.evidence)}」</span></div>`).join('');
    if(ev)pts.push('題材依據(新聞原文,AI 標註):'+ev);
  }
  if(s.target_prices&&s.target_prices.length){
    const tpEv=s.target_prices.map(t=>`<div class="ev">・<b>${esc(t.broker)}</b> ${isNum(t.price)?num(t.price):'?'}元${t.asof?`(${esc(t.asof)})`:''}:<span style="color:var(--muted)">「${esc(t.evidence)}」</span></div>`).join('');
    pts.push('法人目標價(新聞轉述,AI 標註,僅新聞有報導才抓到,非完整即時清單):'+tpEv);
  }
  if(s.risk_flags&&s.risk_flags.length)pts.push(`<span style="color:var(--down)">⚠ 風險:${s.risk_flags.map(esc).join(' · ')}</span>`);
  return `<details class="why"><summary>為什麼選這檔(解讀)</summary>
    <ul>${pts.map(p=>`<li>${p}</li>`).join('')}</ul>
    <div class="whyfoot">系統把信心分各維度與新聞催化「翻成白話」,非漲跌預測;實際進出依上方決策卡,並自負風險。</div>
  </details>`;
}
function coreCard(s,i){

  let chip='';
  const ch=s.chips;

  }
  let val='';

  }
  // 基本面(毛利/營益/ROE/負債/月營收YoY)
  let fund2='';
  if(ff&&(isNum(ff.gross_margin)||isNum(ff.roe)||isNum(ff.debt_ratio)||isNum(ff.revenue_yoy))){
    const fp=[];
    if(isNum(ff.gross_margin))fp.push(`毛利 ${num(ff.gross_margin,1)}%`);

  }
  // 題材(新聞催化劑)+ 風險旗標

  // 法人目標價(新聞轉述,非完整即時清單,見 whyPanel 原文引用)

  if(isNum(s.day_trade_penalty)&&s.day_trade_penalty<0)bonuses.push(`當沖 ${iv(s.day_trade_penalty)}`);
  const bonusHtml=bonuses.map(b=>`<div class="chipb">${b}</div>`).join('');
  return `<div class="ccard">

  </div>`;

  /* 上半:網頁自選池(即時、可直接加減);下半:批次算好的訊號卡(來自 config/watchlist.json)。
     兩份清單來源不同是刻意的 —— 見 wlAdd 上方註解。 */
  const head='<div id="wl-box"></div>';
  if(!w.length){
    $('#p-watchlist').innerHTML=head+'<div class="empty" style="padding:30px 0"><span class="ei">🔔</span>批次尚未對自選股算訊號。加入自選池後按「複製設定檔」貼進 config/watchlist.json,隔日批次就會產生訊號卡與新聞。</div>';
    renderWatchlistBox();return;
  }
  $('#p-watchlist').innerHTML=head+`<div class="lead">自訂關注標的 + 命中訊號與新聞(<b>${w.length}</b> 檔)。</div>`+w.map(s=>{
    const tags=(s.hits||[]).map(h=>`<span class="chip-tag">${esc(lbl(h))}</span>`).join('');
    const combos=(s.combos||[]).map(c=>`<span class="chip-tag chip-combo">${esc(c)}</span>`).join('');
    const news=(s.news||[]).slice(0,3).filter(n=>n&&n.title).map(n=>{const safe=/^https?:\/\//i.test(n.link||'');return `<li style="margin:3px 0">${safe?`<a href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>`:esc(n.title)}</li>`;}).join('');
    return `<div class="ccard">
      <div class="top">
        <div style="min-width:0"><div class="tkr">🔔 ${slink(s.stock_id)}<span class="nm">${esc(s.name)}</span> ${s.profile?badge(s.profile):''}${heldTag(s.stock_id)}</div>
          ${s.note?`<div class="meta">備註:${esc(s.note)}</div>`:''}
          <div class="meta">收 <b class="num">${num(s.close)}</b> <span class="${cls(s.change_pct)} num">(${fmt(s.change_pct)}%)</span><span class="mdot"></span>${esc(s.industry)||''}</div>
        </div>
        ${isNum(s.score)?`<div class="score"><div class="v">${iv(s.score)}</div><div class="l">信心分</div></div>`:''}
      </div>
      ${(combos||tags)?`<div style="margin-top:10px">${combos}${tags}</div>`:''}
      ${news?`<ul style="margin:11px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)">${news}</ul>`:''}
    </div>`;
  }).join('');
  renderWatchlistBox();
}

const PORT_KEY='twse-portfolio';

let PORT={v:1,positions:[],updated:null};

/* 多帳戶存檔(2026-07-19):使用者有兩個券商帳號,需分開管理。
   資料結構:ACC={v,active,accounts:{帳戶名:[持倉...]}};PORT.positions 永遠是「目前帳戶」的持倉,
   所以既有全部程式(portGet/portUpsert/renderPortfolio…)完全不用改。 */
const PORT_ACC_KEY='twse-portfolio-accounts';
let ACC={v:1,active:'預設',accounts:{'預設':[]}};
const accNames=()=>Object.keys(ACC.accounts||{});
function accSaveAll(){ACC.updated=new Date().toISOString();
  try{localStorage.setItem(PORT_ACC_KEY,JSON.stringify(ACC));}catch(e){alert('本機儲存失敗:'+(e&&e.message||e));}}
function portLoad(){
  /* 1) 先讀新版多帳戶 */
  try{const r=localStorage.getItem(PORT_ACC_KEY);
    if(r){const o=JSON.parse(r);
      if(o&&o.accounts&&Object.keys(o.accounts).length){
        ACC={v:o.v||1,active:(o.accounts[o.active]?o.active:Object.keys(o.accounts)[0]),accounts:o.accounts,updated:o.updated||null};
        Object.values(ACC.accounts).forEach(list=>(list||[]).forEach(p=>{if(p&&p.shares==null&&p.lots!=null)p.shares=Number(p.lots)*1000;}));
        PORT={v:2,positions:ACC.accounts[ACC.active]||[],updated:ACC.updated};return;}}
  }catch(e){}
  /* 2) 沒有新版 → 從舊版單一持倉遷移成「預設」帳戶(不刪舊 key,保留可回溯) */
  try{const r=localStorage.getItem(PORT_KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.positions)){
    o.positions.forEach(p=>{if(p&&p.shares==null&&p.lots!=null)p.shares=Number(p.lots)*1000;});
    ACC={v:1,active:'預設',accounts:{'預設':o.positions},updated:o.updated||null};
    PORT={v:2,positions:ACC.accounts['預設'],updated:o.updated||null};accSaveAll();return;}}}catch(e){}
  ACC={v:1,active:'預設',accounts:{'預設':[]}};PORT={v:2,positions:ACC.accounts['預設'],updated:null};
}
function portSave(){
  ACC.accounts[ACC.active]=PORT.positions;      /* 目前帳戶的持倉寫回 */
  PORT.updated=new Date().toISOString();accSaveAll();
}
function accSwitch(name){
  if(!ACC.accounts[name]||name===ACC.active)return;
  portSave();                                   /* 先存目前帳戶 */
  ACC.active=name;PORT.positions=ACC.accounts[name]||[];
  accSaveAll();PORT_PRICE={};renderPortfolio();
}
function accAdd(){
  const n=(prompt('新帳戶名稱(例如:富邦、永豐)')||'').trim();
  if(!n)return;
  if(ACC.accounts[n]){alert('已有同名帳戶');return;}
  portSave();ACC.accounts[n]=[];ACC.active=n;PORT.positions=ACC.accounts[n];
  accSaveAll();renderPortfolio();
}
function accRename(){
  const cur=ACC.active,n=(prompt('改帳戶名稱',cur)||'').trim();
  if(!n||n===cur)return;
  if(ACC.accounts[n]){alert('已有同名帳戶');return;}
  portSave();
  const ordered={};accNames().forEach(k=>{ordered[k===cur?n:k]=ACC.accounts[k];});  /* 保持原順序 */
  ACC.accounts=ordered;ACC.active=n;PORT.positions=ACC.accounts[n];
  accSaveAll();renderPortfolio();
}
function accDelete(){
  if(accNames().length<=1){alert('至少要保留一個帳戶');return;}
  if(!confirm(`刪除帳戶「${ACC.active}」及其 ${PORT.positions.length} 檔持倉?建議先「匯出備份」。`))return;
  delete ACC.accounts[ACC.active];
  ACC.active=accNames()[0];PORT.positions=ACC.accounts[ACC.active]||[];
  accSaveAll();PORT_PRICE={};renderPortfolio();
}
const portHas=id=>PORT.positions.some(p=>String(p.id)===String(id));
const portGet=id=>PORT.positions.find(p=>String(p.id)===String(id))||null;
const portCleanNum=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:null;};
const portCode=v=>{const m=String(v==null?'':v).match(/\d{4,6}/);return m?m[0]:null;};
const heldTag=id=>portHas(id)?'<span class="badge held-badge" title="你的持倉">🔖 持有</span>':'';

function portUpsert(o){
  const id=String(o.id),ex=portGet(id);
  if(ex){ex.name=o.name||ex.name;ex.shares=o.shares;ex.cost=o.cost;if(isNum(o.price))ex.price=o.price;if(o.note!=null)ex.note=o.note;ex.ts=new Date().toISOString();}
  else PORT.positions.push({id,name:o.name||'',shares:o.shares,cost:o.cost,price:(isNum(o.price)?o.price:null),note:o.note||'',ts:new Date().toISOString()});
  wlAdd(id,o.name||'',true);      /* 加持倉自動進自選池(2026-07-19 使用者要求) */
}

/* ============================================================
   自選池(2026-07-19 改成網頁直接加)
   ⚠️ 重要限制:這裡存 localStorage,**雲端批次讀不到**。
   批次(盤後補抓籌碼/財報、分點掃描)跑在 GitHub Actions 上,只看得到
   repo 裡的 config/watchlist.json。所以:
     · 網頁自選池 → 立即生效於「網頁上的即時報價/顯示」
     · 要讓批次也認得 → 用「複製設定檔」把 JSON 貼進 config/watchlist.json 再 commit
   兩者刻意分開:localStorage 不上傳(和持倉一致的隱私原則),而批次沒有你的瀏覽器。
   ============================================================ */
const WL_KEY='twse-watchlist';
let WL={};
function wlLoad(){try{WL=JSON.parse(localStorage.getItem(WL_KEY)||'{}')||{};}catch(e){WL={};}}
function wlSave(){try{localStorage.setItem(WL_KEY,JSON.stringify(WL));}catch(e){alert('本機儲存失敗:'+(e&&e.message||e));}}
function wlAdd(id,name,silent){
  id=String(id||'').trim(); if(!id)return false;
  if(WL[id]!==undefined&&silent)return false;      /* 已在池中,持倉重複匯入不覆蓋備註 */
  WL[id]={name:name||'',note:WL[id]&&WL[id].note||'',ts:new Date().toISOString()};
  wlSave(); if(!silent)renderWatchlistBox();
  return true;
}
function wlDel(id){delete WL[String(id)];wlSave();renderWatchlistBox();}
/* 一鍵把目前持倉全部併進自選池(補上在此功能之前就存在的持倉) */
function wlSyncPortfolio(){
  let n=0; (PORT.positions||[]).forEach(p=>{if(wlAdd(p.id,p.name,true))n++;});
  renderWatchlistBox();
  alert(n?`已把 ${n} 檔持倉加入自選池。`:'持倉都已在自選池中。');
}
/* 一鍵同步到雲端(2026-07-19):寫回 repo 的 config/watchlist.json,
   讓盤後籌碼補抓、分點掃描、連買連賣都認得這些股票 —— 不必再手動複製貼上。
   ⚠️ 只送代號與備註;張數、成本、損益永遠不離開這台瀏覽器(api/watchlist.py 也會再濾一次)。 */
function wlSecret(){
  let s=null; try{s=localStorage.getItem('twse-wl-secret');}catch(e){}
  if(!s){
    s=prompt('請輸入同步密鑰(對應 Vercel 的 WATCHLIST_SECRET 環境變數)。\n只需輸入一次,之後存在本機。');
    if(!s)return null;
    try{localStorage.setItem('twse-wl-secret',s);}catch(e){}
  }
  return s;
}
function wlSync(){
  if(!HEALTH_API_ENABLED)return alert('雲端同步需要部署 Vercel API。');
  const secret=wlSecret(); if(!secret)return;
  const stocks={}; Object.entries(WL).forEach(([id,v])=>{stocks[id]=v.name||'';});
  if(!Object.keys(stocks).length)return alert('自選池是空的,沒有東西可以同步。');
  const btn=$('#wl-sync'); if(btn){btn.disabled=true;btn.textContent='同步中…';}
  fetch(HEALTH_API_BASE+'/api/watchlist',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({stocks,secret})})
    .then(r=>r.json().then(j=>({ok:r.ok,j})))
    .then(({ok,j})=>{
      if(!ok||j.error){
        if(String(j.error||'').includes('secret')){try{localStorage.removeItem('twse-wl-secret');}catch(e){}}
        alert('同步失敗:'+(j.error||'未知錯誤'));
      }else alert(j.changed?`已同步 ${j.n} 檔到雲端。下次批次就會涵蓋這些股票。`:'雲端內容已是最新,無需變更。');
    })
    .catch(e=>alert('同步失敗:'+e))
    .finally(()=>{if(btn){btn.disabled=false;btn.textContent='同步到雲端';}});
}

/* 即時報價卡。分層原則見上方 CSS 註解。缺值一律「—」,不假裝有數字。 */
const _qn=(v,d)=>isNum(v)?num(v,d==null?2:d):'—';
const _qamt=v=>isNum(v)?(v>=1e8?(v/1e8).toFixed(1)+'億':(v/1e4).toFixed(0)+'萬'):'—';

/* meter:一條分成兩段的長條。兩端都有文字標籤 —— 紅綠在色盲下分不開(ΔE 4.3),
   不能只靠顏色。ratio = 左段佔比 0~1。
   ⚠️ 「買一/賣一」是**最佳一檔的委託量**,不是券商軟體那種總委買/總委賣(五檔加總),
      數字對不起來是正常的 —— 快照只給得到最佳一檔(2026-07-20 使用者反映後正名)。 */
function qMeter(lLab,rLab,ratio,lVal,rVal,tipKey){
  /* 沒資料就整條不畫。截圖檢查發現跌停股(華邦電)兩條 meter 都是空的,
     卻各佔一條灰底長條 —— 空的視覺元素比沒有更糟,會讓人以為「這裡有東西只是看不懂」。 */
  if(!isNum(ratio))return '';
  const p=Math.max(0,Math.min(1,ratio)),pc=(p*100).toFixed(0);
  const strong=p>=0.5;
  return `<div class="q-mtr">
    <div class="q-mtr-h">
      <span style="color:var(--up-ink);font-weight:700">${lLab} ${lVal!=null?lVal:''}</span>
      <b style="color:${strong?'var(--up-ink)':'var(--down-ink)'}"${tipKey?tip(tipKey):''}>${strong?pc:(100-pc)}% ${strong?lLab:rLab}佔優</b>
      <span style="color:var(--down-ink);font-weight:700">${rVal!=null?rVal:''} ${rLab}</span>
    </div>
    <div class="q-bar"><i style="width:${pc}%;background:var(--up)"></i><i style="flex:1;background:var(--down)"></i></div>
  </div>`;
}

/* 內文用 **粗體** 標關鍵句 —— 先 escape 再把 ** 轉成 <b>,順序不能反(否則會 XSS)。 */
const _tipMd=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function tipHtml(k){
  const t=TIP[k]; if(!t)return '';
  const [title,what,hi,lo]=t;
  return `<b>${esc(title)}</b><br>${_tipMd(what)}`
    +(hi?`<br><span style="color:var(--up-ink)">▲ 高:</span>${_tipMd(hi)}`:'')
    +(lo?`<br><span style="color:var(--down-ink)">▼ 低:</span>${_tipMd(lo)}`:'');
}
/* 用法:把 tip('volratio') 塞進元素的屬性裡 */
const tip=k=>TIP[k]?` data-tip="${k}" tabindex="0" role="button" aria-label="${esc(TIP[k][0])} 說明"`:'';
let _tipEl=null;
function _tipShow(el){
  const k=el.getAttribute('data-tip'); if(!k||!TIP[k])return;
  _tipHide();
  const d=document.createElement('div');
  d.className='tip-pop'; d.innerHTML=tipHtml(k);
  document.body.appendChild(d);
  const r=el.getBoundingClientRect(),w=Math.min(300,innerWidth-24);
  d.style.width=w+'px';
  let left=r.left+r.width/2-w/2;
  left=Math.max(12,Math.min(left,innerWidth-w-12));
  d.style.left=left+'px';
  /* 空間不夠就翻到下方 —— 卡片上緣的欄位若一律往上開會被切掉 */
  const h=d.offsetHeight;
  d.style.top=(r.top-h-8>8 ? r.top-h-8 : r.bottom+8)+window.scrollY+'px';
  _tipEl=d;
}
function _tipHide(){if(_tipEl){_tipEl.remove();_tipEl=null;}}
/* 事件委派:卡片會不斷重繪,逐一綁定會漏掉新元素也會累積監聽器 */
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(t)_tipShow(t);});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))_tipHide();});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tip]');
  if(t){e.stopPropagation();_tipEl&&_tipEl.dataset.k===t.getAttribute('data-tip')?_tipHide():_tipShow(t);}
  else _tipHide();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')_tipHide();});
window.addEventListener('scroll',_tipHide,{passive:true});

/* ---------- 漲跌停 ----------
   台股漲跌停不是單純 ±10%,是「昨收 ×1.1 後往下取到最近的檔位」,而檔位隨股價分級。
   用門檻近似會誤判:7/17 實測用 ±9.8% 會抓到 199 檔,精算檔位法只有 137 檔(8漲停/129跌停),
   多出來的 62 檔全是誤判。所以這裡照規則算。 */
function tickSize(p){
  if(p<10)return 0.01; if(p<50)return 0.05; if(p<100)return 0.1;
  if(p<500)return 0.5; if(p<1000)return 1; return 5;
}
function limitPrices(prev){
  if(!isNum(prev)||prev<=0)return null;
  const t=tickSize(prev);
  return {up:+(Math.floor(+(prev*1.1/t).toFixed(6))*t).toFixed(2),
          dn:+(Math.ceil(+(prev*0.9/t).toFixed(6))*t).toFixed(2)};
}
/* 回傳 'up'(漲停) / 'dn'(跌停) / null。用價格相等判定,不用漲跌幅門檻。 */
function limitState(q){
  const L=limitPrices(q&&q.prev_close);
  if(!L||!isNum(q.price))return null;
  if(Math.abs(q.price-L.up)<1e-6)return 'up';
  if(Math.abs(q.price-L.dn)<1e-6)return 'dn';
  return null;
}

/* ---------- 當日走勢線 ----------
   卡片是「掃視」用的,一次看 5~10 檔,每張塞完整 K 線會比原本的字小密集更糟。
   掃視當下真正要判斷的只有兩件事:今天的形狀、現在站在均價之上還是之下 ——
   一條價格線 + 一條均價線就答完了,40px 高。完整 K 線留給個股詳情頁(專心看一檔的地方)。
   資料來自 docs/series.json(1分K 降頻到 90 點),不足兩點就不畫。 */
function sparkline(id){
  const s=SERIES&&SERIES.series&&SERIES.series[id];
  if(!s||!s.c||s.c.length<2)return '';
  const c=s.c,v=s.v||[],q=LIVE[id]||{},prev=q.prev_close;
  const W=100,H=34,pad=2;
  const all=c.concat(v.filter(isNum)).concat(isNum(prev)?[prev]:[]);
  const lo=Math.min(...all),hi=Math.max(...all),span=(hi-lo)||1;
  const X=i=>(i/(c.length-1)*(W-pad*2)+pad).toFixed(2);
  const Y=p=>(H-pad-(p-lo)/span*(H-pad*2)).toFixed(2);
  const path=a=>a.map((p,i)=>isNum(p)?`${i&&isNum(a[i-1])?'L':'M'}${X(i)} ${Y(p)}`:'').join('');
  const up=isNum(prev)&&c[c.length-1]>=prev;
  const col=up?'var(--up)':'var(--down)';
  const base=isNum(prev)?`<line x1="${pad}" y1="${Y(prev)}" x2="${W-pad}" y2="${Y(prev)}"
      stroke="var(--muted-2)" stroke-width="0.5" stroke-dasharray="2 2" opacity=".7"/>`:'';
  const vw=v.some(isNum)?`<path d="${path(v)}" fill="none" stroke="var(--muted)"
      stroke-width="0.8" stroke-dasharray="3 2" opacity=".85"/>`:'';
  return `<svg class="q-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
      role="img" aria-label="當日走勢">
    ${base}${vw}<path d="${path(c)}" fill="none" stroke="${col}" stroke-width="1.4"
      stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="q-spark-l"><span>09:00</span><span>虛線＝均價・點線＝昨收</span><span>13:30</span></div>`;
}

/* 當日即時迷你K棒(2026-07-22,使用者要求放在自選池股價旁)。
   用即時報價的 開/高/低/現價 畫一根 K —— 隨每次輪詢更新,一眼看出「今天長怎樣」
   (長紅/長黑/上影線被壓/十字…),補走勢線看不出的實體與影線資訊。
   台股慣例:紅=收(現價)≥開、綠=收<開。資料不足就不畫,不留佔位。 */
function liveMiniK(q){
  if(!q||!isNum(q.open)||!isNum(q.high)||!isNum(q.low)||!isNum(q.price))return '';
  const o=q.open,h=q.high,l=q.low,c=q.price,span=h-l;
  const W=13,H=30,cx=W/2;
  if(!(span>0)){                                  /* 一字板 / 剛開盤高低收同價 */
    return `<svg class="q-mk" width="${W}" height="${H}" aria-label="當日K:一字"><line x1="1" y1="${H/2}" x2="${W-1}" y2="${H/2}" stroke="var(--muted)" stroke-width="2"/></svg>`;
  }
  const y=v=>1+(H-2)*(1-(v-l)/span);
  const up=c>=o, col=up?'var(--up)':'var(--down)';
  const yo=y(o),yc=y(c),top=Math.min(yo,yc),bh=Math.max(1.5,Math.abs(yc-yo));
  return `<svg class="q-mk" width="${W}" height="${H}" role="img" aria-label="當日即時K棒 開${_qn(o)} 高${_qn(h)} 低${_qn(l)} 現${_qn(c)}">
    <line x1="${cx}" y1="${y(h)}" x2="${cx}" y2="${y(l)}" stroke="${col}" stroke-width="1"/>
    <rect x="1.5" y="${top}" width="${W-3}" height="${bh}" fill="${up?col:'none'}" stroke="${col}" stroke-width="1.2"/>
  </svg>`;
}

/* 報價本體(不含標題列)。抽出來是為了讓「自選池 / 核心精選 / 觀察清單 / 盤中即時」
   共用同一份即時區塊 —— 使用者要求四個地方都要這樣顯示,不該複製四次。
   `compact=true` 給已經有自己標題與價格的卡片用(核心/觀察),省掉 hero 價格避免重複。 */
function qBody(id,compact){
  const q=LIVE[id]||{},dp=(DEEP&&DEEP.metrics&&DEEP.metrics[id])||null;
  const up=isNum(q.change_pct)&&q.change_pct>=0;
  const col=isNum(q.change_pct)?(up?'var(--up-ink)':'var(--down-ink)'):'var(--muted)';
  const chips=[];
  if(q.breakout)chips.push(`<span class="q-chip"${tip('breakout')}>突破 20 日高</span>`);
  if(q.at_ma5)chips.push(`<span class="q-chip warn"${tip('atma5')}>回測 5 日線</span>`);
  /* 沒有任何即時資料就整塊不畫,不要留一堆「—」佔版面 */
  if(!isNum(q.price)&&!isNum(q.total_volume))return '';
  /* 漲停綠底 / 跌停紅底(使用者要求)。鎖死在漲跌停是「今天沒得買/沒得賣」的強訊號,
     不該只是一個顏色稍深的數字 —— 用整塊底色讓它在一排卡片裡跳出來。 */
  const lim=limitState(q);
  const pxCls=lim==='up'?' q-lim-up':lim==='dn'?' q-lim-dn':'';
  const limTag=lim==='up'?`<span class="q-lim-tag up"${tip('limit')}>漲停</span>`
             :lim==='dn'?`<span class="q-lim-tag dn"${tip('limit')}>跌停</span>`:'';
  const hero=compact?'':`<div class="q-hero">
      ${liveMiniK(q)}
      <span class="q-px${pxCls}" style="${pxCls?'':'color:'+col}">${_qn(q.price)}</span>
      <span class="q-dl" style="color:${col}">${isNum(q.change_price)?(up?'▲':'▼')+' '+Math.abs(q.change_price).toFixed(2):'—'}
        &nbsp;${isNum(q.change_pct)?fmt(q.change_pct)+'%':''}</span>${limTag}
    </div>`;
  return `${hero}${compact&&limTag?`<div style="margin-bottom:4px">${limTag}</div>`:''}
    ${sparkline(id)}
    <div class="q-ctx">
      <span${tip('high')}>高 ${_qn(q.high)}</span><span${tip('low')}>低 ${_qn(q.low)}</span>
      <span${tip('vwap')}>均價 ${_qn(q.vwap)}</span>
      <span${tip('tickvol')}>單量 ${_qn(q.tick_volume,0)}</span>
      ${compact&&q.industry?`<span>${esc(q.industry)}</span>`:''}
    </div>
    ${qMeter('買一','賣一',q.bid_ask_ratio,_qn(q.bid_volume,0),_qn(q.ask_volume,0),'bidask')}
    ${qMeter('外盤','內盤',dp?dp.outer_ratio/100:null,dp?_qvol(dp.outer):null,dp?_qvol(dp.inner):null,'innerouter')}
    <div class="q-kpi">
      <div><div class="q-kl"${tip('totvol')}>總量</div><div class="q-kv">${_qvol(q.total_volume)}</div></div>
      <div><div class="q-kl"${tip('amount')}>成交額</div><div class="q-kv">${_qamt(q.total_amount)}</div></div>
      <div><div class="q-kl"${tip('turnover')}>換手率</div><div class="q-kv">${isNum(q.turnover_rate)?q.turnover_rate.toFixed(2)+'%':'—'}</div></div>
      <div><div class="q-kl"${tip('volratio')}>量比</div><div class="q-kv">${_qn(q.volume_ratio,2)}${isNum(q.volume_ratio)?'×':''}</div></div>
    </div>
    <div class="q-fund">
      <span><span${tip('revyoy')}>營收YoY</span> <b style="color:${isNum(q.revenue_yoy)?(q.revenue_yoy>=0?'var(--up-ink)':'var(--down-ink)'):'var(--muted-2)'}">${isNum(q.revenue_yoy)?fmt(q.revenue_yoy)+'%':'—'}</b></span>
      <span><span${tip('eps')}>EPS近四季</span> <b>${_qn(q.eps_ttm)}</b></span>
      ${streakChip(id)}
      ${chips.join('')}
    </div>
    ${techChips(id)}`;
}
/* 核心/觀察/盤中的卡片已有自己的標題與收盤價 → 用 compact 版包一層淡底,

/* 現價:先 data.json 批次,再 detail API 快取 */
function portPriceOf(id){

     detail API。以前只有後兩者,所以持倉損益永遠是昨收、而且要點進去等 5~15 秒。 */
  const lq=LIVE[id];

  for(const arr of [d.core,d.watch,d.watchlist]){
    if(Array.isArray(arr)){const s=arr.find(x=>x&&String(x.stock_id)===id);
      if(s&&isNum(s.close))return {close:Number(s.close),name:s.name,industry:s.industry};}
  }
  if(PORT_PRICE[id]&&isNum(PORT_PRICE[id].close))return PORT_PRICE[id];
  return null;
}
function portResolveMissing(){
  const ids=PORT.positions.map(p=>String(p.id)).filter(id=>!portPriceOf(id)&&!_portFetching[id]&&!(id in PORT_PRICE));
  ids.forEach(id=>{
    _portFetching[id]=1;
    fetch(HEALTH_API_BASE+'/api/detail?stock='+encodeURIComponent(id)).then(r=>r.json()).then(d=>{
      if(d&&!d.error&&Array.isArray(d.kline)&&d.kline.length){const k=d.kline[d.kline.length-1];

  });
}

const portCleanName=s=>String(s==null?'':s).replace(/[（(]\s*\d{4,6}[A-Za-z]?\s*[）)]/,'').trim();  /* 去掉名稱裡的(代碼) */
function portParse(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.replace(/ /g,' ').trimEnd()).filter(l=>l.trim());
  if(!lines.length)return [];
  const splitLine=l=>l.includes('\t')?l.split('\t').map(c=>c.trim()):l.trim().split(/\s+/);
  /* 表頭:含 代碼/名稱類 + 庫存/成本/現價類 任一,即視為表頭(相容『報價庫存』與『即時未實現損益』兩種畫面) */
  let hi=-1;for(let i=0;i<lines.length;i++){
    if(/代碼|代號|股票名稱|商品|名稱/.test(lines[i])&&/庫存|股數|餘額|成本|均價|成交|現價|市值/.test(lines[i])){hi=i;break;}}
  let col=null;
  if(hi>=0){const H=splitLine(lines[hi]);
    const find=(re,avoid)=>{for(let i=0;i<H.length;i++){if(re.test(H[i])&&!(avoid&&avoid.test(H[i])))return i;}return null;};
    col={
      id:    find(/代碼|代號/),
      name:  find(/股票名稱|商品名稱|商品|名稱|股票/),
      shares:find(/即時庫存|現股庫存|庫存|股數|部位/,/昨|餘額/),          /* 股數(非張數);排除昨日餘額 */
      cost:  find(/均價/)!=null?find(/均價/):find(/成本/,/付出|總/),   /* 優先『成本均價』,避開『付出成本』(總額) */
      price: find(/現價|成交|市價/,/昨|開盤|最高|最低|均/),
    };
  }
  const out=[];
  lines.forEach((l,i)=>{
    if(i===hi)return;
    let name='',shares=null,cost=null,price=null,id=null;
    if(col){const cells=splitLine(l);
      if(col.name!=null&&cells[col.name])name=cells[col.name];
      id=(col.id!=null?portCode(cells[col.id]):null)||portCode(name)||portCode(l);
      if(col.shares!=null)shares=portCleanNum(cells[col.shares]);
      if(col.cost!=null)cost=portCleanNum(cells[col.cost]);
      if(col.price!=null)price=portCleanNum(cells[col.price]);
    } else { id=portCode(l); }
    if(!id)return;
    if(!name){const m=l.match(/[一-鿿][一-鿿A-Za-z0-9．.\-]*/);if(m)name=m[0];}
    out.push({id,name:portCleanName(name),shares,cost,price});
  });
  return out;
}

function portOcrPicked(e){
  const file=e.target.files&&e.target.files[0];if(!file)return;
  const status=$('#port-ocr-status');if(status)status.innerHTML='<div class="port-note">讀取圖片中…</div>';
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{
    // 密表小字很吃解析度:只在超寬時才縮到 2400px,並用無損 PNG(JPEG 壓縮會糊掉小數字)
    const maxW=2400;let w=img.width,h=img.height;
    if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    let b64='';try{b64=c.toDataURL('image/png').split(',')[1];}catch(_){if(status)status.innerHTML='<div class="port-warn">圖片讀取失敗,請換一張。</div>';return;}
    if(status)status.innerHTML='<div class="port-note">🔍 Claude 辨識中,約 10~20 秒…</div>';
    fetch(HEALTH_API_BASE+'/api/portfolio_ocr',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:b64,media_type:'image/png'})})
      .then(r=>r.json().catch(()=>{throw new Error('http '+r.status+'(API 未部署或無回應)');}))
      .then(d=>{if(d&&d.error)throw new Error(d.error);
        const rows=(d.positions||[]).map(p=>({id:portCode(p.id),name:portCleanName(p.name||''),shares:portCleanNum(p.shares),cost:portCleanNum(p.cost),price:portCleanNum(p.price)})).filter(r=>r.id);
        if(!rows.length){if(status)status.innerHTML='<div class="port-warn">沒辨識到持股。換一張更清楚的截圖,或改用「貼上券商庫存」／「手動新增」。</div>';return;}
        if(status)status.innerHTML='';
        $('#port-stage').innerHTML=portStageTable(rows,'✅ 辨識到');
      })
      .catch(err=>{if(status)status.innerHTML=`<div class="port-warn">辨識失敗:${esc(err&&err.message||err)}<br>截圖辨識需部署 Vercel(見 VERCEL_SETUP.md);可改用「貼上券商庫存」或「手動新增」。</div>`;});
  };img.src=rd.result;};
  rd.readAsDataURL(file);
}
