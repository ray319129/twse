# 選股策略設定檔
# 規格詳見 specs/01_strategies.md

# 全域設定
global:
  min_market_cap: 1_000_000_000   # 最小市值 (元)。※ 未直接實作市值門檻;實務上由 ranking.min_dollar_volume
                                   #   (日均成交額 3000 萬)間接濾掉雞蛋水餃股。留此僅為文件用途。
  exclude_etf: true                # 不選 ETF(已實作:filter_tradable_stocks 濾掉 00xx 代號)
  exclude_warrant: true            # 不選權證(已實作:只留 4 位純數字代號,權證/可轉債為 5~6 位)
  exclude_full_cash: true          # 排除受限股(已實作:fetch_restricted_stocks 抓 TWSE/TPEX 官方名單,
                                   #   涵蓋全額交割/變更交易 + 處置分盤 + 管理 + 停止買賣;來源全掛則不過濾)

# A. 趨勢類
trend:
  bullish_ma_alignment:            # A1 多頭排列
    enabled: true
    periods: [5, 20, 60, 120]

  golden_cross:                    # A2 黃金交叉
    enabled: true
    fast: 5
    slow: 20

  break_60ma:                      # A3 突破季線
    enabled: true

  above_240ma:                     # A4 站上年線
    enabled: true
    consecutive_days: 5

# B. 動能類
momentum:
  kd_golden_cross_low:             # B1 KD 低檔黃金交叉
    enabled: true
    k_period: 9
    d_period: 3
    smooth_k: 3
    low_threshold: 30

  macd_turn_red:                   # B2 MACD 翻紅
    enabled: true
    fast: 12
    slow: 26
    signal: 9

  rsi_break_50:                    # B3 RSI 突破 50
    enabled: true
    period: 14

# C. 量價類
volume_price:
  volume_price_surge:              # C1 量價齊揚
    enabled: true
    volume_multiplier: 1.5
    price_change_min: 0.02         # 漲幅 ≥ 2%

  n_day_high:                      # C2 N 日新高
    enabled: true
    period: 60

# D. 籌碼類
chips:
  inst_consecutive_buy:            # D1 法人連買 ✅
    enabled: true
    days: 3

  foreign_holding_increase:        # D2 外資加碼 ✅
    enabled: true
    period: 30
    threshold: 0.02                # 30 日內外資持股比上升 ≥ 2 個百分點

  short_cover_with_buy:            # D3 融券回補 + 主力買超 ✅
    enabled: true
    cover_threshold: 0.05          # 融券餘額減少 ≥ 5%

# E. 基本面快篩
fundamental:
  monthly_revenue_growth:          # E1 月營收連續成長 ✅
    enabled: true
    consecutive_months: 3
    latest_yoy_min: 0.10           # 最新月 YoY ≥ 10%

  eps_positive_high_yield:         # E2 EPS 正成長 + 高殖利率 ✅
    enabled: true
    eps_quarters: 4                # 近 4 季 EPS 都需為正
    yield_min: 0.04                # 殖利率 ≥ 4%

# ★ 短線信心排序(取代「符合條件就全列出」)— 詳見 scripts/scoring.py
# 全市場用免費資料(價格 + 估值快照)算 0~100 信心分,只取最高分的核心+觀察。
ranking:
  core_count: 10              # 核心(今天有新鮮觸發、可考慮進場)最多幾檔
  watch_count: 20            # 觀察(醞釀中、放口袋盯)最多幾檔
  min_score: 45              # 低於此分不入榜(避免名單不夠時硬湊垃圾)
  min_dollar_volume: 30000000  # 日均成交金額門檻(3000 萬),太低直接淘汰
  enrich_top_n: 30           # 只對排名前 N 名補抓 FinMind 籌碼/財報(控制 API 額度)

# ★ 大盤閘門(market regime,3.3)— 依大盤盤性動態調「今天選幾檔核心 / 入榜門檻」,弱盤偏好回測型。
# 三組訊號投票(每項 ±1):指數 vs MA20/MA5/MA20斜率、市場廣度(站上MA20家數比+上漲家數比)、漲跌停家數。
# 投票總和 → 依 tiers 由高到低選第一個 min_votes 符合的級別,套用其 core_count / min_score / prefer_pullback。
# enabled:false → 完全沿用上面 ranking 的固定 core_count / min_score(回到舊行為)。零額外 API(廣度用第一遍評分副產品)。
market:
  enabled: true
  ma_short: 5                # 指數短期均線
  ma_long: 20                # 指數中期均線(月線)
  slope_lookback: 20         # MA20 今日 vs 幾個交易日前(判斷月線上揚/下彎)
  breadth_strong: 0.60       # 站上月線家數比 ≥ 此 → 偏多一票
  breadth_weak: 0.40         # ≤ 此 → 偏空一票
  adv_strong: 0.60           # 上漲家數比 ≥ 此 → 偏多一票
  adv_weak: 0.40             # ≤ 此 → 偏空一票
  limit_up_pct: 0.095        # 漲/跌停家數的認定門檻(當日漲跌幅 ≥/≤ 此)
  limit_min_count: 3         # 漲停+跌停家數合計 ≥ 此才把「漲跌停失衡」計入投票(家數太少不具代表性)
  breakout_penalty_weak: 8   # 弱盤(prefer_pullback)時,純追突破股的『排序分數』扣此(顯示分不變),讓觸發偏好回測型
  tiers:                     # 依投票分數分級(min_votes 為「≥ 此門檻」;由 aggressive→defensive 取第一個符合)
    aggressive: { min_votes: 3,   core_count: 10, min_score: 45, prefer_pullback: false }
    neutral:    { min_votes: 1,   core_count: 7,  min_score: 50, prefer_pullback: false }
    cautious:   { min_votes: -2,  core_count: 5,  min_score: 55, prefer_pullback: true }
    defensive:  { min_votes: -99, core_count: 3,  min_score: 60, prefer_pullback: true }

# ★ 信心分權重與門檻(scripts/scoring.py compute_conviction)
# 全部可調;留空則用程式內預設(= 下列數值)。改這裡就能系統化調參、不必動 .py。
scoring:
  min_history: 120           # K 棒少於此直接跳過
  weights:                   # 五面向加權(建議總和=1,但不強制)
    trend: 0.25              # 趨勢健康
    rs: 0.25                 # 相對強度
    setup: 0.25             # 短線時機/量能
    quality: 0.15            # 品質估值
    liquidity: 0.10          # 流動性
  liquidity:
    span: 50                 # 流動性分:日均額 = min×span 時得 1 分(對數)
    # min_dollar_volume 仍沿用 ranking.min_dollar_volume(避免重複)
  trend:
    ma60_slope_lookback: 21  # 60MA 今日 vs 幾個交易日前(判季線上揚)
  rs:
    ratio_lo: 0.95           # rs_ratio 映射下界(0 分)
    ratio_hi: 1.30           # rs_ratio 映射上界(1 分)
    rising_lookback: 10      # rs_line 今日 vs 幾日前(判仍在轉強)
    rising_blend: 0.8        # 轉強時:rs = rs×blend + (1-blend)
  setup:
    vol_ratio_lo: 0.8        # 今日量比映射下界
    vol_ratio_hi: 2.0        # 今日量比映射上界
    vbias_lo: 0.8            # vol_ma5/vol_ma20 映射下界
    vbias_hi: 1.6            # 上界
    mom_lookback: 10         # 動能回看天數
    mom_full: 0.15           # 該期間漲幅達此 → 動能滿分(10日+15%)
    w_volx: 0.45             # setup 內三項權重(建議總和=1)
    w_vbias: 0.25
    w_mom: 0.30
    # 收盤相對位置(3.4-1)= (收-低)/(高-低):收在高檔=買方掌控到尾盤;衝高收弱=尾盤有人倒貨。
    # 對「非首板、非衝高未鎖」的一般個股做小幅總分調整(首板/衝高未鎖另有專屬加減,見 exhausted)。
    close_pos_hi: 0.80       # 收盤位置 >= 此 → 收高,總分 ×(1+close_pos_adj)
    close_pos_lo: 0.50       # 收盤位置 <= 此 → 收弱,總分 ×(1-close_pos_adj)
    close_pos_adj: 0.06      # 一般收盤位置加/扣分幅度
  quality:
    default: 0.5             # 無估值資料時的中性分
    pe_good: 25              # PE ≤ good → 1;≤ ok → 0.5;> ok → 0.1
    pe_ok: 40
    yield_full: 5.0          # 殖利率達此(%)→ 滿分
    pb_good: 3               # PB ≤ good → 1;≤ ok → 0.5;其餘 0.2
    pb_ok: 6
  exhausted:                 # 過熱判定(任一成立即重罰)
    ret5_max: 0.22           # 近 5 日漲幅超過 → 過熱
    ext_ma20_max: 0.18       # 乖離 20MA 超過 → 過熱
    rsi_max: 88              # RSI14 超過 → 過熱
    limit_up: 0.095          # 今日漲幅 ≥ 此視為漲停
    penalty: 0.55            # 過熱時總分 × 此
    # 3.2 漲停複合條件:漲停不再單獨判過熱(鎖死的第一根漲停續攻機率高,被舊規則錯殺)。
    big_up_pct: 0.04         # 「大漲」日門檻(單日漲幅 ≥ 4%)
    consec_big_up_days: 3    # 今日漲停 + 已連續大漲 ≥ 此天數 → 追高噴出,判過熱
    # 衝高未鎖(真正該防的型態):今日漲幅大但尾盤被打開/賣壓出籠 → 隔天最易開低
    spike_watch_lo: 0.07     # 今日漲幅 ≥ 此(7%,接近漲停區)
    spike_close_pos: 0.70    # 且收盤位置 < 此 → 判「衝高未鎖」,罰分且不進核心觸發
    spike_penalty: 0.80      # 衝高未鎖時總分 × 此
    # 首板(惜售,可加分):今日漲停 + 非連噴多日 + 收盤鎖高檔 → 盤整帶量突破第一根
    first_board_max_consec: 1   # 連續大漲 ≤ 此才算「首板」(不是連噴多日)
    first_board_close_pos: 0.90 # 且收盤位置 ≥ 此(鎖死/惜售)
    first_board_bonus: 0.05     # 首板時總分 ×(1+此)
  trigger:                   # 「今天新鮮觸發」(進核心的條件)
    breakout_lookback: 20    # 近 N 日收盤高
    breakout_vol_ratio: 1.5  # 突破需量比 ≥ 此
    pullback_near_ma20: 0.04 # 距 20MA 在此內算回測到位
    pullback_ma60_tol: 0.98  # 收盤 ≥ 60MA×此
  brewing:                   # 「醞釀中」(進觀察的條件)
    coiling_lookback: 120    # 布林帶寬分位回看
    coiling_quantile: 0.20   # 帶寬 ≤ 此分位算收斂
    coiling_abs_width: 0.06  # 或帶寬絕對值 ≤ 此
  profile:                   # 風格分類門檻
    momentum_margin: 0.30    # rs+setup 超過 trend+quality 此值 → 動能
    quality_min_q: 0.70      # 品質分 ≥ 且
    quality_min_trend: 0.60  # 趨勢分 ≥ → 品質
  # stage-2 籌碼加成:只對「核心候選」(已 enrich 抓籌碼)加分後重排,不影響全市場評分。
  # 因 FinMind 免費額度有限,無法對全市場抓籌碼;故先用基礎信心分選出候選,再用籌碼決定誰進核心。
  chip_bonus:
    enabled: true
    candidate_count: 15      # 取基礎信心分前 N 的觸發股當候選,加籌碼分後重排取 core_count
    weight: 10               # 籌碼滿分最多加此分到「排名分」(原信心分 score 顯示不變)
    streak_full: 5           # 法人連買達此天數 → 連買項滿分
    foreign_full: 2.0        # 30 日外資持股增加此百分點 → 外資項滿分
    short_cover_thr: 0.05    # 融券較前日減少 ≥ 此(5%)→ 回補項得分
  # stage-2 基本面加成:獲利能力/成長性/財務體質(FinMind 季財報,只對核心候選)。
  # 短線落後指標 → 低權重,主要當體質過濾。enabled:false 可關。
  fundamental_bonus:
    enabled: true
    weight: 5                # 基本面滿分最多加此分(低於籌碼,因短線落後)
    gross_full: 40           # 毛利率達此(%)→ 該項滿分
    operating_full: 20       # 營益率達此(%)→ 滿分
    revenue_yoy_full: 20     # 月營收年增達此(%)→ 滿分
    eps_yoy_full: 30         # EPS 年增達此(%)→ 滿分
    debt_good: 30            # 負債比 ≤ 此 → 體質項滿分
    debt_bad: 70             # 負債比 ≥ 此 → 0 分
  # stage-2 新聞催化劑加成:Claude Haiku 對近 30 天新聞做事件分類(只對核心候選)。
  # 需 ANTHROPIC_API_KEY(沒設自動略過、不報錯)。對短線價值高 → 權重略高於基本面。
  catalyst_bonus:
    enabled: true
    weight: 8                # 催化劑滿分最多加此分
    model: claude-haiku-4-5  # 分類用模型(成本最低)
    max_news: 25             # 每檔最多餵幾則標題
    max_tokens: 800
    full: 1.5                # Σ(confidence×類別權重) 除以此後夾 [0,1]
    # weights:               # 可選:覆寫各催化劑類別權重(預設見 scripts/catalyst.py)
  # stage-2 產業相對強度加成(新,預設關閉):身處當下最強產業(industry.py 排行前 top_n)才加分,
  # 概念對應 IBD 產業群組排名(Industry Group Rank)—— 個股表現之外,也看它所屬產業是否同步強勢。
  # 零額外 API,沿用全市場第一遍已算好的 industry_rows。
  industry_bonus:
    enabled: false
    weight: 4                # 產業滿分最多加此分(低於籌碼/催化劑,屬輔助加成)
    top_n: 5                  # 產業排行前 N 才有加分;第1名滿分,第N名接近0分,線性遞減

# ★ 進場(跳空保護)— 解決「盤後算的價,隔天跳空就失效」的痛點。
# 系統假設「隔日開盤」進場(貼近實際),並用 max_chase 限制追價:開太高就棄單,不追。
entry:
  fill: next_open       # 以隔日開盤成交模擬(非盤後收盤)
  max_chase: 0.03       # 隔日開盤較選股收盤高 > 3% → 跳空棄單(不追高);可調
  catalyst_chase:       # (新,預設關閉)強催化劑+帶量時放寬跳空開高棄單門檻 — 研究顯示有強催化劑的突破缺口回補率遠低於無故跳空
    enabled: false       # 需 scoring.catalyst_bonus 也開啟(要有 catalyst_signal)才有效;只放寬「開高」,開低棄單規則不變(別接刀)
    extra_chase: 0.02     # 門檻放寬到 max_chase + extra_chase(預設 3%+2%=5%)
    min_catalyst_score: 0.5  # 選股當天的新聞催化劑分數門檻(0~1,來自 catalyst.py)
    min_vol_ratio: 1.5    # 進場當日量比(量/5日均量)門檻,確認帶量,純新聞炒作但沒量不算

# ★ 出場模擬(R 倍數 + 移動停利)— 算「真實交易勝率」,而非固定天期快照。
# 進場=選股日收盤;逐日用最高/最低價判斷,同日雙觸保守假設先觸停損(寧可低估獲利)。
exit:
  hard_stop: 0.07          # 硬性停損上限:虧損絕不超過 -7%(無論技術面)
  r_multiple: 2.0          # 第一停利目標 TP1 = 進場 + 風險R × 2
  max_hold_days: 30        # 最長持有(安全/資料邊界),到期以收盤出場
  # 風格由選股當下自動判定:profile=動能 或 突破觸發 → 動能流;否則 → 波段流
  momentum:                # 強勢動能(隔日沖~5日):停損緊、看 5MA
    struct_lookback: 2     # 初始停損取近 N 根 K 棒最低點(結構低)
    ma_stop: 5             # 未達 TP1 前,收盤跌破 5MA → 停損
    ma_stop_grace_days: 2  # 進場後前 N 個交易日只用初始停損,第 N+1 日起才啟用均線停損(給洗盤空間;
                           #   突破股隔日進場常正常回測一天就破 5MA,太緊會被單日洗盤掃出、沒吃到後續噴出)
    trail_ma: 5            # 啟動移動停利後,收盤跌破 5MA → 出清
  swing:                   # 短波段(5日~1月):停損寬、看 20MA
    struct_lookback: 10    # 近 N 日結構低(近似平台下緣 / 關鍵支撐)
    ma_stop: 20
    ma_stop_grace_days: 0  # 波段本來就看 20MA(寬),不需寬限;要給也可調
    trail_ma: 10
  trail:                   # 移動停利回檔幅度,用 ATR 波動估(取代股本分級,意圖相同)
    atr_mult: 1.5          # 回檔% = 1.5 × ATR%
    min_pct: 0.03          # 下限 3%(波動小的大型權值股 → 約 3~4%)
    max_pct: 0.07          # 上限 7%(波動大的中小型股 → 約 5~7%)

# ★ 交易成本(出場模擬扣這些才是真實到手報酬)— 買賣各收一次手續費,賣出再收證交稅。
cost:
  fee_rate: 0.001425       # 券商手續費基本費率 0.1425%(買賣各收一次)
  fee_discount: 0.6        # 實際折數(0.6=6折,網路下單常見);依自己券商實際折數調
  tax_rate: 0.003          # 一般證交稅 0.3%,只在賣出收 — 本系統「隔日開盤進場」本來就不是當沖,正常出場用這個稅率
  tax_rate_daytrade: 0.0015  # 當沖減半稅率 0.15%(2027年底前有效),只有「進場與出場同一天」(hold_days=0,如進場當天就觸停損)才套用
                              # 前提是你已申請當沖權限且該股可現股當沖,系統無法驗證資格,當作該邊際情況的近似值
  slippage_pct: 0.001      # 滑價估計:實際成交價偏離理論價的幅度,買賣各扣一次

# ★ 建議風險倉位(選用,預設關閉)— 把 R 倍數框架用完整:資金×單筆風險% ÷ R(初始停損價差)反推建議張數。
# 研究顯示倉位規模對績效變異的影響遠大於進場訊號本身;系統原本只給價位線、沒給張數,填了才會顯示。
account:
  enabled: false           # 改 true 才會在核心卡顯示建議張數;填自己的資金與風險%
  capital: 0                # 總資金(元),例:1000000
  risk_pct: 0.01            # 單筆願意虧損的資金比例,例:0.01=1%

# F. 領先 / 醞釀型(舊版,已被上面的 ranking 取代,保留供 screen_stock 標籤用)
leading:
  coiling_squeeze:                 # F1 盤底蓄勢(波動壓縮)
    enabled: true
    lookback: 120                  # 回看天數
    width_pct: 0.15                # 布林帶寬度落在近 120 日最低 15% 分位 → 收斂(相對)
    abs_width_max: 0.06            # 或帶寬已 < 6%(±3%)→ 持續盤整也抓得到(絕對)
    require_volume_contraction: true  # 同時量縮(vol_ma5 < vol_ma20)
    near_ma60_tol: 0.10            # 收盤不可低於季線 10% 以上(避免接刀)

  pullback_to_support:             # F2 回測支撐(多頭回檔)
    enabled: true
    near_pct: 0.03                 # 收盤距 20MA/60MA 在 ±3% 內算「回到支撐」
    min_drawdown: 0.05             # 自近期高點至少回檔 5%
    lookback_high: 20             # 近期高點取近 20 日
    require_turn_up: true          # 需開始轉強(收紅 或 KD 交叉向上)

  relative_strength_leader:        # F3 相對強勢領頭羊
    enabled: true
    rs_min: 1.0                    # 近 60 日報酬須贏大盤(rs_ratio >= 1)
    rising_days: 10                # 且 rs_ratio 較 10 日前上升

  chip_accumulation:               # F4 籌碼吸籌(法人默默布局,價格還沒動)
    enabled: true
    lookback: 10                   # 近 10 個交易日
    min_buy_days: 6                # 至少 6 天法人淨買超
    flat_ret20_max: 0.08           # 但近 20 日股價漲跌幅在 ±8% 內(還沒發動)
    max_scan: 120                  # ※ 未實作:原意是每日對全市場「安靜股」額外掃描抓籌碼,目前並無此掃描;
                                   #   chip_accumulation 僅在已 enrich 的核心候選(含籌碼)上判定。此值目前無作用。

# ★ 盤前自動看盤(scripts/premarket.py)— 不影響盤後選股流程
# phase=preopen(約 08:45):抓個股試撮價 + 美股隔夜閘門 → 把昨晚核心10分類 A/B/C、刷掉棄單/作廢
# phase=orb(約 09:25):對 A(平盤)股抓開盤 15 分 1分K → 判斷帶量突破開盤區間高 → 通知可進
premarket:
  enabled: true
  gate:                     # 大盤盤前閘門:美股隔夜(已收)投票決定 risk-on / 中性 / risk-off
    sox_riskon: 1.0         # 費半隔夜 >= +1% 視為偏多一票
    sox_riskoff: -2.0       # 費半隔夜 <= -2% 視為偏空一票(台股權值=半導體,SOX 最相關)
    nq_riskon: 1.0
    nq_riskoff: -1.5
    vix_high: 25            # VIX >= 25 → 偏空一票(預期跳空大、整體轉保守)
  orb:
    range_minutes: 15       # 開盤區間 = 09:00 起算前幾分鐘(09:00–09:15)
    confirm_until: "09:30"  # 突破確認觀察到幾點為止
    volume_filter: true     # 帶量過濾:突破K成交量 > 開盤區間均量 × volume_mult 才算有效(過濾假突破)
    volume_mult: 1.0
  adr:                      # 台股代號 → 美股 ADR ticker(個股級盤前佐證;無 ADR 的股自動略過)
    "2330": TSM             # 台積電
    "2303": UMC             # 聯電
    "3711": ASX             # 日月光投控
    "2317": HNHPF           # 鴻海(OTC ADR,流動性偏低)
    "2409": AUOTY           # 友達

# ★ 個股健檢(Stock Health)— 2026-06-30 新增。獨立模組(scripts/health/),只對「核心+自選池」
# (與既有 stage-2 enrichment 同一份名單,零額外 API 預算風險)每日批次算好,寫 docs/health/{代號}.json。
# 任意代號即時查由 Vercel serverless(api/health.py)另外處理,讀同一套 scripts/health 引擎,
# 共用這份 config(單一事實來源,財務公式不會「批次一套、即時一套」)。
health:
  enabled: true
  quarters: 20              # 季財報抓取季數(5年CAGR需≥20季;比既有 fundamental_bonus 的8季長,逐日累積)
  per_history_days: 1825    # PE/PB/殖利率歷史窗(天),供 Value Engine 百分位/合理價估算
  # 三組投資風格的權重(財務/成長/估值/風險/技術/籌碼/新聞,總和不強制=100,Final Scoring 會用
  # 「有資料的面向權重」重新正規化)。前端可即時切換,純前端加權重算,不必重打 API。
  weights:
    value_investing:    {financial: 30, growth: 10, value: 30, risk: 20, technical: 5,  chip: 0,  news: 5}
    growth_investing:   {financial: 20, growth: 30, value: 10, risk: 15, technical: 15, chip: 5,  news: 5}
    short_term:          {financial: 5,  growth: 5,  value: 0,  risk: 15, technical: 35, chip: 25, news: 15}
  # Risk Engine 命中 Critical 規則時,無論其他面向多高,總分強制封頂(唯一不走加權平均的例外)。
  risk_cap:
    Critical: 40.0
  # 健檢新聞分析(scripts/health/news_engine.py):逐則新聞標記,90天視窗,單次 Haiku 呼叫
  # (與既有 scoring.catalyst_bonus 的 catalyst.py 是「不同schema、不同用途」的獨立呼叫,
  # 不是同一支,需 ANTHROPIC_API_KEY,沒設自動降級成 score=None)。
  news:
    model: claude-haiku-4-5
    max_news: 60
    max_tokens: 1600
  # AI 解讀潤飾(scripts/health/ai_summary.py):規則先產生事實句,LLM 只能重組句子,
  # 不能新增數字/結論(prompt 強制),沒有 API key 自動降級成純規則句。
  ai_summary:
    model: claude-haiku-4-5
    max_tokens: 400
  # 同業平均彙總(scripts/health/industry_benchmark.py)的最小樣本數,< 此一律不顯示同業平均。
  industry_min_sample: 3

# 多訊號交集組合
combos:
  - name: 主升段啟動
    requires: [bullish_ma_alignment, volume_price_surge, inst_consecutive_buy]
  - name: 底部反轉
    requires: [break_60ma, macd_turn_red, monthly_revenue_growth]
  - name: 強勢續攻
    requires: [bullish_ma_alignment, n_day_high, foreign_holding_increase]
  - name: 保守存股
    requires: [above_240ma, eps_positive_high_yield]
