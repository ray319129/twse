# 選股策略設定檔
# 規格詳見 specs/01_strategies.md

# 全域設定
global:
  min_market_cap: 1_000_000_000   # 最小市值 (元),濾掉雞蛋水餃股
  exclude_etf: true                # 不選 ETF
  exclude_warrant: true            # 不選權證
  exclude_full_cash: true          # 不選全額交割股

# A. 趨勢類
trend:
  bullish_ma_alignment:            # A1 多頭排列
    enabled: true
    periods: [5, 20, 60, 120]

  golden_cross:                    # A2 黃金交叉
    enabled: true
    fast: 5
    slow: 20

  break_60ma:                      # A3 突破季線
    enabled: true

  above_240ma:                     # A4 站上年線
    enabled: true
    consecutive_days: 5

# B. 動能類
momentum:
  kd_golden_cross_low:             # B1 KD 低檔黃金交叉
    enabled: true
    k_period: 9
    d_period: 3
    smooth_k: 3
    low_threshold: 30

  macd_turn_red:                   # B2 MACD 翻紅
    enabled: true
    fast: 12
    slow: 26
    signal: 9

  rsi_break_50:                    # B3 RSI 突破 50
    enabled: true
    period: 14

# C. 量價類
volume_price:
  volume_price_surge:              # C1 量價齊揚
    enabled: true
    volume_multiplier: 1.5
    price_change_min: 0.02         # 漲幅 ≥ 2%

  n_day_high:                      # C2 N 日新高
    enabled: true
    period: 60

# D. 籌碼類
chips:
  inst_consecutive_buy:            # D1 法人連買 ✅
    enabled: true
    days: 3

  foreign_holding_increase:        # D2 外資加碼 ✅
    enabled: true
    period: 30
    threshold: 0.02                # 30 日內外資持股比上升 ≥ 2 個百分點

  short_cover_with_buy:            # D3 融券回補 + 主力買超 ✅
    enabled: true
    cover_threshold: 0.05          # 融券餘額減少 ≥ 5%

# E. 基本面快篩
fundamental:
  monthly_revenue_growth:          # E1 月營收連續成長 ✅
    enabled: true
    consecutive_months: 3
    latest_yoy_min: 0.10           # 最新月 YoY ≥ 10%

  eps_positive_high_yield:         # E2 EPS 正成長 + 高殖利率 ✅
    enabled: true
    eps_quarters: 4                # 近 4 季 EPS 都需為正
    yield_min: 0.04                # 殖利率 ≥ 4%

# ★ 短線信心排序(取代「符合條件就全列出」)— 詳見 scripts/scoring.py
# 全市場用免費資料(價格 + 估值快照)算 0~100 信心分,只取最高分的核心+觀察。
ranking:
  core_count: 10              # 核心(今天有新鮮觸發、可考慮進場)最多幾檔
  watch_count: 20            # 觀察(醞釀中、放口袋盯)最多幾檔
  min_score: 45              # 低於此分不入榜(避免名單不夠時硬湊垃圾)
  min_dollar_volume: 30000000  # 日均成交金額門檻(3000 萬),太低直接淘汰
  enrich_top_n: 30           # 只對排名前 N 名補抓 FinMind 籌碼/財報(控制 API 額度)

# ★ 信心分權重與門檻(scripts/scoring.py compute_conviction)
# 全部可調;留空則用程式內預設(= 下列數值)。改這裡就能系統化調參、不必動 .py。
scoring:
  min_history: 120           # K 棒少於此直接跳過
  weights:                   # 五面向加權(建議總和=1,但不強制)
    trend: 0.25              # 趨勢健康
    rs: 0.25                 # 相對強度
    setup: 0.25             # 短線時機/量能
    quality: 0.15            # 品質估值
    liquidity: 0.10          # 流動性
  liquidity:
    span: 50                 # 流動性分:日均額 = min×span 時得 1 分(對數)
    # min_dollar_volume 仍沿用 ranking.min_dollar_volume(避免重複)
  trend:
    ma60_slope_lookback: 21  # 60MA 今日 vs 幾個交易日前(判季線上揚)
  rs:
    ratio_lo: 0.95           # rs_ratio 映射下界(0 分)
    ratio_hi: 1.30           # rs_ratio 映射上界(1 分)
    rising_lookback: 10      # rs_line 今日 vs 幾日前(判仍在轉強)
    rising_blend: 0.8        # 轉強時:rs = rs×blend + (1-blend)
  setup:
    vol_ratio_lo: 0.8        # 今日量比映射下界
    vol_ratio_hi: 2.0        # 今日量比映射上界
    vbias_lo: 0.8            # vol_ma5/vol_ma20 映射下界
    vbias_hi: 1.6            # 上界
    mom_lookback: 10         # 動能回看天數
    mom_full: 0.15           # 該期間漲幅達此 → 動能滿分(10日+15%)
    w_volx: 0.45             # setup 內三項權重(建議總和=1)
    w_vbias: 0.25
    w_mom: 0.30
  quality:
    default: 0.5             # 無估值資料時的中性分
    pe_good: 25              # PE ≤ good → 1;≤ ok → 0.5;> ok → 0.1
    pe_ok: 40
    yield_full: 5.0          # 殖利率達此(%)→ 滿分
    pb_good: 3               # PB ≤ good → 1;≤ ok → 0.5;其餘 0.2
    pb_ok: 6
  exhausted:                 # 過熱判定(任一成立即重罰)
    ret5_max: 0.22           # 近 5 日漲幅超過 → 過熱
    ext_ma20_max: 0.18       # 乖離 20MA 超過 → 過熱
    rsi_max: 88              # RSI14 超過 → 過熱
    limit_up: 0.095          # 今日漲幅 ≥ 此視為漲停
    penalty: 0.55            # 過熱時總分 × 此
  trigger:                   # 「今天新鮮觸發」(進核心的條件)
    breakout_lookback: 20    # 近 N 日收盤高
    breakout_vol_ratio: 1.5  # 突破需量比 ≥ 此
    pullback_near_ma20: 0.04 # 距 20MA 在此內算回測到位
    pullback_ma60_tol: 0.98  # 收盤 ≥ 60MA×此
  brewing:                   # 「醞釀中」(進觀察的條件)
    coiling_lookback: 120    # 布林帶寬分位回看
    coiling_quantile: 0.20   # 帶寬 ≤ 此分位算收斂
    coiling_abs_width: 0.06  # 或帶寬絕對值 ≤ 此
  profile:                   # 風格分類門檻
    momentum_margin: 0.30    # rs+setup 超過 trend+quality 此值 → 動能
    quality_min_q: 0.70      # 品質分 ≥ 且
    quality_min_trend: 0.60  # 趨勢分 ≥ → 品質
  # stage-2 籌碼加成:只對「核心候選」(已 enrich 抓籌碼)加分後重排,不影響全市場評分。
  # 因 FinMind 免費額度有限,無法對全市場抓籌碼;故先用基礎信心分選出候選,再用籌碼決定誰進核心。
  chip_bonus:
    enabled: true
    candidate_count: 15      # 取基礎信心分前 N 的觸發股當候選,加籌碼分後重排取 core_count
    weight: 10               # 籌碼滿分最多加此分到「排名分」(原信心分 score 顯示不變)
    streak_full: 5           # 法人連買達此天數 → 連買項滿分
    foreign_full: 2.0        # 30 日外資持股增加此百分點 → 外資項滿分
    short_cover_thr: 0.05    # 融券較前日減少 ≥ 此(5%)→ 回補項得分
  # stage-2 基本面加成:獲利能力/成長性/財務體質(FinMind 季財報,只對核心候選)。
  # 短線落後指標 → 低權重,主要當體質過濾。enabled:false 可關。
  fundamental_bonus:
    enabled: true
    weight: 5                # 基本面滿分最多加此分(低於籌碼,因短線落後)
    gross_full: 40           # 毛利率達此(%)→ 該項滿分
    operating_full: 20       # 營益率達此(%)→ 滿分
    revenue_yoy_full: 20     # 月營收年增達此(%)→ 滿分
    eps_yoy_full: 30         # EPS 年增達此(%)→ 滿分
    debt_good: 30            # 負債比 ≤ 此 → 體質項滿分
    debt_bad: 70             # 負債比 ≥ 此 → 0 分
  # stage-2 新聞催化劑加成:Claude Haiku 對近 30 天新聞做事件分類(只對核心候選)。
  # 需 ANTHROPIC_API_KEY(沒設自動略過、不報錯)。對短線價值高 → 權重略高於基本面。
  catalyst_bonus:
    enabled: true
    weight: 8                # 催化劑滿分最多加此分
    model: claude-haiku-4-5  # 分類用模型(成本最低)
    max_news: 25             # 每檔最多餵幾則標題
    max_tokens: 800
    full: 1.5                # Σ(confidence×類別權重) 除以此後夾 [0,1]
    # weights:               # 可選:覆寫各催化劑類別權重(預設見 scripts/catalyst.py)

# ★ 進場(跳空保護)— 解決「盤後算的價,隔天跳空就失效」的痛點。
# 系統假設「隔日開盤」進場(貼近實際),並用 max_chase 限制追價:開太高就棄單,不追。
entry:
  fill: next_open       # 以隔日開盤成交模擬(非盤後收盤)
  max_chase: 0.03       # 隔日開盤較選股收盤高 > 3% → 跳空棄單(不追高);可調

# ★ 出場模擬(R 倍數 + 移動停利)— 算「真實交易勝率」,而非固定天期快照。
# 進場=選股日收盤;逐日用最高/最低價判斷,同日雙觸保守假設先觸停損(寧可低估獲利)。
exit:
  hard_stop: 0.07          # 硬性停損上限:虧損絕不超過 -7%(無論技術面)
  r_multiple: 2.0          # 第一停利目標 TP1 = 進場 + 風險R × 2
  max_hold_days: 30        # 最長持有(安全/資料邊界),到期以收盤出場
  # 風格由選股當下自動判定:profile=動能 或 突破觸發 → 動能流;否則 → 波段流
  momentum:                # 強勢動能(隔日沖~5日):停損緊、看 5MA
    struct_lookback: 2     # 初始停損取近 N 根 K 棒最低點(結構低)
    ma_stop: 5             # 未達 TP1 前,收盤跌破 5MA → 停損
    trail_ma: 5            # 啟動移動停利後,收盤跌破 5MA → 出清
  swing:                   # 短波段(5日~1月):停損寬、看 20MA
    struct_lookback: 10    # 近 N 日結構低(近似平台下緣 / 關鍵支撐)
    ma_stop: 20
    trail_ma: 10
  trail:                   # 移動停利回檔幅度,用 ATR 波動估(取代股本分級,意圖相同)
    atr_mult: 1.5          # 回檔% = 1.5 × ATR%
    min_pct: 0.03          # 下限 3%(波動小的大型權值股 → 約 3~4%)
    max_pct: 0.07          # 上限 7%(波動大的中小型股 → 約 5~7%)

# F. 領先 / 醞釀型(舊版,已被上面的 ranking 取代,保留供 screen_stock 標籤用)
leading:
  coiling_squeeze:                 # F1 盤底蓄勢(波動壓縮)
    enabled: true
    lookback: 120                  # 回看天數
    width_pct: 0.15                # 布林帶寬度落在近 120 日最低 15% 分位 → 收斂(相對)
    abs_width_max: 0.06            # 或帶寬已 < 6%(±3%)→ 持續盤整也抓得到(絕對)
    require_volume_contraction: true  # 同時量縮(vol_ma5 < vol_ma20)
    near_ma60_tol: 0.10            # 收盤不可低於季線 10% 以上(避免接刀)

  pullback_to_support:             # F2 回測支撐(多頭回檔)
    enabled: true
    near_pct: 0.03                 # 收盤距 20MA/60MA 在 ±3% 內算「回到支撐」
    min_drawdown: 0.05             # 自近期高點至少回檔 5%
    lookback_high: 20             # 近期高點取近 20 日
    require_turn_up: true          # 需開始轉強(收紅 或 KD 交叉向上)

  relative_strength_leader:        # F3 相對強勢領頭羊
    enabled: true
    rs_min: 1.0                    # 近 60 日報酬須贏大盤(rs_ratio >= 1)
    rising_days: 10                # 且 rs_ratio 較 10 日前上升

  chip_accumulation:               # F4 籌碼吸籌(法人默默布局,價格還沒動)
    enabled: true
    lookback: 10                   # 近 10 個交易日
    min_buy_days: 6                # 至少 6 天法人淨買超
    flat_ret20_max: 0.08           # 但近 20 日股價漲跌幅在 ±8% 內(還沒發動)
    max_scan: 120                  # 每日最多為幾檔「安靜股」額外抓籌碼(控制 API 用量)

# ★ 盤前自動看盤(scripts/premarket.py)— 不影響盤後選股流程
# phase=preopen(約 08:45):抓個股試撮價 + 美股隔夜閘門 → 把昨晚核心10分類 A/B/C、刷掉棄單/作廢
# phase=orb(約 09:25):對 A(平盤)股抓開盤 15 分 1分K → 判斷帶量突破開盤區間高 → 通知可進
premarket:
  enabled: true
  gate:                     # 大盤盤前閘門:美股隔夜(已收)投票決定 risk-on / 中性 / risk-off
    sox_riskon: 1.0         # 費半隔夜 >= +1% 視為偏多一票
    sox_riskoff: -2.0       # 費半隔夜 <= -2% 視為偏空一票(台股權值=半導體,SOX 最相關)
    nq_riskon: 1.0
    nq_riskoff: -1.5
    vix_high: 25            # VIX >= 25 → 偏空一票(預期跳空大、整體轉保守)
  orb:
    range_minutes: 15       # 開盤區間 = 09:00 起算前幾分鐘(09:00–09:15)
    confirm_until: "09:30"  # 突破確認觀察到幾點為止
    volume_filter: true     # 帶量過濾:突破K成交量 > 開盤區間均量 × volume_mult 才算有效(過濾假突破)
    volume_mult: 1.0
  adr:                      # 台股代號 → 美股 ADR ticker(個股級盤前佐證;無 ADR 的股自動略過)
    "2330": TSM             # 台積電
    "2303": UMC             # 聯電
    "3711": ASX             # 日月光投控
    "2317": HNHPF           # 鴻海(OTC ADR,流動性偏低)
    "2409": AUOTY           # 友達

# 多訊號交集組合
combos:
  - name: 主升段啟動
    requires: [bullish_ma_alignment, volume_price_surge, inst_consecutive_buy]
  - name: 底部反轉
    requires: [break_60ma, macd_turn_red, monthly_revenue_growth]
  - name: 強勢續攻
    requires: [bullish_ma_alignment, n_day_high, foreign_holding_increase]
  - name: 保守存股
    requires: [above_240ma, eps_positive_high_yield]
