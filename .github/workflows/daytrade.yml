name: Day Trade (independent)

# 當沖層 —— **與既有選股/盤中掃描完全分開的獨立排程**(使用者要求「獨立出來測試」)。
# 關掉這支 workflow,或把 config/daytrade.yaml 的 enabled 設 false,
# 既有 daily / intraday / premarket 一行都不受影響。
#
# 一天兩段:
#   08:30 台北  建今日標的池(多空兩欄,過六道法規閘門 + 成本帶篩選)
#   09:00 台北  常駐盯水位到 13:35(含停損穿越與 13:00/13:15/13:25 強制回補提醒)
#
# ⚠️ 為什麼盯盤要獨立跑而不是併進 intraday.yml:
# 當沖層還在驗證階段,它掛掉不該連累已經穩定運作的盤中掃描;
# 而且兩者的輪詢節奏、推播頻道、台帳都不同。

on:
  # ⚠️ **不要用 GitHub 內建 schedule**(2026-09-09 事故)。
  # 本專案早就知道內建 schedule 會延遲 5~30 分鐘甚至整天不觸發,daily/premarket 因此
  # 都改走外部 cron(見 SETUP_PREMARKET_CRON.md)。當沖層第一版卻架在內建 schedule 上,
  # 結果 **9/09 整天沒跑**:沒建池、沒盯盤、沒量延遲,網頁還在顯示 9/08 的標的池。
  #
  # 改成掛在「Premarket Watch 跑完」之後 —— 那支是由外部 cron 以 workflow_dispatch
  # 觸發的,實測每天準時。它 08:45 台北跑完,接著建池 + 進盯盤(盯盤本來就會自己
  # 等到 09:00 才開始掃),時序剛好。
  workflow_run:
    workflows: ["Premarket Watch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "pool(建池)/ watch(盯盤)/ scan(單次除錯)/ summary(台帳彙總)"
        required: false
        default: "pool"
        type: choice
        options: ["pool", "watch", "scan", "summary"]

permissions:
  contents: write

# ⚠️ 刻意**不設 concurrency group**。Premarket 一天跑兩班(08:45 / 09:25 台北),
# 兩班都會觸發這支。若設了 group + cancel-in-progress:false,第二班會排隊等第一班的
# 盯盤跑完(4.5 小時)才輪到,白佔一個 queued 位;設 true 又會把正在盯盤的那班砍掉、
# 連當日去重狀態一起丟失。改用下面 run 步驟裡的「今日池已存在就跳過」檔案守衛 ——
# 兩班相隔 40 分鐘,不會有競爭條件。

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 當沖層的錯會直接變成「叫你去做不能做的單」,所以跑之前先過測試。
      - name: Run tests
        run: python tests/run_all.py

      - name: Run
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          MODE="${MODE:-auto}"
          TODAY=$(TZ=Asia/Taipei date +%F)
          NOWHM=$(TZ=Asia/Taipei date +%H:%M)
          echo "daytrade mode=$MODE 台北時間=$TODAY $NOWHM"

          if [ "$MODE" = "auto" ]; then
            # Premarket 一天觸發兩班。第二班(09:25 台北)如果發現今日池已經建好,
            # 就代表第一班已經在盯盤了 → 直接結束,不要起第二個盯盤迴圈。
            # 池子不存在才補做(第一班可能在建池前就掛了,這是自我修復的路徑)。
            if [ -f "data/daytrade/pool-$TODAY.json" ] && [[ "$NOWHM" > "09:05" ]]; then
              echo "今日池已存在且已過 09:05 → 判定先前觸發已在盯盤,跳過。"
              exit 0
            fi
            python -m scripts.daytrade.engine --pool
            # ⚠️ **建完池馬上發布,不能等 job 結束。**
            # 上面那道守衛是在 checkout 出來的 repo 裡找池子檔案,而原本 commit 只在
            # job 最後一步 —— 盯盤 4.5 小時期間檔案根本還沒進 repo,09:25 那一班
            # 永遠找不到 → 兩個盯盤迴圈同時跑、Discord 雙份通知(2026-09-10 實際發生)。
            # 順帶解決另一件事:網頁與盤前卡片本來也要等到 13:35 才更新。
            bash .github/scripts/daytrade-publish.sh "pool $TODAY"
            # 盯盤自己會等到 09:00 才開始掃(in_trading_session),所以 08:45 就進場沒問題。
            python -m scripts.daytrade.engine --watch --until 13:35
          else
            case "$MODE" in
              pool)    python -m scripts.daytrade.engine --pool ;;
              watch)   python -m scripts.daytrade.engine --watch --until 13:35 ;;
              scan)    python -m scripts.daytrade.engine --scan ;;
              summary) python -m scripts.daytrade.engine --summary ;;
            esac
          fi

      - name: Commit daytrade data
        if: always()
        run: bash .github/scripts/daytrade-publish.sh
