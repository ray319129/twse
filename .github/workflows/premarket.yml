name: Premarket Watch

# 觸發改由「外部準時 cron(cron-job.org)→ workflow_dispatch」驅動,因為 GitHub 內建
# schedule 會被排隊延遲 5~30 分;workflow_dispatch 觸發的 run 通常幾秒內啟動 → 準時。
# 設定見 repo 根目錄 SETUP_PREMARKET_CRON.md。也可在 Actions 分頁手動 Run workflow。
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "preopen(盤前 08:45 試撮分類)或 orb(開盤後 09:25 突破判斷)"
        required: false
        default: "preopen"
        type: choice
        options: ["preopen", "orb"]

permissions:
  contents: write

concurrency:
  group: premarket-${{ github.event.inputs.phase }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需完整歷史才能乾淨 pull --rebase / push

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run premarket watch
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}   # 台指期夜盤閘門用(TaiwanFuturesDaily);沒設會退匿名低額度
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          PHASE="${{ github.event.inputs.phase }}"
          PHASE="${PHASE:-preopen}"
          echo "phase=$PHASE"
          python -m scripts.premarket --phase "$PHASE"

      - name: Publish web snapshot
        run: |
          # 核心 0 檔 / 休市 / 抓不到報價時,premarket 不會產生此檔 → 乾淨跳過,不要讓 job 失敗
          if [ ! -f docs/premarket.json ]; then
            echo "No premarket.json produced (no core picks / market closed); nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/premarket.json
          if git diff --cached --quiet; then
            echo "No premarket snapshot change."
          else
            git commit -m "premarket: web snapshot $(date -u +'%Y-%m-%d %H:%M')Z"
            git pull --rebase origin main || true
            git push
          fi
