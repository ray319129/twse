name: Premarket Watch

on:
  schedule:
    # GitHub 的 schedule 事件不保證準時觸發(實測常晚 40 分鐘以上),
    # 改成每 5 分鐘 poll 一次(00:00–02:55 UTC = 08:00–10:55 台北,涵蓋
    # 08:45 盤前快報、09:25 開盤15分 ORB 兩個目標時間 + 緩衝),由
    # scripts/premarket.py --phase auto 自己判斷時間到了沒、今天寄過沒。
    - cron: "*/5 0-2 * * 1-5"
  workflow_dispatch:
    inputs:
      phase:
        description: "手動測試:auto(依現在時間自動判斷)/ preopen(盤前分類)/ orb(開盤15分突破)"
        required: false
        default: "auto"
        type: choice
        options: ["auto", "preopen", "orb"]

permissions:
  contents: write

concurrency:
  group: premarket
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需完整歷史才能乾淨 pull --rebase / push

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run premarket watch
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          # 排程一律 auto(腳本自己依現在時間判斷 preopen/orb,還沒到時間或今天寄過就跳過);
          # 手動觸發可用 inputs.phase 強制指定。
          PHASE="${{ github.event.inputs.phase }}"
          PHASE="${PHASE:-auto}"
          echo "phase=$PHASE"
          python -m scripts.premarket --phase "$PHASE"

      - name: Publish web snapshot
        run: |
          # 核心 0 檔 / 休市 / 抓不到報價時,premarket 不會產生此檔 → 乾淨跳過,不要讓 job 失敗
          if [ ! -f docs/premarket.json ]; then
            echo "No premarket.json produced (no core picks / market closed); nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/premarket.json
          if git diff --cached --quiet; then
            echo "No premarket snapshot change."
          else
            git commit -m "premarket: web snapshot $(date -u +'%Y-%m-%d %H:%M')Z"
            git pull --rebase origin main || true
            git push
          fi
