name: Daily Screener

on:
  schedule:
    # GitHub 的 schedule 事件不保證準時觸發(實測常晚 1~2 小時),改成每 5 分鐘
    # poll 一次(08:00–11:55 UTC = 16:00–19:55 台北,涵蓋 16:30 目標時間 + 緩衝)。
    # 「Check if due」步驟會擋掉還沒到時間 / 今天已經跑過的 tick,不會重複跑全市場掃描。
    - cron: "*/5 8-11 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Send email with [測試] prefix"
        required: false
        default: "false"
      date:
        description: "歷史測試基準日 YYYY-MM-DD(留空=跑當天)。指定後只用本機快取價格、寄[測試]信,且不提交/覆蓋線上資料"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check if due
        id: gate
        run: |
          # 手動觸發一律放行;排程觸發(高頻 poll)才需要擋『還沒到 16:30』或『今天已經跑過』,
          # 避免每 5 分鐘的 tick 重複跑一次全市場掃描。
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today_tpe=$(TZ=Asia/Taipei date +%Y-%m-%d)
          now_hhmm=$(TZ=Asia/Taipei date +%H:%M)
          if [ -f "data/signals/${today_tpe}.json" ]; then
            echo "今日($today_tpe)已經跑過 daily screener,略過。"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [[ "$now_hhmm" < "16:30" ]]; then
            echo "還沒到 16:30(現在 $now_hhmm 台北),略過。"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        if: steps.gate.outputs.should_run == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily screener
        if: steps.gate.outputs.should_run == 'true'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python -m scripts.main --date "${{ github.event.inputs.date }}"
          elif [ "${{ github.event.inputs.test }}" = "true" ]; then
            python -m scripts.main --test
          else
            python -m scripts.main
          fi

      - name: Commit data updates
        if: ${{ steps.gate.outputs.should_run == 'true' && github.event.inputs.date == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date -u +'%Y-%m-%d') daily update"
            git push
          else
            echo "No data changes to commit."
          fi
