name: Daily Screener

# 觸發改由外部準時 cron(cron-job.org)→ workflow_dispatch(GitHub 內建 schedule 會延遲)。
# 設定見 repo 根目錄 SETUP_PREMARKET_CRON.md。也可在 Actions 分頁手動 Run workflow。
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Send email with [測試] prefix"
        required: false
        default: "false"
      date:
        description: "歷史測試基準日 YYYY-MM-DD(留空=跑當天)。指定後只用本機快取價格、寄[測試]信,且不提交/覆蓋線上資料"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需完整歷史才能乾淨 pull --rebase / push(與 premarket 並存避免衝突)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily screener
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 選用:新聞催化劑 AI 分類;沒設就自動略過
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python -m scripts.main --date "${{ github.event.inputs.date }}"
          elif [ "${{ github.event.inputs.test }}" = "true" ]; then
            python -m scripts.main --test
          else
            python -m scripts.main
          fi

      - name: Commit data updates
        if: ${{ github.event.inputs.date == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date -u +'%Y-%m-%d') daily update"
            git pull --rebase origin main || true
            git push
          else
            echo "No data changes to commit."
          fi
