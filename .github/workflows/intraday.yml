name: Intraday Signal Scan

# 盤中全市場掃描 + 訊號提醒。對標「起漲K線」那類軟體的自動盯盤,但規則寫在
# scripts/intraday_scan.py 裡看得見,而且每次觸發都會存進 data/alerts/ 供事後驗證。
#
# 觸發同 premarket:外部 cron(cron-job.org)→ workflow_dispatch。
#   08:50 一次 mode=levels  ← 盤前算好均線/前高快取(必要,否則掃描會跳過)
#   09:05~13:25 每 5 分鐘 mode=scan
#
# **同一檔同一種訊號當日只會通知一次**(去重狀態存 data/alerts/YYYY-MM-DD.json),
# 所以「每 5 分鐘跑一次」不會變成每 5 分鐘一封信 —— 沒有新訊號時完全不寄、不 commit。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "levels(盤前建快取)/ watch(常駐盯盤,建議)/ scan(單次)/ freshness(量上游更新頻率)"
        required: false
        default: "watch"
        type: choice
        options: ["watch", "levels", "scan", "freshness"]
      interval:
        description: "watch 模式的輪詢間隔秒數(預設 20)"
        required: false
        default: "20"
        type: string

permissions:
  contents: write

concurrency:
  group: intraday          # 不分 mode:避免兩個 run 同時改 data/alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # watch 模式要從 08:55 跑到 13:35(4.5 小時)。GitHub Actions 單一 job 上限 6 小時,
    # 塞得下。公開 repo 的標準 runner 分鐘數不計費。
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          MODE="${{ github.event.inputs.mode }}"; MODE="${MODE:-watch}"
          IV="${{ github.event.inputs.interval }}"; IV="${IV:-20}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "$MODE" in
            levels)    python -m scripts.intraday_scan --build-levels ;;
            scan)      python -m scripts.intraday_scan ;;
            freshness) python -m scripts.intraday_scan --measure-freshness 120 ;;
            # 常駐:環境只裝一次,之後純輪詢。--publish 讓有新訊號時當場推上去,
            # 網頁不用等到收盤才看得到。
            watch)     python -m scripts.intraday_scan --loop --interval "$IV" --until 13:35 --publish ;;
          esac

      - name: Commit alerts
        run: |
          # 沒有新訊號 → 沒有檔案變動 → 乾淨跳過(不會產生每 5 分鐘一個 commit)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alerts data/levels.parquet docs/alerts.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new signals."
          else
            git commit -m "intraday: signals $(date -u +'%Y-%m-%d %H:%M')Z"
            git pull --rebase origin main || true
            git push
          fi
