name: Intraday Signal Scan

# 盤中全市場掃描 + 訊號提醒。對標「起漲K線」那類軟體的自動盯盤,但規則寫在
# scripts/intraday_scan.py 裡看得見,而且每次觸發都會存進 data/alerts/ 供事後驗證。
#
# **一個排程搞定整個盤中,使用者不必手動點任何東西**(2026-07-20 改):
#   08:20 觸發 → 自動重建 levels → 睡到 09:00 → 每 20 秒掃到 13:35
#   途中每 10 分鐘更新內外盤比與走勢線,並在 7 個檢查點存全市場快照
# 因此 **不再需要**「08:50 build-levels」與「snapshot 存檔」這兩條獨立排程。
#
# **同一檔同一種訊號當日只會通知一次**(去重狀態存 data/alerts/YYYY-MM-DD.json),
# 所以「每 5 分鐘跑一次」不會變成每 5 分鐘一封信 —— 沒有新訊號時完全不寄、不 commit。
on:
  # ⚠️ 這裡**刻意用 GitHub 內建 schedule**,與 daily/premarket 的作法不同。
  # 那兩個當初改走外部 cron 是因為內建 schedule 會延遲 5~30 分鐘、影響準時性。
  # 但 watch 模式的 job **自己會等到 09:00 才開始掃**(見 intraday_scan._sleep_until),
  # 所以延遲變成無害 —— 早觸發就等、晚觸發就直接開始。
  # 好處:使用者完全不必手動點,也不必到 cron-job.org 設定。
  #
  # cron 是 UTC,台北 = UTC+8。00:20 UTC = 08:20 台北(留 40 分鐘給排程延遲)。
  # 週一~週五觸發;遇到台灣的假日/颱風假,快照時間戳不是今天 → scan 自己會跳過。
  schedule:
    - cron: "20 0 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "watch(常駐盯盤,建議)/ scan(單次)/ levels(盤前建快取)/ freshness / test-discord(發測試卡驗通知)"
        required: false
        default: "watch"
        type: choice
        # test-discord:**收盤/假日也能跑**。webhook 密鑰只存在 GitHub secret,
        # 本機沒有,所以驗證通知管道一定要有一個能從 Actions 點的入口(2026-07-21 補)。
        options: ["watch", "levels", "scan", "freshness", "test-discord"]
      interval:
        description: "watch 模式的輪詢間隔秒數(預設 10 = 上游更新頻率)"
        required: false
        # 10 秒:FinMind 官方文件寫明 tick_snapshot「約 10 秒更新一次」,本專案實測
        # 中位間隔約 11 秒 —— 兩邊對得上。原本設 20 等於只取樣一半,訊號白白晚 10 秒。
        # 額度:10 秒 → 4.5 小時約 1620 次,上限 6000/hr,用掉不到 7%。
        default: "10"
        type: string

permissions:
  contents: write

concurrency:
  group: intraday          # 不分 mode:避免兩個 run 同時改 data/alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # watch 模式要從 08:55 跑到 13:35(4.5 小時)。GitHub Actions 單一 job 上限 6 小時,
    # 塞得下。公開 repo 的標準 runner 分鐘數不計費。
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # 盤中/盤前通知改推 Discord;沒設這個 secret 會自動退回 Email。
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MODE="${{ github.event.inputs.mode }}"; MODE="${MODE:-watch}"
          IV="${{ github.event.inputs.interval }}"; IV="${IV:-10}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "$MODE" in
            levels)       python -m scripts.intraday_scan --build-levels ;;
            scan)         python -m scripts.intraday_scan ;;
            freshness)    python -m scripts.intraday_scan --measure-freshness 120 ;;
            test-discord) python -m scripts.intraday_scan --test-discord ;;
            # 常駐:環境只裝一次,之後純輪詢。--publish 讓有新訊號時當場推上去,
            # 網頁不用等到收盤才看得到。
            # --start 09:00:自己等到開盤,順便自動重建過期的 levels(不必另設 08:50 排程)
            # 內含 7 個檢查點的全市場快照存檔(不必另設 snapshot 排程)
            watch)     python -m scripts.intraday_scan --loop --interval "$IV"                          --start 09:00 --until 13:35 --publish ;;
          esac

      - name: Commit alerts
        run: |
          # 沒有新訊號 → 沒有檔案變動 → 乾淨跳過(不會產生每 5 分鐘一個 commit)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alerts data/levels.parquet data/snapshots                   docs/alerts.json docs/levels.json docs/deep.json docs/series.json                   docs/freshness.json docs/pulse.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new signals."
          else
            git commit -m "intraday: signals $(date -u +'%Y-%m-%d %H:%M')Z"
            git pull --rebase origin main || true
            git push
          fi
